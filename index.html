/* ==========================================
   BET
========================================== */

window.currentBet = 5;

function changeBet(amount){

    if(!window.currentBet)
        window.currentBet = 5;

    if(amount === 10){

        window.currentBet =
            Math.min(50,Math.max(5,balance));

    }else{

        window.currentBet += amount;

        if(window.currentBet < 5)
            window.currentBet = 5;

        if(window.currentBet > 50)
            window.currentBet = 50;

        if(window.currentBet > balance)
            window.currentBet = Math.max(5,balance);
    }

    const el =
        document.getElementById("betValue");

    if(el)
        el.textContent =
            window.currentBet;
}

function randomSymbol(){

    const r =
        Math.random();

    if(r < .08) return "7️⃣";
    if(r < .18) return "💎";
    if(r < .30) return "⭐";
    if(r < .42) return "🔔";
    if(r < .62) return "🍒";
    if(r < .81) return "🍋";

    return "🍊";
}


/* ==========================================
   SPIN
========================================== */

function spin777(){

    if(spinning)
        return;

    const bet =
        window.currentBet || 5;

    const message =
        document.getElementById("slotMessage");

    const warning =
        document.getElementById("warning");

    const button =
        document.getElementById("spinBtn");

    if(balance < bet){

        warning.textContent =
            "Недостатньо YMY для цієї ставки.";

        return;
    }

    warning.textContent = "";

    balance -= bet;

    updateBalance();

    spinning = true;

    button.disabled = true;

    message.textContent = "";
    message.className = "slot-message";

    const reels = [
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
    ];

    reels.forEach(reel=>{
        reel.classList.remove("win");
        reel.classList.add("spinning");
    });

    let tick = 0;

    const animation =
        setInterval(()=>{

            reels.forEach(reel=>{
                reel.textContent =
                    symbols[
                        Math.floor(
                            Math.random()*symbols.length
                        )
                    ];
            });

            tick++;

            if(tick >= 22){

                clearInterval(animation);

                finishSpin(reels,bet);

            }

        },90);
}


/* ==========================================
   FINISH
========================================== */

function finishSpin(reels,bet){

    const result = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

    /*
      Небольшой шанс на красивые
      выигрышные комбинации.
    */

    const luck =
        Math.random();

    if(luck < .035){

        result[0] =
        result[1] =
        result[2] = "7️⃣";

    }else if(luck < .075){

        const s = randomSymbol();

        result[0] =
        result[1] =
        result[2] = s;

    }

    reels.forEach((reel,i)=>{

        reel.classList.remove("spinning");

        reel.textContent =
            result[i];

    });

    const same =
        result[0] === result[1] &&
        result[1] === result[2];

    let win = 0;

    if(same){

        win =
            bet *
            (payouts[result[0]] || 2);

    }else if(
        result[0] === result[1] ||
        result[1] === result[2] ||
        result[0] === result[2]
    ){

        win =
            bet * 2;
    }

    const message =
        document.getElementById("slotMessage");

    if(win > 0){

        balance += win;

        updateBalance();

        reels.forEach(reel=>{
            reel.classList.add("win");
        });

        message.className =
            "slot-message win";

        message.textContent =
            `🎉 ВИГРАШ +${win} YMY`;

    }else{

        message.className =
            "slot-message lose";

        message.textContent =
            `Ставка ${bet} YMY. Спробуйте ще раз.`;
    }

    save();

    spinning = false;

    const button =
        document.getElementById("spinBtn");

    if(button)
        button.disabled = false;
}

/* ==========================================
   PAGES
========================================== */

function showPage(page){

    currentPage = page;

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");

            if(btn.dataset.page === page)
                btn.classList.add("active");
        });

    if(page === "games")
        gamesPage();

    if(page === "bonus")
        bonusPage();

    if(page === "profile")
        profilePage();
}
