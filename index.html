<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>YesMoneY — Neon Slots</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070812;
    --panel:#101322;
    --panel2:#171a2d;
    --line:rgba(255,255,255,.09);
    --text:#fff;
    --muted:rgba(255,255,255,.48);
    --purple:#806cff;
    --purple2:#b06cff;
    --green:#49e39b;
    --red:#ff557a;
    --gold:#ffd76a;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 50% -10%,#31255f 0%,transparent 38%),
        radial-gradient(circle at 0% 50%,#16183a 0%,transparent 30%),
        var(--bg);
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

.hidden{
    display:none!important;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
    padding-bottom:85px;
}

.topbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--line);
    background:rgba(7,8,18,.78);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.brand span{
    color:var(--purple2);
}

.balance-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 13px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
}

.balance-icon{
    font-size:17px;
}

#balance{
    font-weight:900;
}

/* =========================
   GAME HEADER
========================= */

.game-header{
    max-width:620px;
    margin:auto;
    padding:25px 16px 15px;
}

.back-btn{
    border:none;
    color:var(--muted);
    background:none;
    font-size:14px;
    margin-bottom:18px;
}

.game-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.game-title{
    font-size:29px;
    font-weight:900;
}

.game-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.demo-label{
    padding:6px 9px;
    border-radius:8px;
    background:rgba(128,108,255,.12);
    color:#aa9dff;
    border:1px solid rgba(128,108,255,.2);
    font-size:10px;
    font-weight:800;
}

/* =========================
   MACHINE
========================= */

.machine{
    width:calc(100% - 24px);
    max-width:620px;
    margin:auto;
    padding:12px;
    border-radius:27px;
    background:
        linear-gradient(145deg,#252042,#111322 50%,#211b39);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 60px rgba(128,108,255,.09);
    position:relative;
    overflow:hidden;
}

.machine::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.035),
            transparent
        );
}

/* =========================
   TOP DECORATION
========================= */

.machine-top{
    height:65px;
    border-radius:18px 18px 10px 10px;
    background:
        linear-gradient(180deg,#29234a,#16182b);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:10px;
}

.machine-top::before,
.machine-top::after{
    content:"";
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--purple);
    box-shadow:0 0 15px var(--purple);
    position:absolute;
}

.machine-top::before{
    left:20px;
}

.machine-top::after{
    right:20px;
}

.machine-logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 0 20px rgba(176,108,255,.65);
}

/* =========================
   REELS
========================= */

.reels-frame{
    padding:9px;
    border-radius:20px;
    background:#080a13;
    border:2px solid rgba(255,255,255,.08);
    box-shadow:
        inset 0 0 35px rgba(0,0,0,.75),
        0 8px 20px rgba(0,0,0,.35);
}

.reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.reel{
    height:150px;
    border-radius:13px;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #22253b,
            #0e101c 50%,
            #22253b
        );
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:inset 0 0 25px rgba(0,0,0,.6);
}

.reel::before,
.reel::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:35px;
    z-index:2;
    pointer-events:none;
}

.reel::before{
    top:0;
    background:linear-gradient(#0b0c15,transparent);
}

.reel::after{
    bottom:0;
    background:linear-gradient(transparent,#0b0c15);
}

.symbol{
    font-size:57px;
    position:relative;
    z-index:1;
    filter:drop-shadow(0 5px 9px rgba(0,0,0,.45));
}

.reel.spinning .symbol{
    animation:
        reelBlur .09s linear infinite;
}

@keyframes reelBlur{
    0%{transform:translateY(-18px) scale(.9);filter:blur(2px)}
    50%{transform:translateY(18px) scale(1.05);filter:blur(1px)}
    100%{transform:translateY(-18px) scale(.9);filter:blur(2px)}
}

/* winning effect */

.reel.win{
    border-color:rgba(255,215,106,.8);
    box-shadow:
        inset 0 0 25px rgba(255,215,106,.15),
        0 0 25px rgba(255,215,106,.35);
    animation:winPulse .55s ease-in-out infinite alternate;
}

@keyframes winPulse{
    from{transform:scale(1)}
    to{transform:scale(1.025)}
}

/* =========================
   RESULT
========================= */

.result{
    min-height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
}

.result-text{
    font-size:15px;
    color:var(--muted);
}

.result-text.win{
    color:var(--gold);
    font-weight:900;
    font-size:18px;
    text-shadow:0 0 15px rgba(255,215,106,.4);
}

.result-text.lose{
    color:var(--muted);
}

/* =========================
   BET
========================= */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.control-box{
    padding:11px;
    border-radius:13px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
}

.control-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:8px;
    letter-spacing:.5px;
}

.bet-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.bet-btn{
    width:31px;
    height:31px;
    border:none;
    border-radius:9px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:18px;
}

.bet-value{
    font-weight:900;
}

/* =========================
   SPIN
========================= */

.spin-button{
    width:100%;
    margin-top:11px;
    height:58px;
    border:none;
    border-radius:16px;
    color:white;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--purple2)
        );
    box-shadow:
        0 10px 30px rgba(128,108,255,.3),
        inset 0 1px rgba(255,255,255,.25);
    position:relative;
    overflow:hidden;
}

.spin-button::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.18),
        transparent
    );
    transform:skewX(-20deg);
    animation:buttonShine 3s infinite;
}

@keyframes buttonShine{
    0%{left:-100%}
    30%,100%{left:150%}
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   PAYTABLE
========================= */

.paytable{
    max-width:620px;
    margin:15px auto 0;
    padding:0 12px;
}

.paytable-box{
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
}

.section-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:12px;
}

.pay-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.pay-row:last-child{
    border-bottom:none;
}

.pay-symbols{
    font-size:20px;
    letter-spacing:2px;
}

.pay-multiplier{
    color:var(--gold);
    font-weight:900;
}

/* =========================
   HISTORY
========================= */

.history{
    max-width:620px;
    margin:15px auto;
    padding:0 12px;
}

.history-box{
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
}

.history-list{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
}

.history-item{
    min-width:66px;
    padding:9px 7px;
    text-align:center;
    border-radius:11px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.05);
}

.history-symbols{
    font-size:16px;
}

.history-value{
    margin-top:5px;
    font-size:10px;
    font-weight:800;
}

.history-value.plus{
    color:var(--green);
}

.history-value.minus{
    color:var(--red);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(8,9,17,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
}

.nav{
    border:none;
    background:none;
    color:rgba(255,255,255,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:10px;
}

.nav-icon{
    font-size:22px;
}

.nav.active{
    color:white;
}

.nav.active .nav-icon{
    filter:drop-shadow(0 0 9px rgba(176,108,255,.9));
}

/* =========================
   NOTIFICATION
========================= */

.notification{
    position:fixed;
    z-index:100;
    left:50%;
    top:82px;
    transform:translateX(-50%) translateY(-20px);
    opacity:0;
    pointer-events:none;
    min-width:250px;
    max-width:calc(100% - 30px);
    padding:13px 16px;
    border-radius:13px;
    background:#171a2b;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    text-align:center;
    transition:.3s;
    font-size:13px;
    font-weight:700;
}

.notification.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .machine{
        padding:18px;
    }

    .reel{
        height:190px;
    }

    .symbol{
        font-size:70px;
    }

    .bottom-nav{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:600px;
        border-radius:18px 18px 0 0;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        Yes<span>MoneY</span>
    </div>

    <div class="balance-box">
        <span class="balance-icon">💰</span>
        <span id="balance">50</span>
        <span>YMY</span>
    </div>

</header>


<section class="game-header">

    <button class="back-btn" onclick="goBack()">
        ← Назад
    </button>

    <div class="game-title-row">

        <div>
            <div class="game-title">
                Neon Slots
            </div>

            <div class="game-subtitle">
                Класичні оберти у новому стилі
            </div>
        </div>

        <div class="demo-label">
            DEMO
        </div>

    </div>

</section>


<!-- =========================
     SLOT MACHINE
========================= -->

<section class="machine">

    <div class="machine-top">
        <div class="machine-logo">
            NEON
        </div>
    </div>


    <div class="reels-frame">

        <div class="reels">

            <div class="reel" id="reel0">
                <div class="symbol" id="symbol0">💎</div>
            </div>

            <div class="reel" id="reel1">
                <div class="symbol" id="symbol1">7️⃣</div>
            </div>

            <div class="reel" id="reel2">
                <div class="symbol" id="symbol2">🍀</div>
            </div>

        </div>

    </div>


    <div class="result">

        <div
            class="result-text"
            id="resultText">

            Зробіть ставку та натисніть ГРАТИ

        </div>

    </div>


    <div class="controls">

        <div class="control-box">

            <span class="control-label">
                Ставка
            </span>

            <div class="bet-row">

                <button
                    class="bet-btn"
                    onclick="changeBet(-5)">
                    −
                </button>

                <span
                    class="bet-value"
                    id="bet">
                    5 YMY
                </span>

                <button
                    class="bet-btn"
                    onclick="changeBet(5)">
                    +
                </button>

            </div>

        </div>


        <div class="control-box">

            <span class="control-label">
                Максимальна виплата
            </span>

            <div class="bet-row">

                <span class="bet-value">
                    x20
                </span>

            </div>

        </div>

    </div>


    <button
        class="spin-button"
        id="spinButton"
        onclick="spin()">

        🎰 ГРАТИ

    </button>

</section>


<!-- =========================
     PAYTABLE
========================= -->

<section class="paytable">

    <div class="paytable-box">

        <div class="section-title">
            Таблиця виплат
        </div>

        <div class="pay-row">
            <span class="pay-symbols">7️⃣ 7️⃣ 7️⃣</span>
            <span class="pay-multiplier">x20</span>
        </div>

        <div class="pay-row">
            <span class="pay-symbols">💎 💎 💎</span>
            <span class="pay-multiplier">x12</span>
        </div>

        <div class="pay-row">
            <span class="pay-symbols">👑 👑 👑</span>
            <span class="pay-multiplier">x8</span>
        </div>

        <div class="pay-row">
            <span class="pay-symbols">🍀 🍀 🍀</span>
            <span class="pay-multiplier">x6</span>
        </div>

        <div class="pay-row">
            <span class="pay-symbols">🍒 🍒 🍒</span>
            <span class="pay-multiplier">x4</span>
        </div>

    </div>

</section>


<!-- =========================
     HISTORY
========================= -->

<section class="history">

    <div class="history-box">

        <div class="section-title">
            Останні результати
        </div>

        <div
            class="history-list"
            id="historyList">

            <div class="history-item">
                <div class="history-symbols">
                    💎💎🍀
                </div>
                <div class="history-value minus">
                    -5
                </div>
            </div>

            <div class="history-item">
                <div class="history-symbols">
                    🍒🍒🍒
                </div>
                <div class="history-value plus">
                    +20
                </div>
            </div>

            <div class="history-item">
                <div class="history-symbols">
                    👑🍀💎
                </div>
                <div class="history-value minus">
                    -5
                </div>
            </div>

        </div>

    </div>

</section>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button class="nav active" onclick="showMessage('Ігри')">
        <span class="nav-icon">🎮</span>
        <span>Грати</span>
    </button>

    <button class="nav" onclick="showMessage('Бонуси')">
        <span class="nav-icon">🎁</span>
        <span>Бонус</span>
    </button>

    <button class="nav" onclick="showMessage('Барабан')">
        <span class="nav-icon">🎰</span>
        <span>Барабан</span>
    </button>

    <button class="nav" onclick="showMessage('Профіль')">
        <span class="nav-icon">👤</span>
        <span>Профіль</span>
    </button>

</nav>

</div>


<div
    class="notification"
    id="notification">
</div>


<script>

/* =========================
   DATA
========================= */

const symbols = [
    "🍒",
    "🍀",
    "💎",
    "👑",
    "7️⃣"
];

const multipliers = {
    "🍒":4,
    "🍀":6,
    "👑":8,
    "💎":12,
    "7️⃣":20
};

let balance =
    Number(localStorage.getItem("ymyBalance"));

if (!Number.isFinite(balance)) {
    balance = 50;
}

let bet = 5;

let spinning = false;

let history = [];


/* =========================
   ELEMENTS
========================= */

const balanceElement =
    document.getElementById("balance");

const betElement =
    document.getElementById("bet");

const resultText =
    document.getElementById("resultText");

const spinButton =
    document.getElementById("spinButton");


/* =========================
   BALANCE
========================= */

function updateBalance(){

    balanceElement.textContent =
        Math.floor(balance);

    localStorage.setItem(
        "ymyBalance",
        balance
    );
}


/* =========================
   BET
========================= */

function changeBet(value){

    if(spinning) return;

    bet += value;

    if(bet < 5){
        bet = 5;
    }

    if(bet > 50){
        bet = 50;
    }

    if(bet > balance){
        bet = Math.max(5,Math.floor(balance));
    }

    betElement.textContent =
        bet + " YMY";
}


/* =========================
   RANDOM SYMBOL
========================= */

function randomSymbol(){

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];
}


/* =========================
   SPIN
========================= */

function spin(){

    if(spinning) return;

    if(balance < bet){

        showNotification(
            "Недостатньо YMY для цієї ставки"
        );

        return;
    }

    spinning = true;

    spinButton.disabled = true;

    resultText.className =
        "result-text";

    resultText.textContent =
        "🎰 Обертання...";


    balance -= bet;

    updateBalance();


    document
        .querySelectorAll(".reel")
        .forEach(reel => {

            reel.classList.remove("win");
            reel.classList.add("spinning");

        });


    const finalSymbols = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];


    /* animation */

    let cycles = 0;

    const animation =
        setInterval(() => {

            for(let i=0;i<3;i++){

                document
                    .getElementById("symbol"+i)
                    .textContent =
                    randomSymbol();

            }

            cycles++;

            if(cycles >= 22){

                clearInterval(animation);

                finishSpin(finalSymbols);

            }

        },90);
}


/* =========================
   FINISH
========================= */

function finishSpin(finalSymbols){

    for(let i=0;i<3;i++){

        document
            .getElementById("symbol"+i)
            .textContent =
            finalSymbols[i];

        document
            .getElementById("reel"+i)
            .classList.remove("spinning");

    }


    const [a,b,c] =
        finalSymbols;


    let win = 0;

    let winning = false;


    /* three equal */

    if(a === b && b === c){

        win =
            bet *
            multipliers[a];

        winning = true;

    }

    /* two equal */

    else if(a === b || a === c || b === c){

        win =
            bet * 2;

        winning = true;

    }


    if(win > 0){

        balance += win;

        resultText.textContent =
            "🎉 ВИГРАШ +" +
            win +
            " YMY";

        resultText.className =
            "result-text win";


        if(
            a === b &&
            b === c
        ){

            document
                .querySelectorAll(".reel")
                .forEach(reel => {

                    reel.classList.add("win");

                });

        }

    }else{

        resultText.textContent =
            "Цього разу без виграшу";

        resultText.className =
            "result-text lose";

    }


    updateBalance();


    addHistory(
        finalSymbols,
        win
    );


    spinning = false;

    spinButton.disabled = false;


    if(win > 0){

        showNotification(
            "🎉 Вітаємо! Ви виграли " +
            win +
            " YMY"
        );

    }

}


/* =========================
   HISTORY
========================= */

function addHistory(symbolsResult, win){

    history.unshift({
        symbols:symbolsResult,
        win:win
    });

    history =
        history.slice(0,8);


    renderHistory();
}


function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );


    container.innerHTML = "";


    history.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "history-item";


        div.innerHTML = `

            <div class="history-symbols">
                ${item.symbols.join("")}
            </div>

            <div class="history-value ${
                item.win > 0
                ? "plus"
                : "minus"
            }">

                ${
                    item.win > 0
                    ? "+" + item.win
                    : "-" + bet
                }

            </div>

        `;


        container.appendChild(div);

    });

}


/* =========================
   NOTIFICATION
========================= */

let notificationTimer;

function showNotification(text){

    const notification =
        document.getElementById(
            "notification"
        );


    notification.textContent =
        text;

    notification.classList.add(
        "show"
    );


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(() => {

            notification.classList.remove(
                "show"
            );

        },2500);
}
