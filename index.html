<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YesMoneY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#070707;
 --panel:#11100d;
 --panel2:#17140e;
 --gold:#ffd45a;
 --gold2:#ff9d18;
 --text:#fff;
 --muted:#918b7d;
 --green:#35e08b;
 --red:#ff4f5e;
}
body{
 font-family:Arial,sans-serif;
 background:
 radial-gradient(circle at 50% -10%,#4b3711 0,#171208 25%,#070707 65%);
 color:var(--text);
 min-height:100vh;
 overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* WELCOME */
#welcome{
 min-height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:25px;
 text-align:center;
}
.logo{
 font-size:43px;
 font-weight:1000;
 letter-spacing:2px;
 color:#fff;
 text-shadow:0 0 20px rgba(255,190,45,.5);
}
.logo b{color:var(--gold)}
.welcome-title{
 font-size:26px;
 margin:22px 0 10px;
}
.welcome-text{
 color:var(--muted);
 max-width:420px;
 line-height:1.6;
}
.welcome-btn{
 margin-top:25px;
 padding:15px 35px;
 border:0;
 border-radius:15px;
 color:#171006;
 font-weight:900;
 background:linear-gradient(135deg,#ffe58a,#ffad24);
 box-shadow:0 0 30px rgba(255,190,45,.35);
}

/* APP */
#app{padding-bottom:90px}
.topbar{
 position:sticky;
 top:0;
 z-index:20;
 padding:15px 16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:rgba(7,7,7,.9);
 backdrop-filter:blur(15px);
 border-bottom:1px solid rgba(255,210,70,.12);
}
.top-logo{font-size:23px;font-weight:1000}
.top-logo span{color:var(--gold)}
.balance{
 padding:9px 13px;
 border-radius:13px;
 background:linear-gradient(135deg,#211b0c,#11100c);
 border:1px solid rgba(255,210,70,.2);
 color:var(--gold);
 font-weight:900;
}
.content{max-width:760px;margin:auto;padding:15px}
.page-title{font-size:29px;margin:12px 0 5px}
.page-sub{color:var(--muted);margin-bottom:20px}

/* HOME */
.hero{
 position:relative;
 min-height:190px;
 padding:25px;
 border-radius:25px;
 overflow:hidden;
 background:
 radial-gradient(circle at 80% 20%,rgba(255,205,70,.35),transparent 30%),
 linear-gradient(135deg,#30240c,#100e09 65%);
 border:1px solid rgba(255,210,70,.2);
 box-shadow:0 0 35px rgba(255,190,40,.1);
}
.hero:after{
 content:"";
 position:absolute;
 width:180px;height:180px;
 right:-55px;bottom:-90px;
 border-radius:50%;
 border:30px solid rgba(255,210,70,.08);
}
.hero h1{font-size:30px}
.hero p{color:#b9ad91;margin-top:10px;line-height:1.5}
.hero .shine{
 position:absolute;
 width:100px;height:300px;
 background:rgba(255,255,255,.06);
 transform:rotate(30deg);
 top:-100px;left:-130px;
 animation:shine 5s infinite;
}
@keyframes shine{
 0%{left:-130px}
 40%,100%{left:110%}
}
.games{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:13px;
 margin-top:18px;
}
.game{
 min-height:175px;
 border-radius:21px;
 overflow:hidden;
 position:relative;
 border:1px solid rgba(255,210,70,.15);
 background:#100f0c;
 box-shadow:0 8px 25px rgba(0,0,0,.3);
 transition:.2s;
}
.game:active{transform:scale(.97)}
.cover{
 height:112px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:55px;
 position:relative;
 overflow:hidden;
}
.cover:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(transparent,rgba(0,0,0,.65));
}
.cover777{background:radial-gradient(circle,#8c6813,#2a1c04 70%)}
.coverCrash{background:radial-gradient(circle at 50% 80%,#ffb329,#211605 60%)}
.coverLines{background:radial-gradient(circle,#245f45,#07150f 70%)}
.coverCards{background:radial-gradient(circle,#8d2020,#200707 70%)}
.game-info{padding:10px 12px}
.game-info strong{font-size:15px}
.game-info small{display:block;color:#817b6e;margin-top:4px}
.game-badge{
 position:absolute;
 top:9px;left:9px;
 z-index:2;
 padding:5px 8px;
 border-radius:8px;
 background:rgba(0,0,0,.65);
 color:var(--gold);
 font-size:10px;
 font-weight:900;
}

/* NAV */
.bottom-nav{
 position:fixed;
 bottom:0;left:0;right:0;
 height:76px;
 z-index:50;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 background:rgba(8,8,8,.96);
 border-top:1px solid rgba(255,210,70,.14);
 backdrop-filter:blur(18px);
}
.nav-btn{
 border:0;background:none;color:#686359;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:5px;
}
.nav-btn .ico{font-size:23px}
.nav-btn.active{color:var(--gold)}
.nav-btn.active .ico{filter:drop-shadow(0 0 10px #ffbd27)}

/* GAME SCREEN */
.game-screen{
 background:linear-gradient(180deg,#12100b,#080808);
 border:1px solid rgba(255,210,70,.15);
 border-radius:25px;
 padding:15px;
}
.back{
 border:0;background:none;color:#aaa;
 font-size:14px;margin-bottom:15px;
}
.game-head{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:15px;
}
.game-head h2{color:var(--gold)}
.play-btn{
 border:0;border-radius:13px;
 padding:13px 20px;
 font-weight:900;
 color:#130e04;
 background:linear-gradient(135deg,#ffe68a,#ff9f1d);
 box-shadow:0 0 20px rgba(255,180,30,.25);
}
.play-btn:disabled{opacity:.4}

/* CRASH */
.crash{
 height:320px;
 position:relative;
 overflow:hidden;
 border-radius:20px;
 background:
 linear-gradient(180deg,rgba(255,196,50,.08),transparent),
 #090a0d;
 border:1px solid rgba(255,255,255,.07);
}
.gridbg{
 position:absolute;inset:0;
 background-image:
 linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
 background-size:45px 45px;
}
.mult{
 position:absolute;
 inset:70px 0 auto;
 text-align:center;
 font-size:52px;
 font-weight:1000;
 color:var(--gold);
 text-shadow:0 0 25px #ff9e16;
}
.plane{
 position:absolute;
 left:35px;
 bottom:35px;
 font-size:40px;
 transition:.08s linear;
 filter:drop-shadow(0 0 12px #ffb42b);
}
.crash-line{
 position:absolute;
 left:30px;bottom:35px;
 height:4px;width:0;
 background:linear-gradient(90deg,#ffad20,#ffe27a);
 box-shadow:0 0 12px #ffad20;
 transform-origin:left;
 transform:rotate(-25deg);
}
.crash-controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;margin-top:12px;
}
.bet{
 background:#12110d;
 border:1px solid #302b20;
 color:white;
 padding:13px;border-radius:12px;
}
.cash{
 width:100%;
 margin-top:10px;
 border:0;border-radius:14px;
 padding:15px;
 background:linear-gradient(135deg,#35e08b,#15a967);
 color:#04170e;
 font-weight:1000;
}
.history{
 display:flex;gap:7px;overflow:auto;margin-top:12px;
}
.history span{
 padding:7px 9px;border-radius:8px;
 background:#17140e;color:#aaa;font-size:11px;
}

/* 777 */
.machine{
 background:linear-gradient(145deg,#2b2008,#0e0c08);
 border:2px solid #6d5015;
 border-radius:25px;
 padding:18px;
 box-shadow:0 0 40px rgba(255,174,24,.13);
}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel{
 height:115px;
 border-radius:14px;
 background:#070707;
 border:2px solid #9b721d;
 display:flex;align-items:center;justify-content:center;
 font-size:52px;
 box-shadow:inset 0 0 25px #000;
}
.reel.spin{animation:reelSpin .13s linear infinite}
@keyframes reelSpin{
 0%{transform:translateY(-6px)}
 50%{transform:translateY(6px)}
 100%{transform:translateY(-6px)}
}
.win777{
 min-height:28px;text-align:center;
 margin:14px 0;color:var(--gold);
 font-weight:1000;
}
.bigwin{animation:bigwin .5s infinite alternate}
@keyframes bigwin{
 from{transform:scale(1);text-shadow:0 0 5px #ffb000}
 to{transform:scale(1.15);text-shadow:0 0 35px #ffe58a}
}

/* LINES */
.line-board{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 padding:10px;
 border-radius:18px;
 background:#07110d;
 border:1px solid #245b42;
}
.cell{
 aspect-ratio:1;
 display:flex;align-items:center;justify-content:center;
 border-radius:11px;
 background:#0d2018;
 font-size:31px;
 border:1px solid rgba(255,255,255,.05);
}
.cell.win{
 animation:cellWin .45s infinite alternate;
}
@keyframes cellWin{
 from{box-shadow:0 0 5px #32e083}
 to{box-shadow:0 0 25px #32e083;transform:scale(1.05)}
}
.line-message{
 text-align:center;
 min-height:30px;
 margin:12px;color:var(--green);
 font-weight:900;
}

/* CARDS */
.card-table{
 background:radial-gradient(circle,#146338,#052416);
 border-radius:25px;
 padding:15px;
 border:2px solid #7c5818;
 min-height:400px;
}
.table-info{text-align:center;color:#b8d8c2;margin-bottom:12px}
.hand{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
.card{
 width:52px;height:75px;
 border:0;border-radius:9px;
 background:#fff;color:#151515;
 font-size:23px;
 box-shadow:0 4px 8px #0005;
 transition:.2s;
}
.card.red{color:#d21f2b}
.card.selected{transform:translateY(-12px);box-shadow:0 0 18px #ffe06b}
.card.backcard{
 background:repeating-linear-gradient(45deg,#16234c 0,#16234c 5px,#263d78 5px,#263d78 10px);
 color:transparent;
}
.card-actions{
 display:flex;justify-content:center;gap:10px;margin-top:20px;
}
.small-btn{
 border:1px solid #705116;
 background:#171208;
 color:var(--gold);
 padding:11px 16px;border-radius:11px;
}

/* MODAL */
.modal{
 position:fixed;inset:0;z-index:100;
 background:rgba(0,0,0,.78);
 backdrop-filter:blur(8px);
 display:flex;align-items:center;justify-content:center;
 padding:18px;
}
.modal-box{
 width:100%;max-width:430px;
 background:#15130e;
 border:1px solid rgba(255,210,70,.2);
 border-radius:24px;padding:22px;
}
.modal-box h2{color:var(--gold);margin-bottom:8px}
.modal-box p{color:#999;line-height:1.5}
.close{
 float:right;border:0;background:#272218;
 color:#fff;border-radius:50%;
 width:32px;height:32px;font-size:20px;
}
.notice{
 margin-top:18px;
 padding:14px;border-radius:13px;
 background:#201b0e;color:#c9b57e;
}

/* PROFILE/BONUS */
.cardbox{
 padding:18px;border-radius:20px;
 background:linear-gradient(145deg,#17130a,#0d0d0d);
 border:1px solid rgba(255,210,70,.15);
 margin-bottom:12px;
}
.gold{color:var(--gold)}
.row{
 display:flex;justify-content:space-between;
 padding:14px 0;border-bottom:1px solid #29251c;
}
.row:last-child{border:0}
.full{width:100%;margin-top:10px}

@media(min-width:700px){
 .games{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<section id="welcome">
 <div class="logo">Yes<b>MoneY</b></div>
 <div class="welcome-title">Твоя ігрова зона</div>
 <p class="welcome-text">
  Обирай гру, випробовуй удачу та відкривай нові режими.
  Усі YMY у цій версії є віртуальними.
 </p>
 <button class="welcome-btn" onclick="enter()">ПОЧАТИ ГРУ</button>
</section>

<section id="app" class="hidden">

<header class="topbar">
 <div class="top-logo">Yes<span>MoneY</span></div>
 <div class="balance">💰 <span id="balance">50</span> YMY</div>
</header>

<main class="content" id="content"></main>

<nav class="bottom-nav">
 <button class="nav-btn active" data-page="home">
  <span class="ico">🏠</span><small>Головна</small>
 </button>
 <button class="nav-btn" data-page="bonus">
  <span class="ico">🎁</span><small>Бонус</small>
 </button>
 <button class="nav-btn" id="wheelNav">
  <span class="ico">🎰</span><small>Барабан</small>
 </button>
 <button class="nav-btn" data-page="profile">
  <span class="ico">👤</span><small>Профіль</small>
 </button>
</nav>
</section>

<div id="modalRoot"></div>

<script>
/* =========================
   DATA
========================= */
let balance=Number(localStorage.getItem("ymyBalance"))||50;
let user=localStorage.getItem("ymyName")||"Гравець";
let lastDaily=Number(localStorage.getItem("ymyDaily")||0);

const content=document.getElementById("content");
const balanceEl=document.getElementById("balance");

function money(){
 balanceEl.textContent=Math.floor(balance);
 localStorage.setItem("ymyBalance",balance);
}

function enter(){
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 home();
 money();
}

function nav(page){
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
 const btn=document.querySelector(`[data-page="${page}"]`);
 if(btn)btn.classList.add("active");

 if(page==="home")home();
 if(page==="bonus")bonus();
 if(page==="profile")profile();
}

/* =========================
 HOME
========================= */
function home(){
 content.innerHTML=`
 <div class="page-title">Головна</div>
 <div class="page-sub">Обирай гру та грай у демо-режимі</div>

 <div class="hero">
  <div class="shine"></div>
  <h1>🔥 Ігрова зона</h1>
  <p>Нові режими, яскраві ефекти та оновлення вже всередині.</p>
 </div>

 <div class="games">

  <div class="game" onclick="crashGame()">
   <div class="game-badge">LIVE</div>
   <div class="cover coverCrash">✈️</div>
   <div class="game-info">
    <strong>Sky Crash</strong>
    <small>Забери виграш до падіння</small>
   </div>
  </div>

  <div class="game" onclick="slotsGame()">
   <div class="game-badge">777</div>
   <div class="cover cover777">7️⃣7️⃣7️⃣</div>
   <div class="game-info">
    <strong>777 Gold</strong>
    <small>Класичні лінії та комбінації</small>
   </div>
  </div>

  <div class="game" onclick="linesGame()">
   <div class="game-badge">NEW</div>
   <div class="cover coverLines">💎</div>
   <div class="game-info">
    <strong>Diamond Lines</strong>
    <small>Комбінації на ігровому полі</small>
   </div>
  </div>

  <div class="game" onclick="durakGame()">
   <div class="game-badge">BETA</div>
   <div class="cover coverCards">🃏</div>
   <div class="game-info">
    <strong>Дурак</strong>
    <small>36 карт • гра проти бота</small>
   </div>
  </div>

 </div>
 `;
}

/* =========================
 CRASH
========================= */
let crashTimer=null;
let crashRunning=false;
let crashX=1;
let crashBet=5;

function crashGame(){
 content.innerHTML=`
 <button class="back" onclick="home()">← Назад</button>
 <div class="game-screen">
  <div class="game-head">
   <h2>✈️ Sky Crash</h2>
   <span class="gold">YMY</span>
  </div>

  <div class="crash">
   <div class="gridbg"></div>
   <div class="mult" id="crashMult">1.00x</div>
   <div class="crash-line" id="crashLine"></div>
   <div class="plane" id="plane">✈️</div>
  </div>

  <div class="crash-controls">
   <input class="bet" id="crashBet" type="number" min="1" value="5">
   <button class="play-btn" id="crashStart" onclick="startCrash()">ПОЧАТИ</button>
  </div>

  <button class="cash" id="cashBtn" onclick="cashCrash()" disabled>
   ЗАБРАТИ 0 YMY
  </button>

  <div class="history" id="crashHistory"></div>
 </div>
 `;
}

/* виртуальная crash-игра */
function startCrash(){
 if(crashRunning)return;

 const input=Number(document.getElementById("crashBet").value)||1;
 if(input>balance){
  notice("Недостатньо YMY для цієї ставки.");
  return;
 }

 crashBet=input;
 balance-=crashBet;
 money();

 crashRunning=true;
 crashX=1;

 const mult=document.getElementById("crashMult");
 const plane=document.getElementById("plane");
 const line=document.getElementById("crashLine");
 const cash=document.getElementById("cashBtn");
 const start=document.getElementById("crashStart");

 start.disabled=true;
 cash.disabled=false;

 const crashPoint=+(1.15+Math.random()*7).toFixed(2);

 crashTimer=setInterval(()=>{
  crashX+=0.025;
  mult.textContent=crashX.toFixed(2)+"x";
  cash.textContent="ЗАБРАТИ "+Math.floor(crashBet*crashX)+" YMY";

  const px=Math.min(80,crashX*9);
  plane.style.left=35+px+"%";
  plane.style.bottom=35+Math.min(70,crashX*6)+"px";
  line.style.width=Math.min(90,crashX*9)+"%";

  if(crashX>=crashPoint){
   clearInterval(crashTimer);
   crashRunning=false;
   cash.disabled=true;
   cash.textContent="РАЗБИВСЯ 💥";
   mult.textContent=crashPoint.toFixed(2)+"x 💥";
   start.disabled=false;
   addHistory(crashPoint);
  }
 },80);
}

function cashCrash(){
 if(!crashRunning)return;

 clearInterval(crashTimer);
 crashRunning=false;

 const win=Math.floor(crashBet*crashX);
 balance+=win;
 money();

 document.getElementById("cashBtn").disabled=true;
 document.getElementById("cashBtn").textContent="ЗАБРАНО ✓";
 document.getElementById("crashStart").disabled=false;

 document.getElementById("crashMult").textContent=crashX.toFixed(2)+"x 🎉";
 document.getElementById("crashMult").style.color="#35e08b";
 addHistory(crashX);
}

function addHistory(x){
 const h=document.getElementById("crashHistory");
 if(!h)return;
 h.innerHTML=`<span>${x.toFixed(2)}x</span>`+h.innerHTML;
}

/* =========================
 777
========================= */
const symbols=["🍒","🍋","💎","⭐","🔔","7️⃣"];

function slotsGame(){
 content.innerHTML=`
 <button class="back" onclick="home()">← Назад</button>
 <div class="game-screen">
  <div class="game-head">
   <h2>7️⃣ 777 Gold</h2>
   <span class="gold">3 ЛІНІЇ</span>
  </div>

  <div class="machine">
   <div class="reels">
    <div class="reel" id="r1">7️⃣</div>
    <div class="reel" id="r2">7️⃣</div>
    <div class="reel" id="r3">7️⃣</div>
   </div>

   <div class="win777" id="slotResult">
    Обери ставку та крути
   </div>

   <div class="crash-controls">
    <input class="bet" id="slotBet" type="number" min="1" value="5">
    <button class="play-btn" onclick="spin777()">КРУТИТИ</button>
   </div>
  </div>
 </div>
 `;
}

function spin777(){
 const bet=Number(document.getElementById("slotBet").value)||1;
 if(bet>balance){
  notice("Недостатньо YMY.");
  return;
 }

 balance-=bet;
 money();

 const reels=[
  document.getElementById("r1"),
  document.getElementById("r2"),
  document.getElementById("r3")
 ];
 const result=document.getElementById("slotResult");

 reels.forEach(r=>r.classList.add("spin"));
 result.textContent="КРУТІННЯ...";

 setTimeout(()=>{
  const a=symbols[Math.floor(Math.random()*symbols.length)];
  const b=symbols[Math.floor(Math.random()*symbols.length)];
  const c=symbols[Math.floor(Math.random()*symbols.length)];

  reels[0].textContent=a;
  reels[1].textContent=b;
  reels[2].textContent=c;
  reels.forEach(r=>r.classList.remove("spin"));

  let win=0;

  if(a===b&&b===c){
   win= a==="7️⃣" ? bet*20 : bet*8;
  }else if(a===b||b===c||a===c){
   win=bet*2;
  }

  if(win){
   balance+=win;
   money();
   result.textContent="🎉 ВИГРАШ "+win+" YMY!";
   result.classList.add("bigwin");
   setTimeout(()=>result.classList.remove("bigwin"),1800);
  }else{
   result.textContent="Спробуй ще раз";
  }
 },1200);
}

/* =========================
 DIAMOND LINES
========================= */
const gems=["💎","🔷","🟢","🟣","⭐","🍀"];

function linesGame(){
 content.innerHTML=`
 <button class="back" onclick="home()">← Назад</button>
 <div class="game-screen">
  <div class="game-head">
   <h2>💎 Diamond Lines</h2>
   <span class="gold">ЛІНІЇ</span>
  </div>

  <div class="line-board" id="lineBoard"></div>
  <div class="line-message" id="lineMsg">Знайди комбінацію</div>

  <div class="crash-controls">
   <input class="bet" id="lineBet" type="number" min="1" value="5">
   <button class="play-btn" onclick="playLines()">ГРАТИ</button>
  </div>
 </div>
 `;

 renderLines();
}

function renderLines(){
 const board=document.getElementById("lineBoard");
 if(!board)return;
 board.innerHTML="";
 for(let i=0;i<25;i++){
  const d=document.createElement("div");
  d.className="cell";
  d.textContent=gems[Math.floor(Math.random()*gems.length)];
  board.appendChild(d);
 }
}

function playLines(){
 const bet=Number(document.getElementById("lineBet").value)||1;
 if(bet>balance){
  notice("Недостатньо YMY.");
  return;
 }

 balance-=bet;
 money();

 const cells=[...document.querySelectorAll(".cell")];
 renderLines();

 setTimeout(()=>{
  const msg=document.getElementById("lineMsg");
  const win=Math.random()<.38;

  if(win){
   const amount=bet*(2+Math.floor(Math.random()*5));
   balance+=amount;
   money();

   cells.slice(0,3).forEach(x=>x.classList.add("win"));
   msg.textContent="💎 ЛІНІЯ! +"+amount+" YMY";
  }else{
   msg.textContent="Комбінації не знайдено";
  }
 },250);
}

/* =========================
 DURAK DEMO
========================= */
const suits=["♠","♥","♦","♣"];
const ranks=["6","7","8","9","10","J","Q","K","A"];

function makeDeck(){
 let d=[];
 for(const s of suits)
  for(const r of ranks)
   d.push({s,r});
 return d.sort(()=>Math.random()-.5);
}

let playerHand=[];
let botHand=[];

function durakGame(){
 const deck=makeDeck();
 playerHand=deck.splice(0,6);
 botHand=deck.splice(0,6);

 content.innerHTML=`
 <button class="back" onclick="home()">← Назад</button>
 <div class="game-screen">
  <div class="game-head">
   <h2>🃏 Дурак</h2>
   <span class="gold">36 КАРТ</span>
  </div>

  <div class="card-table">
   <div class="table-info">
    Бот: <span id="botCount">${botHand.length}</span> карт
   </div>

   <div class="hand" id="botHand"></div>

   <div style="height:65px"></div>

   <div class="table-info">Твої карти</div>
   <div class="hand" id="playerHand"></div>

   <div class="card-actions">
    <button class="small-btn" onclick="drawCard()">Взяти карту</button>
    <button class="small-btn" onclick="durakAttack()">Хід</button>
   </div>

   <div id="durakMsg" class="notice">
    Обери карту для ходу.
   </div>
  </div>
 </div>
 `;

 renderCards();
}

function cardText(c){
 return c.r+c.s;
}

function renderCards(){
 const bot=document.getElementById("botHand");
 const player=document.getElementById("playerHand");
 if(!bot||!player)return;

 bot.innerHTML=botHand.map(()=>`<button class="card backcard">?</button>`).join("");

 player.innerHTML=playerHand.map((c,i)=>{
  const red=(c.s==="♥"||c.s==="♦")?"red":"";
  return `<button class="card ${red}" onclick="selectCard(${i})">${cardText(c)}</button>`;
 }).join("");

 const bc=document.getElementById("botCount");
 if(bc)bc.textContent=botHand.length;
}

let selected=-1;

function selectCard(i){
 selected=i;
 document.querySelectorAll("#playerHand .card").forEach((x,n)=>{
  x.classList.toggle("selected",n===i);
 });
}

function durakAttack(){
 if(selected<0){
  document.getElementById("durakMsg").textContent="Спочатку вибери карту.";
  return;
 }

 const card=playerHand.splice(selected,1)[0];
 selected=-1;

 document.getElementById("durakMsg").textContent=
  "Ти походив картою "+cardText(card)+".";

 if(botHand.length){
  const reply=botHand.splice(Math.floor(Math.random()*botHand.length),1)[0];
  document.getElementById("durakMsg").textContent+=
   " Бот відповів картою "+cardText(reply)+".";
 }

 renderCards();
}

function drawCard(){
 const deck=makeDeck();
 if(playerHand.length<6){
  playerHand.push(deck[0]);
  renderCards();
  document.getElementById("durakMsg").textContent="Карту взято.";
 }else{
  document.getElementById("durakMsg").textContent="У тебе вже достатньо карт.";
 }
}

function randomId(){

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}
