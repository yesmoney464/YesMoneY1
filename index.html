<!-- ЗАМЕНИ ЭТИМ БЛОКОМ СТАРУЮ СЕКЦИЮ ИГР -->

<style>
/* =====================================================
   CASINO GAME CARDS
===================================================== */

.casino-games {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.casino-card {
    position:relative;
    height:185px;
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.12);
    background:#111;
    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        inset 0 0 30px rgba(255,255,255,.04);
    transition:.25s;
}

.casino-card:active {
    transform:scale(.96);
}

.casino-art {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.casino-overlay {
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.05) 65%
        );
}

.casino-title {
    position:absolute;
    left:14px;
    right:14px;
    bottom:12px;
    z-index:3;
}

.casino-title strong {
    display:block;
    font-size:18px;
    font-weight:900;
    text-shadow:0 3px 10px #000;
}

.casino-title span {
    font-size:11px;
    color:rgba(255,255,255,.7);
}

.casino-badge {
    position:absolute;
    top:10px;
    right:10px;
    z-index:4;
    padding:6px 9px;
    border-radius:9px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.12);
    font-size:10px;
    font-weight:900;
}

/* =====================================================
   GAME MODAL
===================================================== */

.slot-game-modal {
    position:fixed;
    inset:0;
    z-index:500;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(100,70,255,.18),
            transparent 45%
        ),
        #070912;
    display:none;
    overflow:auto;
}

.slot-game-modal.active {
    display:block;
    animation:casinoFade .25s ease;
}

@keyframes casinoFade {
    from {
        opacity:0;
    }
    to {
        opacity:1;
    }
}

.slot-top {
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(8,10,20,.9);
}

.slot-back {
    border:0;
    background:rgba(255,255,255,.08);
    color:white;
    width:42px;
    height:42px;
    border-radius:13px;
    font-size:20px;
}

.slot-logo {
    font-size:20px;
    font-weight:1000;
    letter-spacing:1px;
}

.slot-balance {
    background:rgba(255,255,255,.08);
    padding:9px 12px;
    border-radius:12px;
    font-weight:900;
}

/* =====================================================
   SLOT MACHINE
===================================================== */

.slot-main {
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px 14px 30px;
}

.slot-heading {
    text-align:center;
    margin-bottom:16px;
}

.slot-heading h1 {
    font-size:29px;
    font-weight:1000;
    margin-bottom:5px;
}

.slot-heading p {
    color:rgba(255,255,255,.48);
    font-size:13px;
}

.slot-machine {
    position:relative;
    padding:12px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            #241452,
            #10152b 55%,
            #32124c
        );
    border:2px solid rgba(170,120,255,.45);
    box-shadow:
        0 0 35px rgba(120,70,255,.22),
        inset 0 0 35px rgba(0,0,0,.6);
}

.slot-machine:before {
    content:"";
    position:absolute;
    inset:5px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.1);
    pointer-events:none;
}

.slot-reels {
    position:relative;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    padding:9px;
    border-radius:18px;
    background:#080b17;
    overflow:hidden;
}

.slot-reel {
    height:82px;
    border-radius:12px;
    background:
        linear-gradient(
            180deg,
            #20243b,
            #101321
        );
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    box-shadow:
        inset 0 0 18px rgba(0,0,0,.7);
    position:relative;
    overflow:hidden;
}

.slot-reel.win {
    animation:
        reelWin .5s ease-in-out infinite alternate;
}

@keyframes reelWin {
    from {
        box-shadow:
            0 0 5px rgba(255,220,80,.2),
            inset 0 0 15px rgba(0,0,0,.6);
        transform:scale(1);
    }
    to {
        box-shadow:
            0 0 25px rgba(255,220,80,.95),
            inset 0 0 15px rgba(0,0,0,.5);
        transform:scale(1.05);
    }
}

.slot-line {
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:3px;
    background:
        linear-gradient(
            90deg,
            transparent,
            #ffe86b,
            #fff,
            #ffe86b,
            transparent
        );
    box-shadow:
        0 0 12px #ffd83d;
    z-index:5;
    pointer-events:none;
}

/* =====================================================
   SLOT CONTROLS
===================================================== */

.slot-controls {
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1.5fr 1fr;
    gap:9px;
}

.slot-control {
    border:0;
    border-radius:13px;
    padding:12px 5px;
    background:rgba(255,255,255,.08);
    color:white;
    font-weight:900;
}

.slot-control small {
    display:block;
    color:rgba(255,255,255,.45);
    font-size:9px;
    margin-bottom:3px;
}

.slot-spin {
    border:0;
    border-radius:15px;
    color:white;
    font-weight:1000;
    font-size:17px;
    background:
        linear-gradient(
            135deg,
            #ffb300,
            #ff5a00
        );
    box-shadow:
        0 7px 25px rgba(255,100,0,.25);
    transition:.2s;
}

.slot-spin:active {
    transform:scale(.94);
}

.slot-spin:disabled {
    opacity:.5;
}

/* =====================================================
   WIN PANEL
===================================================== */

.slot-result {
    min-height:48px;
    margin-top:15px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:17px;
    font-weight:1000;
}

.slot-result.win {
    background:
        linear-gradient(
            135deg,
            rgba(255,190,0,.18),
            rgba(255,80,0,.12)
        );
    border:1px solid rgba(255,190,0,.3);
    color:#ffe56c;
    animation:
        bigWin .55s ease-in-out infinite alternate;
}

@keyframes bigWin {
    from {
        transform:scale(1);
        box-shadow:0 0 5px rgba(255,190,0,.1);
    }
    to {
        transform:scale(1.025);
        box-shadow:0 0 25px rgba(255,190,0,.35);
    }
}

/* =====================================================
   CANDY ART
===================================================== */

.candy-bg {
    background:
        radial-gradient(circle at 20% 25%, #ff77c8 0 7%, transparent 8%),
        radial-gradient(circle at 75% 20%, #70eaff 0 8%, transparent 9%),
        radial-gradient(circle at 50% 70%, #ffd75e 0 9%, transparent 10%),
        linear-gradient(135deg,#7b24c7,#ef3f91,#ff8b32);
}

.candy-title {
    color:#fff;
    text-shadow:
        0 0 8px #ff4bb7,
        0 3px 5px #7b1470;
}

.seven-bg {
    background:
        radial-gradient(circle at 50% 30%,#ffec74 0 5%,transparent 6%),
        radial-gradient(circle at 20% 80%,#ff3939 0 12%,transparent 13%),
        linear-gradient(135deg,#450000,#a80000,#280000);
}

.gem-bg {
    background:
        radial-gradient(circle at 30% 30%,#55eaff 0 9%,transparent 10%),
        radial-gradient(circle at 70% 65%,#8c65ff 0 13%,transparent 14%),
        linear-gradient(135deg,#061b42,#073d72,#12083f);
}

.fruit-bg {
    background:
        radial-gradient(circle at 25% 35%,#ff4c4c 0 10%,transparent 11%),
        radial-gradient(circle at 75% 25%,#ffe04e 0 10%,transparent 11%),
        radial-gradient(circle at 55% 75%,#5ee66a 0 12%,transparent 13%),
        linear-gradient(135deg,#075a2c,#16a34a,#8bcf38);
}

.pharaoh-bg {
    background:
        radial-gradient(circle at 50% 30%,#ffd65c 0 12%,transparent 13%),
        linear-gradient(135deg,#201000,#8a5200,#271000);
}

.art-center {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    filter:
        drop-shadow(0 8px 12px rgba(0,0,0,.5));
}

.art-text {
    position:absolute;
    width:100%;
    text-align:center;
    top:18px;
    font-size:24px;
    font-weight:1000;
    transform:rotate(-5deg);
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px) {

    .casino-games {
        grid-template-columns:repeat(3,1fr);
    }

    .casino-card {
        height:205px;
    }

    .slot-reel {
        height:95px;
        font-size:42px;
    }
}
</style>


<script>

/* =====================================================
   ИГРЫ
===================================================== */

const casinoGames = [

    {
        name:"Sweet Candy",
        subtitle:"Candy Slot",
        badge:"HOT",
        bg:"candy-bg",
        icon:"🍭",
        title:"SWEET",
        game:"candy"
    },

    {
        name:"777 Royal",
        subtitle:"Classic Slot",
        badge:"777",
        bg:"seven-bg",
        icon:"7️⃣",
        title:"ROYAL 777",
        game:"777"
    },

    {
        name:"Diamond Rush",
        subtitle:"Gem Slot",
        badge:"NEW",
        bg:"gem-bg",
        icon:"💎",
        title:"DIAMOND",
        game:"gems"
    },

    {
        name:"Fruit Party",
        subtitle:"Fruit Slot",
        badge:"HOT",
        bg:"fruit-bg",
        icon:"🍉",
        title:"FRUIT",
        game:"fruit"
    },

    {
        name:"Golden Pharaoh",
        subtitle:"Gold Slot",
        badge:"VIP",
        bg:"pharaoh-bg",
        icon:"👑",
        title:"PHARAOH",
        game:"pharaoh"
    },

    {
        name:"Lucky 7",
        subtitle:"Classic Casino",
        badge:"NEW",
        bg:"seven-bg",
        icon:"🎰",
        title:"LUCKY 7",
        game:"lucky"
    }

];


/* =====================================================
   КАРТОЧКИ
===================================================== */

function renderCasinoGames(container) {

    container.innerHTML = `
        <div class="casino-games">

            ${casinoGames.map((game,index)=>`

                <div
                    class="casino-card"
                    onclick="openCasinoGame(${index})">

                    <div class="casino-art ${game.bg}">

                        <div class="art-text">
                            ${game.title}
                        </div>

                        <div class="art-center">
                            ${game.icon}
                        </div>

                    </div>

                    <div class="casino-overlay"></div>

                    <div class="casino-badge">
                        ${game.badge}
                    </div>

                    <div class="casino-title">

                        <strong>
                            ${game.name}
                        </strong>

                        <span>
                            ${game.subtitle}
                        </span>

                    </div>

                </div>

            `).join("")}

        </div>
    `;
}


/* =====================================================
   ОТКРЫТИЕ СЛОТА
===================================================== */

function openCasinoGame(index) {

    const game = casinoGames[index];

    let modal = document.getElementById("casinoSlotModal");

    if (!modal) {

        modal = document.createElement("div");

        modal.id = "casinoSlotModal";
        modal.className = "slot-game-modal";

        document.body.appendChild(modal);
    }

    modal.innerHTML = `

        <div class="slot-top">

            <button
                class="slot-back"
                onclick="closeCasinoGame()">
                ←
            </button>

            <div class="slot-logo">
                ${game.name}
            </div>

            <div class="slot-balance">
                💰 <span id="slotBalance">
                    ${balance}
                </span>
            </div>

        </div>


        <div class="slot-main">

            <div class="slot-heading">

                <h1>
                    ${game.icon} ${game.name}
                </h1>

                <p>
                    ${game.subtitle} • YMY
                </p>

            </div>


            <div class="slot-machine">

                <div class="slot-reels">

                    <div class="slot-line"></div>

                    <div class="slot-reel" id="reel0">🍒</div>
                    <div class="slot-reel" id="reel1">🍋</div>
                    <div class="slot-reel" id="reel2">7️⃣</div>
                    <div class="slot-reel" id="reel3">💎</div>
                    <div class="slot-reel" id="reel4">🍉</div>
                    <div class="slot-reel" id="reel5">⭐</div>

                </div>


                <div class="slot-controls">

                    <button
                        class="slot-control"
                        onclick="changeBet(-5)">

                        <small>СТАВКА</small>
                        −

                    </button>


                    <button
                        class="slot-spin"
                        id="casinoSpinButton"
                        onclick="spinCasino()">

                        SPIN

                    </button>


                    <button
                        class="slot-control"
                        onclick="changeBet(5)">

                        <small>СТАВКА</small>
                        +

                    </button>

                </div>


                <div
                    style="
                    text-align:center;
                    margin-top:10px;
                    color:rgba(255,255,255,.55);
                    font-size:12px;
                    ">

                    Ставка:
                    <strong id="slotBetValue">
                        5
                    </strong>
                    YMY

                </div>


                <div
                    class="slot-result"
                    id="slotResult">

                    Зробіть оберт

                </div>

            </div>

        </div>
    `;

    modal.classList.add("active");

    window.currentSlotGame = game.game;
}


/* =====================================================
   ЗАКРЫТИЕ
===================================================== */

function closeCasinoGame() {

    const modal =
        document.getElementById("casinoSlotModal");

    if (modal) {
        modal.classList.remove("active");
    }
}


/* =====================================================
   СТАВКА
===================================================== */

let casinoBet = 5;

function changeBet(value) {

    casinoBet += value;

    if (casinoBet < 5)
        casinoBet = 5;

    if (casinoBet > 50)
        casinoBet = 50;

    const balance =
        Number(window.balance || 0);

    if (casinoBet > balance && balance > 0) {
        casinoBet = balance;
    }

    const el =
        document.getElementById("slotBetValue");

    if (el)
        el.textContent = casinoBet;
}


/* =====================================================
   СИМВОЛЫ
===================================================== */

const slotSymbols = [
    "🍒",
    "🍋",
    "🍉",
    "🍇",
    "🍓",
    "⭐",
    "💎",
    "7️⃣"
];


/* =====================================================
   SPIN
===================================================== */

let casinoSpinning = false;

function spinCasino() {

    if (casinoSpinning)
        return;

    if (typeof balance === "undefined")
        return;

    if (balance < casinoBet) {

        alert(
            "Недостатньо YMY для оберту."
        );

        return;
    }


    casinoSpinning = true;

    balance -= casinoBet;

    updateBalance();


    const spinButton =
        document.getElementById(
            "casinoSpinButton"
        );

    if (spinButton) {

        spinButton.disabled = true;

        spinButton.textContent =
            "SPINNING...";
    }


    const result =
        document.getElementById(
            "slotResult"
        );

    if (result) {

        result.className =
            "slot-result";

        result.textContent =
            "Обертання...";
    }


    const reels = [];

    for (let i=0;i<6;i++) {

        reels.push(
            document.getElementById(
                "reel"+i
            )
        );
    }


    reels.forEach(reel => {

        if (reel) {

            reel.classList.remove("win");

            reel.classList.add(
                "slot-spinning"
            );
        }

    });


    let ticks = 0;

    const animation =
        setInterval(() => {

            reels.forEach(reel => {

                if (reel) {

                    reel.textContent =
                        slotSymbols[
                            Math.floor(
                                Math.random() *
                                slotSymbols.length
                            )
                        ];
                }

            });

            ticks++;

            if (ticks >= 18) {

                clearInterval(animation);

                finishCasinoSpin(
                    reels
                );
            }

        },90);
}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

function finishCasinoSpin(reels) {

    const resultSymbols =
        [];

    for (let i=0;i<6;i++) {

        const symbol =
            slotSymbols[
                Math.floor(
                    Math.random() *
                    slotSymbols.length
                )
            ];

        resultSymbols.push(symbol);

        if (reels[i]) {

            reels[i].textContent =
                symbol;

            reels[i].classList.remove(
                "slot-spinning"
            );
        }
    }


    let win = 0;


    /*
       ТРИ ОДИНАКОВЫХ
    */

    const counts = {};

    resultSymbols.forEach(symbol => {

        counts[symbol] =
            (counts[symbol] || 0) + 1;

    });


    Object.keys(counts)
        .forEach(symbol => {

            const count =
                counts[symbol];

            if (count >= 3) {

                win =
                    casinoBet *
                    (count === 6 ? 25 :
                     count === 5 ? 15 :
                     count === 4 ? 8 :
                     4);

            }

        });


    /*
       ОСОБЫЙ 777
    */

    if (
        resultSymbols.filter(
            x => x === "7️⃣"
        ).length >= 3
    ) {

        win =
            casinoBet * 15;
    }


    /*
       ДЖЕКПОТ
    */

    if (
        resultSymbols.every(
            x => x === "💎"
        )
    ) {

        win =
            casinoBet * 50;
    }


    if (win > 0) {

        balance += win;

        updateBalance();


        reels.forEach(reel => {

            if (reel)
                reel.classList.add("win");

        });


        const result =
            document.getElementById(
                "slotResult"
            );

        if (result) {

            result.className =
                "slot-result win";

            result.innerHTML =
                `🎉 WIN! +${win} YMY 🎉`;
        }

    } else {

        const result =
            document.getElementById(
                "slotResult"
            );

        if (result) {

            result.className =
                "slot-result";

            result.textContent =
                "Спробуйте ще раз 🍀";
        }
    }


    const spinButton =
        document.getElementById(
            "casinoSpinButton"
        );

    if (spinButton) {

        spinButton.disabled =
            false;

        spinButton.textContent =
            "SPIN";
    }


    const slotBalance =
        document.getElementById(
            "slotBalance"
        );

    if (slotBalance) {

        slotBalance.textContent =
            balance;
    }


    casinoSpinning = false;
}


/* =====================================================
   ПОДКЛЮЧЕНИЕ К ГЛАВНОМУ МЕНЮ
===================================================== */

/*
   ВАЖНО:

   Если у тебя уже есть gamesPage(),
   найди старую функцию gamesPage
   и замени ЕЁ целиком на эту.
*/

function gamesPage() {

    mainContent.innerHTML = `

        <div class="page">

            <h1 class="page-title">
                🎰 Казино
            </h1>

            <p class="page-subtitle">
                Оберіть гру та випробуйте удачу
            </p>

            <div id="casinoGamesContainer"></div>

        </div>

    `;

    renderCasinoGames(
        document.getElementById(
            "casinoGamesContainer"
        )
    );
}


/* =====================================================
   ОБНОВЛЕНИЕ БАЛАНСА В ИГРЕ
===================================================== */

const oldUpdateBalance =
    window.updateBalance;

window.updateBalance =
    function() {

        if (typeof balanceValue !== "undefined") {

            balanceValue.textContent =
                Number(balance).toFixed(0);
        }


        localStorage.setItem(
            "ymyBalance",
            balance
        );


        const slotBalance =
            document.getElementById(
                "slotBalance"
            );

        if (slotBalance) {

            slotBalance.textContent =
                Number(balance).toFixed(0);
        }

    };

</script>
