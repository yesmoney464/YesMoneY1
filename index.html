```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>YesMoneY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%,rgba(133,78,255,.55),transparent 32%),
        radial-gradient(circle at 0% 40%,rgba(0,210,255,.18),transparent 28%),
        radial-gradient(circle at 100% 65%,rgba(255,0,190,.16),transparent 30%),
        linear-gradient(180deg,#090b1d 0%,#04050b 100%);
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   GLOBAL LIGHT
========================= */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 50% 20%,rgba(112,76,255,.14),transparent 35%),
        radial-gradient(circle at 15% 85%,rgba(0,200,255,.08),transparent 25%),
        radial-gradient(circle at 90% 80%,rgba(255,0,180,.08),transparent 25%);
}

/* =========================
   WELCOME
========================= */

#welcomeScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:35px 20px 45px;
    animation:welcomeIn .8s ease;
}

@keyframes welcomeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:
        0 0 10px rgba(160,120,255,.9),
        0 0 30px rgba(120,70,255,.7);
}

.logo span{
    opacity:.55;
}

.auth-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.auth-btn{
    border:1px solid rgba(255,255,255,.18);
    border-radius:14px;
    padding:13px 20px;
    color:white;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    font-weight:700;
}

.auth-btn.primary{
    border:none;
    background:linear-gradient(135deg,#735cff,#bd5cff);
    box-shadow:
        0 0 15px rgba(130,80,255,.55),
        0 8px 30px rgba(100,60,255,.3);
}

.welcome-content{
    text-align:center;
    max-width:500px;
    margin:auto;
}

.welcome-icon{
    font-size:75px;
    margin-bottom:25px;
    filter:drop-shadow(0 0 25px #9875ff);
    animation:floatIcon 2.5s ease-in-out infinite;
}

@keyframes floatIcon{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.welcome-content h1{
    font-size:30px;
    margin-bottom:14px;
    text-shadow:0 0 20px rgba(160,130,255,.5);
}

.welcome-content p{
    color:rgba(255,255,255,.62);
    line-height:1.6;
}

.welcome-bottom{
    text-align:center;
    color:rgba(255,255,255,.35);
    font-size:13px;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    padding-bottom:92px;
}

.topbar{
    padding:20px 17px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:
        0 0 8px #8d70ff,
        0 0 22px rgba(120,80,255,.7);
}

.balance{
    padding:9px 14px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(160,130,255,.28);
    box-shadow:
        0 0 14px rgba(110,80,255,.3),
        inset 0 0 15px rgba(110,80,255,.08);
    font-weight:800;
}

.balance small{
    color:rgba(255,255,255,.5);
    font-weight:500;
}

.content{
    padding:12px 16px 25px;
    max-width:760px;
    margin:auto;
}

.page{
    animation:pageIn .35s ease;
}

@keyframes pageIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}

.page-title{
    font-size:29px;
    margin:10px 0 7px;
    text-shadow:
        0 0 8px rgba(160,130,255,.8),
        0 0 25px rgba(120,80,255,.45);
}

.page-subtitle{
    color:rgba(255,255,255,.52);
    margin-bottom:22px;
}

/* =========================
   GAME GRID
========================= */

.games-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.game-card{
    min-height:155px;
    border-radius:21px;
    padding:17px;
    background:
        linear-gradient(145deg,rgba(130,100,255,.22),rgba(255,255,255,.045));
    border:1px solid rgba(165,140,255,.28);
    position:relative;
    overflow:hidden;
    transition:.25s;
    box-shadow:
        0 0 0 1px rgba(120,90,255,.04),
        0 10px 25px rgba(0,0,0,.3),
        inset 0 0 25px rgba(120,90,255,.06);
}

.game-card:before{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    top:-65px;
    right:-50px;
    border-radius:50%;
    background:rgba(150,100,255,.25);
    filter:blur(25px);
}

.game-card:active{
    transform:scale(.95);
}

.game-card:hover{
    transform:translateY(-5px);
    border-color:rgba(210,190,255,.7);
    box-shadow:
        0 0 15px rgba(125,95,255,.5),
        0 0 35px rgba(125,95,255,.22),
        0 15px 35px rgba(0,0,0,.5);
}

.game-icon{
    font-size:44px;
    margin-bottom:15px;
    filter:
        drop-shadow(0 0 6px rgba(255,255,255,.5))
        drop-shadow(0 0 15px rgba(130,90,255,.7));
    animation:iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}

.game-card h3{
    font-size:17px;
    margin-bottom:6px;
}

.game-card p{
    color:rgba(255,255,255,.46);
    font-size:12px;
}

/* =========================
   NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    background:rgba(7,8,18,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(150,120,255,.15);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    box-shadow:0 -8px 30px rgba(80,50,180,.2);
}

.nav-btn{
    background:none;
    border:none;
    color:rgba(255,255,255,.4);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    transition:.25s;
}

.nav-icon{
    font-size:24px;
}

.nav-btn span:last-child{
    font-size:11px;
}

.nav-btn.active{
    color:#fff;
    transform:translateY(-2px);
    text-shadow:
        0 0 8px rgba(180,160,255,.9),
        0 0 20px rgba(130,100,255,.7);
}

.nav-btn.active .nav-icon{
    filter:
        drop-shadow(0 0 5px #a78bff)
        drop-shadow(0 0 15px #7655ff);
}

/* =========================
   SUPPORT
========================= */

.support-btn{
    position:fixed;
    z-index:60;
    left:14px;
    bottom:90px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#735cff,#bd5cff);
    color:#fff;
    font-size:22px;
    box-shadow:
        0 0 15px rgba(130,80,255,.65),
        0 8px 25px rgba(0,0,0,.4);
}

/* =========================
   777 GAME
========================= */

.slot-page{
    text-align:center;
}

.slot-logo{
    margin-top:5px;
    font-size:46px;
    font-weight:1000;
    letter-spacing:5px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffd43b,
        0 0 25px #ff9d00,
        0 0 50px rgba(255,100,0,.65);
    animation:sevenGlow 1.5s ease-in-out infinite alternate;
}

@keyframes sevenGlow{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.35);
    }
}

.slot-subtitle{
    color:rgba(255,255,255,.52);
    margin:7px 0 20px;
}

.slot-machine{
    position:relative;
    padding:24px 12px 20px;
    border-radius:25px;
    background:
        radial-gradient(circle at 50% 0%,rgba(255,180,40,.2),transparent 42%),
        linear-gradient(145deg,rgba(110,80,255,.3),rgba(255,255,255,.035));
    border:1px solid rgba(205,175,255,.4);
    box-shadow:
        0 0 15px rgba(120,90,255,.45),
        0 0 45px rgba(120,90,255,.22),
        inset 0 0 35px rgba(100,70,255,.14);
    overflow:hidden;
}

.slot-machine:before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:27px;
    pointer-events:none;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.2),
        transparent
    );
    animation:machineShine 3s linear infinite;
}

@keyframes machineShine{
    from{transform:translateX(-100%)}
    to{transform:translateX(100%)}
}

.slot-reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    position:relative;
    z-index:2;
}

.slot-reel{
    height:112px;
    border-radius:17px;
    background:
        linear-gradient(180deg,#1b1e35,#080a13);
    border:2px solid rgba(255,255,255,.14);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:51px;
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.75),
        0 0 13px rgba(110,85,255,.25);
    overflow:hidden;
}

.slot-line{
    position:absolute;
    z-index:4;
    left:11px;
    right:11px;
    top:50%;
    height:4px;
    background:linear-gradient(
        90deg,
        transparent,
        #fff,
        #ffe36b,
        #fff,
        transparent
    );
    box-shadow:
        0 0 7px #fff,
        0 0 16px #ffd000,
        0 0 30px rgba(255,150,0,.8);
    pointer-events:none;
}

.slot-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
}

.slot-info>div{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    padding:11px;
}

.slot-info span{
    display:block;
    color:rgba(255,255,255,.4);
    font-size:11px;
    margin-bottom:5px;
}

.slot-info strong{
    font-size:15px;
}

.slot-bet{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.bet-control{
    width:30px;
    height:30px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,.1);
    color:#fff;
    font-size:20px;
}

.slots-spin{
    position:relative;
    z-index:3;
    width:100%;
    margin-top:15px;
    padding:16px;
    border:none;
    border-radius:15px;
    color:#fff;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(135deg,#735cff,#b75cff,#ff5ccf);
    box-shadow:
        0 0 15px rgba(120,90,255,.7),
        0 0 35px rgba(160,80,255,.4);
    overflow:hidden;
    text-shadow:0 2px 4px rgba(0,0,0,.4);
}

.slots-spin:before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );
    transform:skewX(-20deg);
    animation:buttonShine 2.5s infinite;
}

@keyframes buttonShine{
    0%{left:-100%}
    45%,100%{left:140%}
}

.slots-spin:active{
    transform:scale(.96);
}

.slot-spinning{
    animation:slotShake .08s linear infinite;
}

@keyframes slotShake{
    0%{transform:translateY(-3px)}
    50%{transform:translateY(3px)}
    100%{transform:translateY(-3px)}
}

.slots-result{
    min-height:30px;
    margin-top:15px;
    font-size:16px;
    font-weight:900;
}

.win-result{
    color:#ffe66d;
    font-size:22px!important;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffd000,
        0 0 28px #ff8c00;
    animation:winText .55s ease-in-out infinite alternate;
}

@keyframes winText{
    from{transform:scale(1)}
    to{transform:scale(1.1)}
}

.slot-win{
    animation:slotWin .4s ease-in-out infinite alternate;
    border-color:#ffe66d!important;
    box-shadow:
        0 0 10px #ffe66d,
        0 0 25px #ffb300,
        0 0 50px rgba(255,170,0,.85),
        inset 0 0 25px rgba(255,190,0,.25)!important;
}

@keyframes slotWin{
    from{transform:scale(1)}
    to{transform:scale(1.06)}
}

/* =========================
   WIN EFFECTS
========================= */

.win-flash{
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            rgba(255,240,100,.65),
            rgba(255,150,0,.18),
            transparent 65%
        );
    animation:winFlash .85s ease forwards;
}

@keyframes winFlash{
    0%{opacity:0}
    20%{opacity:1}
    100%{opacity:0}
}

.win-coin{
    position:fixed;
    z-index:1000;
    pointer-events:none;
    font-size:25px;
    animation:coinFall 1.5s ease-out forwards;
}

@keyframes coinFall{
    0%{
        opacity:1;
        transform:translateY(-20px) rotate(0deg) scale(.7);
    }
    100%{
        opacity:0;
        transform:translateY(75vh) rotate(720deg) scale(1.2);
    }
}

.jackpot{
    animation:
        jackpotShake .1s linear infinite,
        jackpotGlow .45s ease-in-out infinite alternate;
}

@keyframes jackpotShake{
    0%{transform:translate(0,0)}
    25%{transform:translate(2px,-1px)}
    50%{transform:translate(-2px,1px)}
    75%{transform:translate(1px,2px)}
    100%{transform:translate(0,0)}
}

@keyframes jackpotGlow{
    from{filter:drop-shadow(0 0 5px gold)}
    to{
        filter:
            drop-shadow(0 0 20px gold)
            drop-shadow(0 0 40px orange);
    }
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    background:#15182a;
    border:1px solid rgba(170,140,255,.25);
    border-radius:25px;
    padding:24px;
    position:relative;
    box-shadow:
        0 0 35px rgba(100,70,255,.25);
}

.close{
    position:absolute;
    right:15px;
    top:13px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:22px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    color:rgba(255,255,255,.65);
    font-size:13px;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    outline:none;
    background:rgba(255,255,255,.07);
    color:#fff;
    font-size:15px;
}

.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#735cff,#b75cff);
    color:#fff;
    font-weight:900;
}

.switch{
    text-align:center;
    margin-top:18px;
    color:rgba(255,255,255,.45);
    font-size:13px;
}

.switch button{
    background:none;
    border:none;
    color:#ad98ff;
    font-weight:700;
}

/* =========================
   BONUS / PROFILE
========================= */

.bonus-card,
.profile-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(160,130,255,.18);
    border-radius:20px;
    padding:20px;
    margin-bottom:13px;
    box-shadow:inset 0 0 20px rgba(120,90,255,.04);
}

.bonus-icon{
    font-size:38px;
    margin-bottom:10px;
}

.bonus-card p{
    color:rgba(255,255,255,.56);
    line-height:1.5;
    font-size:14px;
}

.bonus-price{
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.buy-btn{
    border:none;
    border-radius:12px;
    padding:10px 15px;
    background:linear-gradient(135deg,#735cff,#b75cff);
    color:#fff;
    font-weight:800;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(135deg,#735cff,#bd5cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:15px;
    box-shadow:0 0 25px rgba(130,80,255,.4);
}

.profile-name{
    font-size:22px;
    font-weight:800;
}

.profile-id{
    color:rgba(255,255,255,.45);
    margin-top:5px;
    font-size:13px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.info-row:last-child{
    border-bottom:none;
}

.info-row span:first-child{
    color:rgba(255,255,255,.5);
}

.info-row span:last-child{
    font-weight:800;
}

.ref-box{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:rgba(113,103,255,.12);
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){
    .slot-reel{
        height:95px;
        font-size:43px;
    }

    .slot-logo{
        font-size:40px;
    }

    .game-card{
        min-height:145px;
    }
}

@media(min-width:700px){
    .games-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<section id="welcomeScreen">

    <div>
        <div class="logo">
            Yes<span>MoneY</span>
        </div>

        <div class="auth-buttons">
            <button class="auth-btn" id="loginButton">Увійти</button>
            <button class="auth-btn primary" id="registerButton">Реєстрація</button>
        </div>
    </div>

    <div class="welcome-content">
        <div class="welcome-icon">✨</div>

        <h1>Вітаємо в YesMoneY</h1>

        <p>
            Неоновий ігровий центр з яскравими
            демо-іграми та віртуальними YMY.
        </p>
    </div>

    <div class="welcome-bottom">
        Демо-платформа • Віртуальні YMY
    </div>

</section>

<section id="app" class="hidden">

    <header class="topbar">
        <div class="top-logo">YesMoneY</div>

        <div class="balance">
            💰 <span id="balanceValue">50</span>
            <small>YMY</small>
        </div>
    </header>

    <main class="content" id="mainContent"></main>

    <button class="support-btn" id="supportButton">🆘</button>

    <nav class="bottom-nav">

        <button class="nav-btn active" data-page="games">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>

        <button class="nav-btn" data-page="bonus">
            <span class="nav-icon">🎁</span>
            <span>Бонус</span>
        </button>

        <button class="nav-btn" id="wheelButton">
            <span class="nav-icon">🎰</span>
            <span>777</span>
        </button>

        <button class="nav-btn" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>

    </nav>

</section>

<!-- LOGIN -->

<div class="modal" id="loginModal">

    <div class="modal-box">

        <button class="close" data-close="loginModal">×</button>

        <h2>Вход</h2>

        <p style="color:rgba(255,255,255,.5);margin:8px 0 20px">
            Добро пожаловать обратно
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Ваш email" required>
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Ваш пароль" required>
            </div>

            <button class="submit-btn" type="submit">
                ВОЙТИ
            </button>

        </form>

        <div class="switch">
            Нет аккаунта?
            <button id="switchToRegister">Зарегистрироваться</button>
        </div>

    </div>

</div>

<!-- REGISTER -->

<div class="modal" id="registerModal">

    <div class="modal-box">

        <button class="close" data-close="registerModal">×</button>

</div>

<script>
const welcomeScreen=document.getElementById("welcomeScreen");
const app=document.getElementById("app");
const mainContent=document.getElementById("mainContent");
const balanceValue=document.getElementById("balanceValue");

let balance=Number(localStorage.getItem("ymyBalance"))||50;
let userName=localStorage.getItem("ymyName");
let userId=localStorage.getItem("ymyId");

function saveData(){
    localStorage.setItem("ymyBalance",balance);
    localStorage.setItem("ymyName",userName||"");
    localStorage.setItem("ymyId",userId||"");
}

function updateBalance(){
    balanceValue.textContent=Math.floor(balance);
    localStorage.setItem("ymyBalance",balance);
}

function openApp(){
    welcomeScreen.classList.add("hidden");
    app.classList.remove("hidden");
    updateBalance();
    showPage("games");
}

/* =========================
   GAMES
========================= */

const games=[
    ["🎰","777","Классический неоновый слот"],
    ["💎","Diamond","Алмазный режим"],
    ["🔥","Fire","Огненная игра"],
    ["🍀","Lucky","Попробуйте удачу"],
    ["👑","Royal","Королевский режим"],
    ["⚡","Lightning","Молниеносная игра"]
];

function gamesPage(){

    let html=`
        <div class="page">

            <h1 class="page-title">🎮 Игры</h1>

            <p class="page-subtitle">
                Выберите игру
            </p>

            <div class="games-grid">
    `;

    games.forEach((game,index)=>{

        html+=`
            <div class="game-card" onclick="openGame(${index})">

                <div class="game-icon">${game[0]}</div>

                <h3>${game[1]}</h3>

                <p>${game[2]}</p>

            </div>
        `;

    });

    html+=`
            </div>

        </div>
    `;

    mainContent.innerHTML=html;
}

/* =========================
   777 GAME
========================= */

const symbols=[
    "7️⃣",
    "🍒",
    "🍋",
    "💎",
    "⭐",
    "🔔",
    "🍀"
];

let slotSpinning=false;
let bet=5;

function openGame(index){

    if(index===0){
        slotsPage();
        return;
    }

    mainContent.innerHTML=`
        <div class="page" style="text-align:center">

            <h1 class="page-title">
                ${games[index][0]} ${games[index][1]}
            </h1>

            <p class="page-subtitle">
                Демо-игра будет добавлена следующим этапом.
            </p>

            <button
                class="buy-btn"
                style="width:100%;padding:15px"
                onclick="showPage('games')">

                ← Назад к играм

            </button>

        </div>
    `;
}

function slotsPage(){

    mainContent.innerHTML=`

        <div class="page slot-page">

            <div class="slot-logo">777</div>

            <div class="slot-subtitle">
                NEON JACKPOT
            </div>

            <div class="slot-machine" id="slotMachine">

                <div class="slot-reels">

                    <div class="slot-reel" id="reel1">7️⃣</div>

                    <div class="slot-reel" id="reel2">7️⃣</div>

                    <div class="slot-reel" id="reel3">7️⃣</div>

                </div>

                <div class="slot-line"></div>

            </div>

            <div class="slot-info">

                <div>
                    <span>Ставка</span>

                    <div class="slot-bet">

                        <button
                            class="bet-control"
                            onclick="changeBet(-5)">
                            −
                        </button>

                        <strong id="betValue">
                            ${bet} YMY
                        </strong>

                        <button
                            class="bet-control"
                            onclick="changeBet(5)">
                            +
                        </button>

                    </div>

                </div>

                <div>
                    <span>Баланс</span>

                    <strong id="slotBalance">
                        ${Math.floor(balance)} YMY
                    </strong>
                </div>

            </div>

            <button
                class="slots-spin"
                id="slotSpinButton"
                onclick="spin777()">

                КРУТИТЬ 777

            </button>

            <div
                class="slots-result"
                id="slotsResult">
            </div>

            <p style="
                color:rgba(255,255,255,.3);
                font-size:11px;
                margin-top:15px;
            ">
                Демо-режим. Используются только виртуальные YMY.
            </p>

        </div>
    `;

}

function changeBet(value){

    bet+=value;

    if(bet<5) bet=5;
    if(bet>50) bet=50;

    if(bet>balance){
        bet=Math.max(5,Math.floor(balance));
    }

    const el=document.getElementById("betValue");

    if(el){
        el.textContent=bet+" YMY";
    }
}

function randomSymbol(){

    return symbols[
        Math.floor(Math.random()*symbols.length)
    ];
}

function spin777(){

    if(slotSpinning) return;

    if(balance<bet){

        showResult("Недостаточно YMY",false);

        return;
    }

    slotSpinning=true;

    balance-=bet;

    updateBalance();

    const spinButton=document.getElementById("slotSpinButton");

    if(spinButton){
        spinButton.disabled=true;
        spinButton.textContent="ВРАЩЕНИЕ...";
    }

    const reels=[
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
    ];

    reels.forEach(reel=>{
        reel.classList.remove("slot-win");
        reel.classList.add("slot-spinning");
    });

    document.getElementById("slotsResult").textContent="";

    let ticks=0;

    const animation=setInterval(()=>{

        reels.forEach(reel=>{
            reel.textContent=randomSymbol();
        });

        ticks++;

        if(ticks>=24){

            clearInterval(animation);

            finishSpin(reels);

        }

    },80);
}

function finishSpin(reels){

    const result=[
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

    /* Иногда создаём красивую комбинацию */

    const chance=Math.random();

    if(chance<0.08){

        result[0]="7️⃣";
        result[1]="7️⃣";
        result[2]="7️⃣";

    }else if(chance<0.20){

        const symbol=randomSymbol();

        result[0]=symbol;
        result[1]=symbol;
        result[2]=symbol;

    }else{

        while(
            result[0]===result[1] &&
            result[1]===result[2]
        ){
            result[2]=randomSymbol();
        }
    }

    reels.forEach((reel,index)=>{

        reel.classList.remove("slot-spinning");

        setTimeout(()=>{

            reel.textContent=result[index];

        },index*250);

    });

    setTimeout(()=>{

        calculateWin(result,reels);

    },900);
}

function calculateWin(result,reels){

    let win=0;

    const jackpot=
        result[0]==="7️⃣" &&
        result[1]==="7️⃣" &&
        result[2]==="7️⃣";

    const three=
        result[0]===result[1] &&
        result[1]===result[2];

    if(jackpot){

        win=bet*20;

        reels.forEach(r=>{
            r.classList.add("slot-win","jackpot");
        });

        showWinEffect(win,true);

    }else if(three){

        win=bet*8;

        reels.forEach(r=>{
            r.classList.add("slot-win");
        });

        showWinEffect(win,false);

    }else if(
        result[0]===result[1] ||
        result[1]===result[2] ||
        result[0]===result[2]
    ){

        win=bet*2;

        showResult(
            "✨ Совпадение! +"+win+" YMY",
            true
        );

    }else{

        showResult(
            "😅 Не повезло. Попробуйте ещё раз.",
            false
        );

    }

    balance+=win;

    updateBalance();

    const slotBalance=
        document.getElementById("slotBalance");

    if(slotBalance){
        slotBalance.textContent=
            Math.floor(balance)+" YMY";
    }

    slotSpinning=false;

    const button=
        document.getElementById("slotSpinButton");

    if(button){

        button.disabled=false;
        button.textContent="КРУТИТЬ 777";

    }

}

function showResult(text,win){

    const result=
        document.getElementById("slotsResult");

    if(!result) return;

    result.classList.remove("win-result");

    result.textContent=text;

    if(win){

        void result.offsetWidth;

        result.classList.add("win-result");

    }
}

/* =========================
   BIG WIN EFFECT
========================= */

function showWinEffect(amount,jackpot){

    const flash=document.createElement("div");

    flash.className="win-flash";

    document.body.appendChild(flash);

    setTimeout(()=>{
        flash.remove();
    },900);

    for(let i=0;i<25;i++){

        const coin=document.createElement("div");

        coin.className="win-coin";

        coin.textContent=
            jackpot ? "💰" : "🪙";

        coin.style.left=
            Math.random()*100+"%";

        coin.style.top=
            Math.random()*15+"%";

        coin.style.animationDelay=
            Math.random()*.5+"s";

        document.body.appendChild(coin);

        setTimeout(()=>{
            coin.remove();
        },2000);
    }

    const result=
        document.getElementById("slotsResult");

    if(result){

        result.classList.add("win-result");

        result.textContent=
            jackpot
            ? "🔥 JACKPOT 777! +"+amount+" YMY 🔥"
            : "🎉 БОЛЬШОЙ ВЫИГРЫШ! +"+amount+" YMY";

    }

    if(navigator.vibrate){

        navigator.vibrate(
            jackpot
            ? [120,60,120,60,300]
            : [100,60,180]
        );

    }
}

function showPage(page){

        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    const active=
        document.querySelector(
            `[data-page="${page}"]`
        );

    if(active){
        active.classList.add("active");
    }

    if(page==="games"){
        gamesPage();
    }

    if(page==="bonus"){
        bonusPage();
    }

    if(page==="profile"){
        profilePage();
    }
}
