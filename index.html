<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YesMoneY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
    font-family:Arial,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 50% -10%,#5d4715 0,#21190b 22%,#090909 58%,#030303 100%);
    min-height:100vh;
    overflow-x:hidden
}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===== WELCOME ===== */
#welcomeScreen{
 min-height:100vh;display:flex;flex-direction:column;
 justify-content:space-between;padding:35px 20px 45px;
 background:radial-gradient(circle at top,#5b4616,#090909 55%)
}
.logo{
 text-align:center;font-size:40px;font-weight:900;
 letter-spacing:2px;color:#ffd65a;
 text-shadow:0 0 25px #d59b22
}
.logo span{color:#fff;opacity:.8}
.auth-buttons{display:flex;justify-content:center;gap:10px;margin-top:25px}
.auth-btn{
 border:1px solid #80621d;border-radius:14px;padding:13px 20px;
 color:#fff;background:#15120b;font-weight:700
}
.auth-btn.primary,.gold-btn{
 background:linear-gradient(135deg,#a87514,#ffe083,#b47b16);
 color:#090909;border:none;font-weight:900;
 box-shadow:0 0 25px rgba(245,191,55,.3)
}
.welcome-content{text-align:center;max-width:500px;margin:auto}
.welcome-icon{font-size:75px;margin-bottom:20px}
.welcome-content h1{font-size:30px;margin-bottom:12px;color:#ffe28a}
.welcome-content p{color:#aaa;line-height:1.6}
.welcome-bottom{text-align:center;color:#765f29;font-size:13px}

/* ===== APP ===== */
#app{min-height:100vh;padding-bottom:90px}
.topbar{
 position:sticky;top:0;z-index:20;
 padding:17px 16px;
 display:flex;justify-content:space-between;align-items:center;
 background:rgba(5,5,5,.9);backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(255,210,80,.15)
}
.top-logo{font-size:25px;font-weight:900;color:#ffd75b}
.balance{
 padding:9px 13px;border-radius:14px;
 background:linear-gradient(135deg,#19140a,#0b0b0b);
 border:1px solid #6c521b;font-weight:900;color:#ffe082
}
.content{padding:15px;max-width:760px;margin:auto}
.page-title{font-size:29px;margin:10px 0 6px;color:#ffe083}
.page-subtitle{color:#8f8f8f;margin-bottom:20px}

/* ===== GAME CARDS ===== */
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.game-card{
 min-height:190px;border-radius:20px;overflow:hidden;
 position:relative;border:1px solid #604918;
 background:#0b0b0b;
 box-shadow:0 8px 30px rgba(0,0,0,.4);
 transition:.25s
}
.game-card:active{transform:scale(.97)}
.game-art{
 height:112px;display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden
}
.game-art:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(transparent 30%,rgba(0,0,0,.8))
}
.art-777{background:radial-gradient(circle,#9b741c,#251b09 55%,#050505)}
.art-diamond{background:radial-gradient(circle,#9d781c,#19140a 55%,#030303)}
.art-candy{background:radial-gradient(circle,#d38d24,#3b2005 55%,#080604)}
.art-mines{background:radial-gradient(circle,#62501e,#15130a 50%,#030303)}
.art-rocket{background:radial-gradient(circle,#d69c29,#211708 50%,#030303)}
.art-target{background:radial-gradient(circle,#c99221,#1e1708 50%,#030303)}

.art-symbol{
 position:relative;z-index:2;font-size:55px;
 filter:drop-shadow(0 0 15px #ffd45b)
}
.game-info{padding:12px}
.game-info h3{font-size:16px;color:#ffe083}
.game-info p{font-size:11px;color:#777;margin-top:4px}
.play{
 width:100%;margin-top:9px;padding:8px;border:0;border-radius:9px;
 background:linear-gradient(135deg,#9b6d11,#ffe083,#a87513);
 font-weight:900;color:#080808
}

/* ===== NAV ===== */
.bottom-nav{
 position:fixed;z-index:50;bottom:0;left:0;right:0;height:76px;
 background:rgba(5,5,5,.96);border-top:1px solid #604918;
 display:grid;grid-template-columns:repeat(4,1fr)
}
.nav-btn{
 background:none;border:0;color:#777;display:flex;
 flex-direction:column;justify-content:center;align-items:center;gap:5px
}
.nav-icon{font-size:22px}
.nav-btn span:last-child{font-size:10px}
.nav-btn.active{color:#ffd75b;text-shadow:0 0 12px #d49b27}

/* ===== MODAL ===== */
.modal{
 position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);
 display:none;align-items:center;justify-content:center;padding:12px
}
.modal.active{display:flex}
.modal-box{
 width:100%;max-width:500px;max-height:94vh;overflow:auto;
 background:linear-gradient(145deg,#17130a,#070707);
 border:1px solid #72551b;border-radius:24px;padding:20px;
 box-shadow:0 0 60px rgba(221,169,48,.18);position:relative
}
.close{
 position:absolute;right:12px;top:10px;width:35px;height:35px;
 border:1px solid #624918;border-radius:50%;background:#151109;
 color:#ffd866;font-size:22px
}

/* ===== COMMON GAME ===== */
.game-head{text-align:center;margin-bottom:15px}
.game-head h2{color:#ffe083;font-size:25px}
.game-head p{color:#777;margin-top:5px}
.game-balance{
 text-align:center;background:#100e09;border:1px solid #554119;
 border-radius:12px;padding:9px;margin-bottom:13px;color:#ffd75b
}
.action{
 border:0;border-radius:13px;padding:14px 20px;
 background:linear-gradient(135deg,#a87514,#ffe083,#a87514);
 color:#080808;font-weight:900
}
.bet-row{display:flex;justify-content:center;gap:8px;align-items:center;margin:12px}
.small{
 width:35px;height:35px;border:1px solid #604918;
 background:#17130a;color:#ffd75b;border-radius:9px;font-size:18px
}

/* ===== 777 ONLY BARAAN ===== */
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.reel{
 height:100px;background:#111;border:2px solid #75551a;
 border-radius:15px;display:flex;align-items:center;justify-content:center;
 font-size:48px;box-shadow:inset 0 0 25px #000
}
.win{animation:win .5s infinite alternate}
@keyframes win{to{box-shadow:0 0 30px #ffd34e;transform:scale(1.04)}}

/* ===== DIAMOND LINES ===== */
.lines-grid{
 display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
 background:#080808;border:1px solid #664c18;padding:7px;border-radius:15px
}
.line-cell{
 aspect-ratio:1;display:flex;align-items:center;justify-content:center;
 border-radius:9px;background:linear-gradient(145deg,#211b0c,#090909);
 font-size:27px;border:1px solid #33270f;transition:.2s
}
.line-cell.hit{
 background:#6c4e0c;box-shadow:0 0 18px #ffd34e;
 transform:scale(1.08)
}
.lines-note{text-align:center;color:#888;font-size:12px;margin:12px}

/* ===== CANDY ===== */
.candy-grid{
 display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
 padding:7px;border-radius:15px;background:#0b0805;border:1px solid #674b18
}
.candy{
 aspect-ratio:1;border-radius:12px;display:flex;align-items:center;
 justify-content:center;font-size:25px;background:#201708;
 transition:.3s
}
.candy.blast{animation:blast .45s forwards}
@keyframes blast{50%{transform:scale(1.3);filter:brightness(2)}100%{transform:scale(0);opacity:0}}

/* ===== MINES ===== */
.mine-grid{
 display:grid;grid-template-columns:repeat(5,1fr);gap:6px
}
.mine{
 aspect-ratio:1;border:1px solid #604918;border-radius:10px;
 background:linear-gradient(145deg,#211a0c,#080808);
 color:#ffd75b;font-size:23px
}
.mine.safe{background:#574313;box-shadow:0 0 15px #dcae32}
.mine.boom{background:#651d12;box-shadow:0 0 25px #e44}

/* ===== ROCKET ===== */
.rocket-screen{
 height:240px;border-radius:20px;border:1px solid #604918;
 background:radial-gradient(circle at 50% 100%,#6e4b12,#080808 60%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 position:relative;overflow:hidden
}
.rocket{font-size:70px;transition:.1s}
.mult{font-size:42px;font-weight:900;color:#ffd75b}
.rocket.fly{animation:fly .8s infinite alternate}
@keyframes fly{to{transform:translate(20px,-25px)}}

/* ===== TARGET ===== */
.target-board{
 height:300px;position:relative;border-radius:20px;
 border:1px solid #604918;background:radial-gradient(circle,#4b3811,#080808 65%);
 overflow:hidden
}
.target{
 position:absolute;width:62px;height:62px;border-radius:50%;
 background:radial-gradient(circle,#ffe083 0 15%,#a87514 16% 35%,#111 36% 50%,#ffd75b 51% 60%,#111 61%);
 border:2px solid #ffe083;box-shadow:0 0 20px #c89427
}

/* ===== PROFILE ===== */
.profile{
 background:#0e0d09;border:1px solid #604918;border-radius:18px;padding:20px
}
.info{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #29210f}
.info span:first-child{color:#777}.info span:last-child{color:#ffd75b;font-weight:900}

/* ===== TOAST ===== */
.toast{
 position:fixed;z-index:300;left:50%;bottom:95px;transform:translateX(-50%);
 background:#161208;border:1px solid #8b671f;color:#ffe083;
 padding:13px 18px;border-radius:13px;font-weight:800;
 opacity:0;pointer-events:none;transition:.3s
}
.toast.show{opacity:1}

@media(max-width:430px){
 .games-grid{gap:9px}
 .game-card{min-height:175px}
 .game-art{height:100px}
 .art-symbol{font-size:45px}
}
</style>
</head>

<body>

<section id="welcomeScreen">
 <div>
  <div class="logo">Yes<span>MoneY</span></div>
  <div class="auth-buttons">
   <button class="auth-btn" onclick="demoLogin()">Увійти</button>
   <button class="auth-btn primary" onclick="demoLogin()">Реєстрація</button>
  </div>
 </div>

 <div class="welcome-content">
  <div class="welcome-icon">👑</div>
  <h1>Ласкаво просимо</h1>
  <p>Ігрова платформа YesMoneY.<br>Усі ігри працюють у демо-режимі з віртуальним балансом YMY.</p>
 </div>

 <div class="welcome-bottom">YESMONEY • DEMO PLATFORM</div>
</section>

<section id="app" class="hidden">

 <header class="topbar">
  <div class="top-logo">YesMoneY</div>
  <div class="balance">💰 <span id="balance">1000</span> YMY</div>
 </header>

 <main class="content" id="content"></main>

 <nav class="bottom-nav">
  <button class="nav-btn active" data-page="games">
   <span class="nav-icon">🎮</span><span>Ігри</span>
  </button>
  <button class="nav-btn" data-page="bonus">
   <span class="nav-icon">🎁</span><span>Бонус</span>
  </button>
  <button class="nav-btn" data-page="profile">
   <span class="nav-icon">👤</span><span>Профіль</span>
  </button>
  <button class="nav-btn" onclick="showWheel()">
   <span class="nav-icon">🎡</span><span>Барабан</span>
  </button>
 </nav>
</section>

<div class="modal" id="gameModal">
 <div class="modal-box" id="gameBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let balance=Number(localStorage.getItem("ymyBalance"))||1000;
let currentGame=null;
let spinning=false;

const games=[
 {id:"777",name:"777 Classic",desc:"Класичний слот • 3 барабани",icon:"7️⃣",art:"art-777"},
 {id:"diamond",name:"Diamond Lines",desc:"5×3 • виграшні лінії",icon:"💎",art:"art-diamond"},
 {id:"candy",name:"Candy Blast",desc:"6×5 • каскадні комбінації",icon:"🍬",art:"art-candy"},
 {id:"mines",name:"Mines",desc:"Клітинки • множник",icon:"💣",art:"art-mines"},
 {id:"rocket",name:"Rocket",desc:"Динамічний множник",icon:"🚀",art:"art-rocket"},
 {id:"target",name:"Lucky Target",desc:"Ціль • множники",icon:"🎯",art:"art-target"}
];

function save(){
 localStorage.setItem("ymyBalance",balance);
 document.getElementById("balance").textContent=Math.floor(balance);
}
function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2200);
}
function demoLogin(){
 document.getElementById("welcomeScreen").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 showPage("games");
 save();
}

function showPage(page){
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
 const active=document.querySelector(`[data-page="${page}"]`);
 if(active)active.classList.add("active");

 if(page==="games")gamesPage();
 if(page==="bonus")bonusPage();
 if(page==="profile")profilePage();
}

function gamesPage(){
 document.getElementById("content").innerHTML=`
 <div>
  <h1 class="page-title">🎮 Ігри</h1>
  <p class="page-subtitle">Обирайте гру та випробовуйте удачу</p>
  <div class="games-grid">
   ${games.map(g=>`
    <div class="game-card" onclick="openGame('${g.id}')">
     <div class="game-art ${g.art}">
      <div class="art-symbol">${g.icon}</div>
     </div>
     <div class="game-info">
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <button class="play">ГРАТИ</button>
     </div>
    </div>
   `).join("")}
  </div>
 </div>`;
}

/* ===== 777 ===== */
function game777(){
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>7️⃣ 777 CLASSIC</h2><p>Єдина гра з барабанами</p></div>
 <div class="game-balance">Баланс: <b>${Math.floor(balance)} YMY</b></div>
 <div class="reels" id="reels">
  <div class="reel">7️⃣</div><div class="reel">🍒</div><div class="reel">💎</div>
 </div>
 <div class="bet-row">
  <button class="small" onclick="changeBet(-10)">−</button>
  <b id="bet777">10 YMY</b>
  <button class="small" onclick="changeBet(10)">+</button>
 </div>
 <button class="action" style="width:100%" onclick="spin777()">КРУТИТИ</button>
 <p id="result777" style="text-align:center;color:#999;margin-top:15px"></p>`;
}

let bet=10;
function changeBet(v){bet=Math.max(10,Math.min(100,bet+v));document.getElementById("bet777").textContent=bet+" YMY"}
function spin777(){
 if(spinning)return;
 if(balance<bet){toast("Недостатньо YMY");return}
 spinning=true;balance-=bet;save();
 const cells=document.querySelectorAll(".reel");
 const symbols=["7️⃣","🍒","💎","🍋","⭐","BAR"];
 cells.forEach((c,i)=>{
  c.classList.remove("win");
  let n=0;
  const timer=setInterval(()=>{
   c.textContent=symbols[Math.floor(Math.random()*symbols.length)];
   n++;
   if(n>12+i*4)clearInterval(timer);
  },70);
 });
 setTimeout(()=>{
  const win=Math.random()<.28;
  if(win){
   cells.forEach(c=>{c.textContent="7️⃣";c.classList.add("win")});
   const prize=bet*5;
   balance+=prize;toast("🎉 Виграш +"+prize+" YMY!");
  }else{
   toast("Спробуйте ще раз");
  }
  save();spinning=false;
 },1300);
}

/* ===== DIAMOND LINES ===== */
const gems=["💎","🔷","🟡","🟣","🔴","🟢"];
function gameDiamond(){
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>💎 DIAMOND LINES</h2><p>Збирайте однакові символи на лініях</p></div>
 <div class="game-balance">Баланс: <b>${Math.floor(balance)} YMY</b></div>
 <div class="lines-grid" id="diamondGrid"></div>
 <div class="lines-note">Виграш визначається комбінаціями по горизонтальних лініях</div>
 <button class="action" style="width:100%" onclick="playDiamond()">ЗАПУСТИТИ</button>
 <p id="diamondResult" style="text-align:center;color:#999;margin-top:12px"></p>`;
 fillDiamond();
}
function fillDiamond(){
 const g=document.getElementById("diamondGrid");
 g.innerHTML="";
 for(let i=0;i<15;i++)g.innerHTML+=`<div class="line-cell">${gems[Math.floor(Math.random()*gems.length)]}</div>`;
}
function playDiamond(){
 if(balance<20){toast("Недостатньо YMY");return}
 balance-=20;save();fillDiamond();
 setTimeout(()=>{
  const cells=[...document.querySelectorAll(".line-cell")];
  let win=Math.random()<.45;
  if(win){
   const row=Math.floor(Math.random()*3);
   cells.slice(row*5,row*5+3).forEach(x=>x.classList.add("hit"));
   const prize=40+Math.floor(Math.random()*100);
   balance+=prize;
   document.getElementById("diamondResult").textContent="💎 ЛІНІЯ ВИГРАЛА +"+prize+" YMY";
   toast("💎 Виграш!");
  }else document.getElementById("diamondResult").textContent="Комбінації немає";
  save();
 },250);
}

/* ===== CANDY ===== */
const candies=["🍬","🍭","🍓","🍋","🍇","🍊"];
function gameCandy(){
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>🍬 CANDY BLAST</h2><p>З'єднуйте однакові символи</p></div>
 <div class="game-balance">Баланс: <b>${Math.floor(balance)} YMY</b></div>
 <div class="candy-grid" id="candyGrid"></div>
 <button class="action" style="width:100%;margin-top:15px" onclick="playCandy()">ЗАПУСТИТИ КАСКАД</button>
 <p id="candyResult" style="text-align:center;color:#999;margin-top:12px"></p>`;
 fillCandy();
}
function fillCandy(){
 const g=document.getElementById("candyGrid");g.innerHTML="";
 for(let i=0;i<30;i++)g.innerHTML+=`<div class="candy">${candies[Math.floor(Math.random()*candies.length)]}</div>`;
}
function playCandy(){
 if(balance<20){toast("Недостатньо YMY");return}
 balance-=20;save();
 const cells=document.querySelectorAll(".candy");
 let win=Math.random()<.55;
 if(win){
  [...cells].sort(()=>Math.random()-.5).slice(0,6).forEach(c=>c.classList.add("blast"));
  const prize=50+Math.floor(Math.random()*150);
  balance+=prize;
  toast("🍬 КАСКАД! +"+prize+" YMY");
  setTimeout(fillCandy,500);
 }else toast("Каскад не створив виграш");
 save();
}

/* ===== MINES ===== */
let minesOver=false;
function gameMines(){
 minesOver=false;
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>💣 MINES</h2><p>Відкривайте безпечні клітинки</p></div>
 <div class="game-balance">Ставка: <b>20 YMY</b> • Множник: <b id="mineMult">1.00x</b></div>
 <div class="mine-grid" id="mineGrid"></div>
 <button class="action" style="width:100%;margin-top:15px" onclick="startMines()">НОВИЙ РАУНД</button>`;
 startMines();
}
function startMines(){
 if(balance<20){toast("Недостатньо YMY");return}
 balance-=20;save();minesOver=false;
 const g=document.getElementById("mineGrid");g.innerHTML="";
 for(let i=0;i<25;i++){
  const b=document.createElement("button");b.className="mine";b.textContent="?";
  b.onclick=()=>openMine(b);g.appendChild(b);
 }
 document.getElementById("mineMult").textContent="1.00x";
}
function openMine(b){
 if(minesOver||b.classList.contains("safe"))return;
 if(Math.random()<.18){
  b.classList.add("boom");b.textContent="💣";minesOver=true;
  [...document.querySelectorAll(".mine")].forEach(x=>x.disabled=true);
  toast("💥 Міна! Раунд завершено");
 }else{
  b.classList.add("safe");b.textContent="💎";
  let opened=document.querySelectorAll(".mine.safe").length;
  let mult=(1+opened*.25).toFixed(2);
  document.getElementById("mineMult").textContent=mult+"x";
  if(opened>=10){
   const prize=Math.floor(20*mult);balance+=prize;save();
   toast("💎 Виграш "+prize+" YMY!");
  }
 }
}

/* ===== ROCKET ===== */
let rocketTimer=null,rocketMult=1;
function gameRocket(){
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>🚀 ROCKET</h2><p>Зупиніть множник до завершення раунду</p></div>
 <div class="game-balance">Ставка: <b>20 YMY</b></div>
 <div class="rocket-screen">
  <div class="mult" id="rocketMult">1.00x</div>
  <div class="rocket" id="rocket">🚀</div>
 </div>
 <button class="action" style="width:100%;margin-top:15px" onclick="startRocket()">СТАРТ</button>
 <button class="action" style="width:100%;margin-top:8px;background:#222;color:#ffd75b" onclick="cashRocket()">ЗАБРАТИ ВИГРАШ</button>`;
}
function startRocket(){
 if(rocketTimer)return;
 if(balance<20){toast("Недостатньо YMY");return}
 balance-=20;save();rocketMult=1;
 document.getElementById("rocket").classList.add("fly");
 rocketTimer=setInterval(()=>{
  rocketMult*=1.035;
  document.getElementById("rocketMult").textContent=rocketMult.toFixed(2)+"x";
  if(Math.random()<.018)crashRocket();
 },100);
}
function crashRocket(){
 clearInterval(rocketTimer);rocketTimer=null;
 document.getElementById("rocket").classList.remove("fly");
 toast("🚀 Ракета злетіла занадто високо!");
}
function cashRocket(){
 if(!rocketTimer)return;
 const prize=Math.floor(20*rocketMult);
 clearInterval(rocketTimer);rocketTimer=null;
 document.getElementById("rocket").classList.remove("fly");
 balance+=prize;save();toast("🚀 Забрано "+prize+" YMY!");
}

function gameTarget(){
 document.getElementById("gameBox").innerHTML=`
 <div class="game-head"><h2>🎯 LUCKY TARGET</h2><p>Натисніть на ціль та знайдіть множник</p></div>

 <button class="action" style="width:100%;margin-top:15px" onclick="newTarget()">НОВА ЦІЛЬ</button>`;
 newTarget();
}
function newTarget(){
 if(balance<20){toast("Недостатньо YMY");return}
 balance-=20;save();
 const board=document.getElementById("targetBoard");
 board.innerHTML="";
 const t=document.createElement("button");t.className="target";
 t.style.left=(Math.random()*75+5)+"%";t.style.top=(Math.random()*65+5)+"%";
 t.onclick=()=>{
  const mult=[1.5,2,3,5,10][Math.floor(Math.random()*5)];
  const prize=Math.floor(20*mult);balance+=prize;save();
  toast("🎯 Влучання! +"+prize+" YMY");
  t.remove();
 };
 board.appendChild(t);
}
