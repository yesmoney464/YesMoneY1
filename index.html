<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YesMoneY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --gold:#f5c451;
    --gold2:#ffdf7b;
    --dark:#070707;
    --panel:#111111;
    --panel2:#181818;
    --text:#fff;
    --muted:#9d9d9d;
    --green:#19c878;
    --red:#ff4d5e;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,#473514 0%,#16120b 28%,#070707 65%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   WELCOME
========================= */

#welcomeScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:35px 20px 40px;
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--gold);
    text-shadow:
        0 0 8px rgba(245,196,81,.8),
        0 0 30px rgba(245,196,81,.25);
}

.logo span{
    color:white;
    opacity:.75;
}

.auth-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.auth-btn{
    padding:13px 20px;
    border-radius:14px;
    color:white;
    border:1px solid rgba(255,255,255,.15);
    background:#171717;
    font-weight:800;
}

.auth-btn.primary{
    border:0;
    color:#080808;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    box-shadow:0 0 25px rgba(245,196,81,.25);
}

.welcome-content{
    text-align:center;
    max-width:500px;
    margin:auto;
}

.welcome-icon{
    font-size:70px;
    margin-bottom:20px;
    animation:float 2.8s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-10px)}
}

.welcome-content h1{
    font-size:29px;
    margin-bottom:12px;
}

.welcome-content p{
    color:#999;
    line-height:1.6;
}

.welcome-bottom{
    text-align:center;
    color:#555;
    font-size:12px;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    padding-bottom:82px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 16px 13px;
    background:rgba(5,5,5,.9);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(245,196,81,.12);
}

.top-logo{
    font-size:24px;
    font-weight:900;
    color:var(--gold);
    text-shadow:0 0 15px rgba(245,196,81,.35);
}

.balance{
    padding:9px 13px;
    border-radius:13px;
    background:#151515;
    border:1px solid rgba(245,196,81,.2);
    font-weight:900;
}

.balance small{
    color:#888;
}

.content{
    max-width:720px;
    margin:auto;
    padding:15px 14px 25px;
}

/* =========================
   COMMON
========================= */

.page{
    animation:pageIn .3s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.page-title{
    font-size:29px;
    margin:8px 0 5px;
}

.page-subtitle{
    color:#888;
    margin-bottom:20px;
}

.gold{
    color:var(--gold);
}

/* =========================
   GAME CARDS
========================= */

.games-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.game-card{
    min-height:180px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:
        linear-gradient(145deg,#222,#0d0d0d);
    border:1px solid rgba(245,196,81,.16);
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    transition:.2s;
}

.game-card:active{
    transform:scale(.96);
}

.game-cover{
    height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.game-cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,.75)
    );
}

.cover-777{
    background:
        radial-gradient(circle,#ffdb62 0,#9a5012 28%,#171009 70%);
}

.cover-duel{
    background:
        radial-gradient(circle at 50% 30%,#315c42,#0a2115 65%,#050805);
}

.cover-aviator{
    background:
        radial-gradient(circle at 70% 20%,#7e291c,#220a08 55%,#060606);
}

.cover-gems{
    background:
        radial-gradient(circle,#3c79ff,#091735 60%,#050505);
}

.cover-icon{
    position:relative;
    z-index:2;
    font-size:55px;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.8));
}

.game-info{
    padding:11px 13px;
}

.game-info h3{
    font-size:16px;
    margin-bottom:4px;
}

.game-info p{
    color:#777;
    font-size:12px;
}

.game-status{
    position:absolute;
    right:8px;
    top:8px;
    z-index:5;
    padding:5px 8px;
    border-radius:8px;
    background:rgba(0,0,0,.7);
    color:var(--gold);
    font-size:10px;
    font-weight:900;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(8,8,8,.96);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(245,196,81,.15);
}

.nav-btn{
    border:0;
    background:none;
    color:#666;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
}

.nav-icon{
    font-size:23px;
}

.nav-btn span:last-child{
    font-size:10px;
}

.nav-btn.active{
    color:var(--gold);
    text-shadow:0 0 12px rgba(245,196,81,.5);
}

/* =========================
   SUPPORT
========================= */

.support-btn{
    position:fixed;
    z-index:60;
    left:13px;
    bottom:88px;
    width:48px;
    height:48px;
    border:1px solid rgba(245,196,81,.2);
    border-radius:50%;
    background:#171717;
    color:var(--gold);
    font-size:21px;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

/* =========================
   GAME SCREEN
========================= */

.game-screen{
    position:fixed;
    z-index:200;
    inset:0;
    overflow:auto;
    background:
        radial-gradient(circle at 50% 0%,#382a10,#090909 48%,#030303);
    animation:gameIn .3s ease;
}

@keyframes gameIn{
    from{
        opacity:0;
        transform:scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.game-top{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(245,196,81,.15);
}

.back-btn{
    border:1px solid #333;
    background:#151515;
    color:white;
    border-radius:11px;
    padding:9px 12px;
}

.game-name{
    font-weight:900;
    color:var(--gold);
}

.game-balance{
    font-size:13px;
    color:#aaa;
}

.game-body{
    max-width:650px;
    margin:auto;
    padding:20px 14px 50px;
}

/* =========================
   777
========================= */

.slot-machine{
    padding:18px;
    border-radius:25px;
    background:
        linear-gradient(145deg,#2b1c08,#100d08);
    border:1px solid rgba(245,196,81,.35);
    box-shadow:
        0 0 35px rgba(245,196,81,.1),
        inset 0 0 40px rgba(0,0,0,.5);
}

.slot-logo{
    text-align:center;
    font-size:35px;
    font-weight:1000;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:
        0 0 8px #fff0a0,
        0 0 25px rgba(245,196,81,.8);
    margin-bottom:18px;
}

.slot-reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.reel{
    height:125px;
    border-radius:16px;
    background:
        linear-gradient(#262626,#0c0c0c);
    border:2px solid #4a3a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    box-shadow:inset 0 0 20px #000;
}

.reel.spin{
    animation:reelSpin .13s linear infinite;
}

@keyframes reelSpin{
    0%{transform:translateY(-5px)}
    50%{transform:translateY(5px)}
    100%{transform:translateY(-5px)}
}

.reel.win{
    animation:reelWin .45s ease infinite alternate;
}

@keyframes reelWin{
    from{
        box-shadow:0 0 10px rgba(245,196,81,.2);
        transform:scale(1);
    }
    to{
        box-shadow:
            0 0 30px rgba(245,196,81,.95),
            inset 0 0 20px rgba(245,196,81,.25);
        transform:scale(1.04);
    }
}

.slot-controls{
    margin-top:18px;
}

.bet-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#151515;
    border-radius:13px;
    padding:10px 12px;
    margin-bottom:10px;
}

.bet-buttons{
    display:flex;
    align-items:center;
    gap:10px;
}

.bet-buttons button{
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#272727;
    color:white;
    font-size:19px;
}

.spin-main{
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#e7af32,#ffe58b);
    color:#100d06;
    font-weight:1000;
    font-size:17px;
    box-shadow:0 7px 25px rgba(245,196,81,.18);
}

.spin-main:disabled{
    opacity:.5;
}

.slot-message{
    text-align:center;
    min-height:30px;
    margin-top:15px;
    font-weight:900;
}

.win-big{
    animation:winText .5s ease infinite alternate;
}

@keyframes winText{
    from{transform:scale(1)}
    to{
        transform:scale(1.12);
        color:#ffe88b;
        text-shadow:0 0 20px rgba(245,196,81,.8);
    }
}

/* =========================
   DU RAK
========================= */

.durak{
    min-height:650px;
    border-radius:25px;
    padding:14px;
    background:
        radial-gradient(circle at center,#16572e,#0b2d1a 60%,#06160c);
    border:5px solid #332513;
    box-shadow:
        inset 0 0 50px rgba(0,0,0,.5),
        0 15px 40px rgba(0,0,0,.5);
}

.durak-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.status{
    padding:7px 10px;
    border-radius:9px;
    background:rgba(0,0,0,.3);
    color:#ddd;
    font-size:12px;
}

.trump{
    display:flex;
    align-items:center;
    gap:9px;
    margin:10px 0 18px;
}

.trump-card{
    width:55px;
    height:76px;
    border-radius:8px;
    background:white;
    color:#111;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:900;
    box-shadow:0 5px 12px rgba(0,0,0,.5);
}

.trump-label{
    color:#d5d5d5;
    font-size:12px;
}

.bot-area{
    min-height:100px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hand{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    min-height:105px;
    position:relative;
    margin:5px 0;
}

.card{
    width:58px;
    height:86px;
    margin-left:-13px;
    border-radius:8px;
    background:#fff;
    color:#111;
    border:1px solid #bbb;
    box-shadow:0 5px 12px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:6px;
    font-weight:900;
    user-select:none;
    transition:.18s;
    position:relative;
}

.card:first-child{
    margin-left:0;
}

.card.red{
    color:#d9273e;
}

.card.playable{
    cursor:pointer;
}

.card.playable:hover,
.card.playable:active{
    transform:translateY(-15px);
}

.card.back{
    background:
        repeating-linear-gradient(
            45deg,
            #7b141c 0,
            #7b141c 5px,
            #b52b36 5px,
            #b52b36 10px
        );
    border:3px solid white;
}

.card-center{
    font-size:25px;
    text-align:center;
}

.table{
    min-height:190px;
    margin:10px 0;
    border-radius:18px;
    background:rgba(0,0,0,.12);
    border:1px solid rgba(255,255,255,.08);
    padding:18px;
}

.attack-row{
    display:flex;
    justify-content:center;
    gap:8px;
    min-height:90px;
}

.play-card{
    width:58px;
    height:86px;
    border-radius:8px;
    background:white;
    color:#111;
    padding:5px;
    font-weight:900;
    box-shadow:0 6px 15px rgba(0,0,0,.5);
    animation:cardPlay .25s ease;
}

@keyframes cardPlay{
    from{
        opacity:0;
        transform:translateY(-30px) rotate(-5deg);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.durak-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.action{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px 8px;
    font-weight:900;
    color:white;
    background:#252525;
}

.action.gold{
    background:linear-gradient(135deg,#c08a21,#f0c95b);
    color:#171007;
}

.action.red{
    background:#751d27;
}

.action:disabled{
    opacity:.4;
}

/* =========================
   PROFILE / BONUS
========================= */

.panel{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:18px;
    margin-bottom:13px;
}

.panel h3{
    margin-bottom:8px;
}

.panel p{
    color:#888;
    line-height:1.5;
}

.bonus-btn{
    width:100%;
    margin-top:14px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#c99425,#f7d66c);
    font-weight:900;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid #242424;
}

.info-row:last-child{
    border-bottom:0;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    z-index:500;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#151515;
    border:1px solid rgba(245,196,81,.2);
    border-radius:22px;
    padding:22px;
    position:relative;
}

.close{
    position:absolute;
    right:12px;
    top:12px;
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#292929;
    color:white;
    font-size:21px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid #333;
    background:#0e0e0e;
    color:white;
    outline:0;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#d39b29,#ffe082);
    font-weight:900;
}

.switch{
    margin-top:15px;
    text-align:center;
    color:#777;
    font-size:13px;
}

.switch button{
    border:0;
    background:none;
    color:var(--gold);
    font-weight:900;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:430px){
    .games-grid{
        gap:9px;
    }

    .game-card{
        min-height:170px;
    }

    .card,
    .play-card{
        width:52px;
        height:78px;
    }

    .reel{
        height:110px;
        font-size:48px;
    }
}

@media(min-width:700px){
    .games-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<section id="welcomeScreen">

    <div>
        <div class="logo">
            Yes<span>MoneY</span>
        </div>

        <div class="auth-buttons">
            <button class="auth-btn" id="loginButton">Увійти</button>
            <button class="auth-btn primary" id="registerButton">Реєстрація</button>
        </div>
    </div>

    <div class="welcome-content">
        <div class="welcome-icon">👑</div>

        <h1>Ласкаво просимо</h1>

        <p>
            Розважальна ігрова платформа
            YesMoneY з віртуальними YMY.
        </p>
    </div>

    <div class="welcome-bottom">
        YesMoneY • Ігри • Бонуси • Розваги
    </div>

</section>


<section id="app" class="hidden">

    <header class="topbar">
        <div class="top-logo">YesMoneY</div>

        <div class="balance">
            💰 <span id="balanceValue">50</span>
            <small>YMY</small>
        </div>
    </header>

    <main class="content" id="mainContent"></main>

    <button class="support-btn" id="supportButton">?</button>

    <nav class="bottom-nav">

        <button class="nav-btn active" data-page="games">
            <span class="nav-icon">🎮</span>
            <span>Ігри</span>
        </button>

        <button class="nav-btn" data-page="bonus">
            <span class="nav-icon">🎁</span>
            <span>Бонус</span>
        </button>

        <button class="nav-btn" data-page="games2">
            <span class="nav-icon">🃏</span>
            <span>Карти</span>
        </button>

        <button class="nav-btn" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>Профіль</span>
        </button>

    </nav>
</section>


<!-- LOGIN -->

<div class="modal" id="loginModal">

    <div class="modal-box">

        <button class="close" data-close="loginModal">×</button>

        <h2>Вхід</h2>
        <p style="color:#777;margin:8px 0 18px">
            Увійдіть до свого акаунта
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input id="loginEmail" type="email" required>
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input id="loginPassword" type="password" required>
            </div>

            <button class="submit-btn">
                УВІЙТИ
            </button>

        </form>

        <div class="switch">
            Немає акаунта?
            <button id="switchToRegister">
                Реєстрація
            </button>
        </div>

    </div>
</div>


<!-- REGISTER -->

<div class="modal" id="registerModal">

    <div class="modal-box">

        <button class="close" data-close="registerModal">×</button>

        <h2>Реєстрація</h2>

        <p style="color:#777;margin:8px 0 18px">
            Створіть акаунт YesMoneY
        </p>

        <form id="registerForm">

            <div class="input-group">
                <label>Ім'я</label>
                <input id="registerName" minlength="3" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input id="registerEmail" type="email" required>
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input id="registerPassword" type="password" minlength="6" required>
            </div>

            <div class="input-group">
                <label>Повторіть пароль</label>
                <input id="registerPassword2" type="password" minlength="6" required>
            </div>

            <button class="submit-btn">
                СТВОРИТИ АКАУНТ
            </button>

        </form>

        <div class="switch">
            Вже маєте акаунт?
            <button id="switchToLogin">
                Увійти
            </button>
        </div>

    </div>
</div>


<script>

/* =====================================================
   DATA
===================================================== */

let balance =
    Number(localStorage.getItem("ymyBalance")) || 50;

let userName =
    localStorage.getItem("ymyName") || null;

let userId =
    localStorage.getItem("ymyId") || null;

let freeBonusTaken =
    localStorage.getItem("ymyFreeBonus") === "1";


const welcomeScreen =
    document.getElementById("welcomeScreen");

const app =
    document.getElementById("app");

const mainContent =
    document.getElementById("mainContent");

                            </strong>

                        onclick="spin777()">

function changeBet(direction){

    slotBet += direction;

    if(slotBet<1)
        slotBet=1;

    if(slotBet>20)
        slotBet=20;

    document.getElementById("slotBet").textContent =
        slotBet + " YMY";
}


function spin777(){

    if(slotSpinning)
        return;

    if(balance<slotBet){

        document.getElementById("slotMessage").textContent =
            "Недостатньо YMY.";

        return;
    }

    slotSpinning=true;

    balance-=slotBet;

    updateBalance();

    document.getElementById("slotBalance").textContent =
        Math.floor(balance);

    const button =
        document.getElementById("slotSpin");

    button.disabled=true;

    const reels=[
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
    ];

    reels.forEach(r=>{
        r.classList.remove("win");
        r.classList.add("spin");
    });

    document.getElementById("slotMessage").textContent =
        "Обертання...";

    const result=[
        symbols[Math.floor(Math.random()*symbols.length)],
        symbols[Math.floor(Math.random()*symbols.length)],
        symbols[Math.floor(Math.random()*symbols.length)]
    ];

    reels.forEach((reel,index)=>{

        setTimeout(()=>{

            reel.classList.remove("spin");
            reel.textContent=result[index];

        },1000 + index*550);

    });


    setTimeout(()=>{

        let win=0;

        if(
            result[0] === result[1] &&
            result[1] === result[2]
        ){

            if(result[0]==="7️⃣")
                win=slotBet*25;
            else if(result[0]==="💎")
                win=slotBet*15;
            else if(result[0]==="⭐")
                win=slotBet*10;
            else
                win=slotBet*7;

        }else if(
            result[0]===result[1] ||
            result[1]===result[2] ||
            result[0]===result[2]
        ){

            win=slotBet*2;

        }


        if(win>0){

            balance+=win;

            updateBalance();

            document.getElementById("slotBalance").textContent =
                Math.floor(balance);

            reels.forEach(r=>r.classList.add("win"));

            document.getElementById("slotMessage").innerHTML =
                `<span class="win-big">🎉 ВИГРАШ ${win} YMY!</span>`;

        }else{

            document.getElementById("slotMessage").textContent =
                "Цього разу без виграшу.";

        }

        button.disabled=false;
        slotSpinning=false;

    },2800);
}

/* =====================================================

const suits=[
    {symbol:"♠",red:false},
    {symbol:"♥",red:true},
    {symbol:"♦",red:true},
    {symbol:"♣",red:false}
];

const ranks=[
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];

let durakGame=null;


function createDeck(){

    const deck=[];

    suits.forEach(suit=>{

        ranks.forEach(rank=>{

            deck.push({
                suit:suit.symbol,
                red:suit.red,
                name:rank.name,
                value:rank.value
            });

        });

    });

    return deck;
}


function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=
            Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=
        [array[j],array[i]];

    }

    return array;
}

function startDurak(){

    const deck=
        shuffle(createDeck());

    durakGame={
        deck:deck,
        player:[],
        bot:[],
        table:[],
        trump:null,
        trumpSuit:null,
        playerTurn:true,
        attackingCard:null,
        finished:false
    };


    for(let i=0;i<6;i++){

        durakGame.player.push(deck.pop());
        durakGame.bot.push(deck.pop());

    }


    durakGame.trump=
        deck[deck.length-1];

    durakGame.trumpSuit=
        durakGame.trump.suit;

    renderDurak();

    setDurakStatus("Ваш хід — оберіть карту.");

}


function cardHTML(card){

    return `

        <div class="card ${card.red ? "red":""}">

            <div>
                ${card.name}
            </div>

            <div class="card-center">
                ${card.suit}
            </div>

            <div>
                ${card.name}
            </div>

        </div>
    `;
}


function playCardHTML(card){

    return `

        <div class="play-card ${card.red ? "red":""}">

            <div>${card.name}</div>

            <div style="
                text-align:center;
                font-size:25px;
                margin-top:10px;
            ">
                ${card.suit}
            </div>

        </div>
    `;
}


function renderDurak(){

    const trump=
        document.getElementById("trumpCard");

    trump.innerHTML=
        cardHTML(durakGame.trump);

    const bot=
        document.getElementById("botHand");

    bot.innerHTML="";

    durakGame.bot.forEach(()=>{

        bot.innerHTML +=
            `<div class="card back"></div>`;

    });


    const player=
        document.getElementById("playerHand");

    player.innerHTML="";


    durakGame.player.forEach((card,index)=>{

        const wrapper=
            document.createElement("div");

        wrapper.innerHTML=
            cardHTML(card);

        const element=
            wrapper.firstElementChild;

        element.classList.add("playable");

        element.onclick=
            ()=>playerAttack(index);

        player.appendChild(element);

    });


    const table=
        document.getElementById("attackRow");

    table.innerHTML="";

    durakGame.table.forEach(pair=>{

        table.innerHTML +=
            playCardHTML(pair.attack);

        if(pair.defense){

            table.innerHTML +=
                playCardHTML(pair.defense);

        }

    });


    document.getElementById("takeBtn").disabled =
        durakGame.playerTurn===false;

}


function setDurakStatus(text){

    const element=
        document.getElementById("durakStatus");

    if(element)
        element.textContent=text;
}


function playerAttack(index){

    if(!durakGame.playerTurn)
        return;

    if(durakGame.finished)
        return;

    const card=
        durakGame.player[index];

    if(durakGame.table.length>0){

        const allowed=
            durakGame.table.some(pair=>
                pair.attack.value===card.value ||
                (pair.defense &&
                 pair.defense.value===card.value)
            );

        if(!allowed){

            setDurakStatus(
                "Можна підкинути тільки карту такого самого номіналу."
            );

            return;
        }

    }

    durakGame.player.splice(index,1);

    durakGame.table.push({
        attack:card,
        defense:null
    });

    durakGame.playerTurn=false;

    renderDurak();

    setDurakStatus("Бот думає...");

    setTimeout(botDefend,900);
}


function canBeat(attack,defense){

    if(
        defense.suit===attack.suit &&
        defense.value>attack.value
    )
        return true;

    if(
        defense.suit===durakGame.trumpSuit &&
        attack.suit!==durakGame.trumpSuit
    )
        return true;

    return false;
}


function botDefend(){

    if(durakGame.finished)
        return;

    const pair=
        durakGame.table[
            durakGame.table.length-1
        ];

    if(!pair || pair.defense){

        durakGame.playerTurn=true;

        renderDurak();

        setDurakStatus(
            "Ваш хід."
        );

        return;
    }


    const candidates=
        durakGame.bot.filter(
            card=>canBeat(pair.attack,card)
        );


    if(candidates.length===0){

        durakTakeBot();

        return;
    }


    candidates.sort((a,b)=>{

        const at=
            a.suit===durakGame.trumpSuit;

        const bt=
            b.suit===durakGame.trumpSuit;

        if(at!==bt)
            return at-bt;

        return a.value-b.value;

    });


    const chosen=
        candidates[0];

    const index=
        durakGame.bot.indexOf(chosen);

    durakGame.bot.splice(index,1);

    pair.defense=chosen;

    renderDurak();

    setDurakStatus(
        "Бот відбився. Ваш хід."
    );

    setTimeout(()=>{

        durakGame.playerTurn=true;

        renderDurak();

    },500);

}


function durakTake(){

    if(!durakGame.table.length)
        return;

    const cards=[];

    durakGame.table.forEach(pair=>{

        cards.push(pair.attack);

        if(pair.defense)
            cards.push(pair.defense);

    });

    durakGame.player.push(...cards);

    durakGame.table=[];

    durakGame.playerTurn=false;

    renderDurak();

    setDurakStatus(
        "Ви взяли карти. Хід бота..."
    );

    setTimeout(()=>{

        botAttack();

    },800);

}


function durakTakeBot(){

    const cards=[];

    durakGame.table.forEach(pair=>{

        cards.push(pair.attack);

        if(pair.defense)
            cards.push(pair.defense);

    });

    durakGame.bot.push(...cards);

    durakGame.table=[];

    durakGame.playerTurn=true;

    renderDurak();

    setDurakStatus(
        "Бот взяв карти. Ваш хід."
    );

}


function durakPass(){

    if(
        !durakGame.table.length ||
        durakGame.table.some(pair=>!pair.defense)
    ){

        setDurakStatus(
            "Спочатку потрібно завершити відбій."
        );

        return;
    }

    durakGame.table=[];

    drawCards();

    if(checkDurakEnd())
        return;

    durakGame.playerTurn=true;

    renderDurak();

    setDurakStatus(
        "Раунд завершено. Ваш хід."
    );
}


function botAttack(){

    if(durakGame.finished)
        return;

    if(durakGame.bot.length===0){

        finishDurak("🎉 Бот закінчив карти. Ваш хід!");

        return;
    }

    const card=
        durakGame.bot[0];

    durakGame.bot.splice(0,1);

    durakGame.table.push({
        attack:card,
        defense:null
    });

    durakGame.playerTurn=true;

    renderDurak();

    setDurakStatus(
        "Бот походив. Виберіть карту для відбою."
    );
}


function drawCards(){

    while(
        durakGame.player.length<6 &&
        durakGame.deck.length>0
    ){
        durakGame.player.push(
            durakGame.deck.pop()
        );
    }

    while(
        durakGame.bot.length<6 &&
        durakGame.deck.length>0
    ){
        durakGame.bot.push(
            durakGame.deck.pop()
        );
    }
}


function checkDurakEnd(){

    if(
        durakGame.player.length===0 &&
        durakGame.deck.length===0
    ){

        finishDurak("🏆 Ви перемогли!");

        return true;
    }

    if(
        durakGame.bot.length===0 &&
        durakGame.deck.length===0
    ){

        finishDurak("🤖 Бот переміг.");

        return true;
    }

    return false;
}


function finishDurak(message){

    durakGame.finished=true;

    setDurakStatus(message);

    setTimeout(()=>{

        alert(message);

    },200);

}


/* =====================================================

===================================================== */

function closeGameScreen(id){

    const screen=
        document.getElementById(id);

    if(screen)
        screen.remove();

    if(aviatorTimer){
        clearInterval(aviatorTimer);
        aviatorTimer=null;
        aviatorRunning=false;
    }

}
