<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GORILA KING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    overflow:hidden;
    background:#050a05;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    user-select:none;
    -webkit-user-select:none;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   GAME
========================================================= */

.game{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            rgba(126,197,55,.25),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            #173b20 0%,
            #0c2514 42%,
            #071109 100%
        );
}

/* atmospheric glow */

.game::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle at 25% 35%,
            rgba(183,238,89,.12),
            transparent 12%),
        radial-gradient(circle at 78% 27%,
            rgba(255,207,79,.10),
            transparent 15%);
    animation:ambient 6s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes ambient{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

/* =========================================================
   JUNGLE
========================================================= */

.jungle-back{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.mountain{
    position:absolute;
    left:-15%;
    bottom:22%;
    width:130%;
    height:45%;
    background:
        linear-gradient(
            145deg,
            transparent 38%,
            #102b16 39%,
            #0b2011 70%,
            transparent 71%
        );
    opacity:.8;
}

.leaves{
    position:absolute;
    font-size:0;
}

.leaf{
    position:absolute;
    width:100px;
    height:45px;
    border-radius:100% 0 100% 0;
    background:
        linear-gradient(
            135deg,
            #4d8c2c,
            #153c18
        );
    transform-origin:bottom right;
    box-shadow:
        inset -8px -5px 12px rgba(0,0,0,.3);
}

.leaf::after{
    content:"";
    position:absolute;
    width:80%;
    height:2px;
    left:10%;
    top:50%;
    background:rgba(200,240,130,.25);
    transform:rotate(-20deg);
}

.l1{
    top:7%;
    left:-30px;
    transform:rotate(20deg);
}

.l2{
    top:16%;
    left:35px;
    transform:rotate(-18deg) scale(.7);
}

.l3{
    top:4%;
    right:-25px;
    transform:rotate(-30deg);
}

.l4{
    top:18%;
    right:45px;
    transform:rotate(22deg) scale(.7);
}

.l5{
    bottom:20%;
    left:-35px;
    transform:rotate(15deg) scale(.75);
}

.l6{
    bottom:14%;
    right:-30px;
    transform:rotate(-15deg);
}

/* vines */

.vine{
    position:absolute;
    width:170px;
    height:500px;
    border:8px solid #1e571f;
    border-left-color:transparent;
    border-bottom-color:transparent;
    border-radius:50%;
    opacity:.7;
}

.vine.left{
    left:-100px;
    top:-100px;
    transform:rotate(-18deg);
}

.vine.right{
    right:-100px;
    top:-100px;
    transform:rotate(18deg);
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    z-index:50;
    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 14px;

    background:
        linear-gradient(
            180deg,
            rgba(4,10,5,.92),
            rgba(4,10,5,.35),
            transparent
        );
}

.back{
    width:44px;
    height:44px;

    border-radius:13px;

    color:#fff;
    font-size:24px;

    background:
        linear-gradient(#243324,#111a12);

    border:1px solid rgba(220,190,89,.3);

    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 6px 20px rgba(0,0,0,.25);
}

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    text-align:center;
    white-space:nowrap;
}

.logo-main{
    font-size:20px;
    font-weight:1000;
    letter-spacing:2px;

    color:#ffe277;

    text-shadow:
        0 2px 0 #593d0d,
        0 0 18px rgba(255,214,89,.4);
}

.logo-sub{
    margin-top:1px;
    font-size:8px;
    letter-spacing:3px;
    color:#8ca876;
}

.balance{
    min-width:82px;
    padding:8px 11px;

    text-align:center;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #2b2819,
            #11140e
        );

    border:1px solid #806523;

    box-shadow:
        0 4px 15px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.08);
}

.balance-label{
    display:block;
    color:#8c927e;
    font-size:8px;
    letter-spacing:1px;
}

.balance-value{
    color:#ffe477;
    font-size:15px;
    font-weight:1000;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    position:absolute;
    inset:65px 0 0;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:auto;

    padding:
        5px
        12px
        25px;

    scrollbar-width:none;
}

.main::-webkit-scrollbar{
    display:none;
}

/* =========================================================
   TITLE
========================================================= */

.game-title{
    position:relative;
    z-index:5;

    margin-top:3px;

    text-align:center;
}

.game-title h1{
    font-size:clamp(27px,7vw,42px);
    line-height:1;

    font-weight:1000;
    letter-spacing:2px;

    color:#ffe37a;

    text-shadow:
        0 3px 0 #563c0e,
        0 0 25px rgba(255,212,80,.3);
}

.game-title p{
    margin-top:5px;

    font-size:9px;
    letter-spacing:4px;

    color:#8ba275;
}

/* =========================================================
   GORILLA SVG
========================================================= */

.gorilla-wrap{
    position:relative;
    z-index:4;

    width:min(310px,78vw);
    height:min(235px,35vh);

    display:flex;
    align-items:flex-end;
    justify-content:center;

    margin-top:-4px;
}

.gorilla-glow{
    position:absolute;
    bottom:12px;

    width:220px;
    height:60px;

    border-radius:50%;

    background:rgba(112,197,52,.25);

    filter:blur(22px);
}

.gorilla{
    position:relative;

    width:210px;
    height:220px;

    filter:
        drop-shadow(0 20px 15px rgba(0,0,0,.5));

    animation:
        gorillaIdle 3s ease-in-out infinite;
}

@keyframes gorillaIdle{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}

.gorilla.roar{
    animation:
        roar .45s ease;
}

@keyframes roar{
    0%{transform:scale(1)}
    35%{transform:scale(1.13) rotate(-2deg)}
    65%{transform:scale(1.1) rotate(2deg)}
    100%{transform:scale(1)}
}

/* SVG itself */

.gorilla svg{
    width:100%;
    height:100%;
    overflow:visible;
}

/* =========================================================
   MACHINE
========================================================= */

.machine{
    position:relative;
    z-index:10;

    width:min(540px,96vw);

    padding:8px;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #9b7427,
            #392708 15%,
            #d0a944 48%,
            #4b340b 82%,
            #b18731
        );

    box-shadow:
        0 18px 50px rgba(0,0,0,.65),
        0 0 25px rgba(255,210,70,.15),
        inset 0 2px rgba(255,255,255,.45),
        inset 0 -4px rgba(0,0,0,.4);
}

.machine-inner{
    padding:9px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #15190f,
            #050705
        );

    border:2px solid #211a0a;

    box-shadow:
        inset 0 0 30px #000;
}

/* machine top decoration */

.machine-top{
    height:31px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:8px;

    border-radius:10px;

    background:
        linear-gradient(
            #55400e,
            #171207
        );

    border:1px solid #806323;

    color:#ffe27b;

    font-size:10px;
    font-weight:1000;
    letter-spacing:3px;

    text-shadow:
        0 0 10px rgba(255,220,100,.5);
}

/* reels */

.reels{
    position:relative;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    gap:5px;

    padding:6px;

    border-radius:14px;

    background:
        #020302;

    border:2px solid #392a0d;

    box-shadow:
        inset 0 0 25px #000;
}

.reels::before,
.reels::after{
    content:"";

    position:absolute;

    left:3px;
    right:3px;

    height:3px;

    z-index:20;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ffe07a,
            transparent
        );

    box-shadow:
        0 0 12px rgba(255,216,91,.7);
}

.reels::before{
    top:34%;
}

.reels::after{
    bottom:34%;
}

.reel{
    position:relative;

    height:92px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #656a62,
            #f0f0e8 17%,
            #8f938b 50%,
            #f7f7ed 82%,
            #656a62
        );

    border:1px solid #aeb2a7;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.45);
}

.symbol{
    position:absolute;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(28px,8vw,45px);
    font-weight:1000;

    color:#241b0b;

    text-shadow:
        0 2px #fff,
        0 -1px rgba(255,255,255,.7);
}

.symbol.gold{
    color:#a06c0c;

    text-shadow:
        0 2px #ffe58a,
        0 4px 0 #6b4509,
        0 0 10px rgba(255,200,70,.35);
}

.reel.spinning .symbol{
    animation:
        reelSpin .09s linear infinite;
}

@keyframes reelSpin{
    0%{transform:translateY(-35px)}
    100%{transform:translateY(35px)}
}

/* payline */

.payline{
    position:absolute;

    left:0;
    right:0;
    top:50%;

    height:2px;

    z-index:30;

    background:#ffe477;

    box-shadow:
        0 0 10px #ffe477;
}

/* win */

.reel.win{
    box-shadow:
        inset 0 0 15px rgba(255,210,70,.25),
        0 0 0 2px #ffe477,
        0 0 25px rgba(255,220,90,.7);

    animation:
        reelWin .35s infinite alternate;
}

@keyframes reelWin{
    from{transform:scale(1)}
    to{transform:scale(1.035)}
}

/* =========================================================
   CONTROL PANEL
========================================================= */

.control-panel{
    display:grid;

    grid-template-columns:1fr 1.45fr 1fr;

    gap:7px;

    margin-top:8px;
}

.control{
    min-height:43px;

    border-radius:10px;

    border:1px solid #55441b;

    background:
        linear-gradient(
            #242216,
            #0d100c
        );

    color:#aeb197;

    font-size:9px;
    font-weight:900;

    letter-spacing:.5px;
}

.control strong{
    display:block;
    margin-top:2px;

    color:#ffe177;
    font-size:13px;
}

.spin{
    min-height:52px;

    border-radius:13px;

    color:#171006;

    font-size:15px;
    font-weight:1000;
    letter-spacing:1px;

    background:
        linear-gradient(
            180deg,
            #fff2a5 0%,
            #ffd65b 25%,
            #c48a18 55%,
            #ffe27c 100%
        );

    border:2px solid #f4cf67;

    box-shadow:
        0 5px 0 #68470a,
        0 8px 22px rgba(255,200,50,.2),
        inset 0 2px rgba(255,255,255,.8);

    transition:.12s;
}

.spin:active{
    transform:translateY(4px);

    box-shadow:
        0 1px 0 #68470a,
        0 4px 15px rgba(255,200,50,.15);
}

.spin.disabled{
    filter:grayscale(.7);
    opacity:.55;
}

/* =========================================================
   RESULT
========================================================= */

.result{
    min-height:30px;

    margin-top:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aab79c;

    font-size:10px;
    font-weight:900;
    letter-spacing:1px;

    text-align:center;
}

.result.win{
    color:#ffe278;

    text-shadow:
        0 0 15px rgba(255,215,85,.8);

    animation:
        resultPulse .5s infinite alternate;
}

@keyframes resultPulse{
    from{transform:scale(1)}
    to{transform:scale(1.07)}
}

/* =========================================================
   JACKPOT
========================================================= */

.jackpot{
    position:fixed;

    z-index:500;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        scale(.3);

    opacity:0;

    pointer-events:none;

    text-align:center;

    transition:.35s;
}

.jackpot.show{
    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;
}

.jackpot-small{
    color:#a9bd8e;

    font-size:12px;
    font-weight:1000;
    letter-spacing:5px;
}

.jackpot-main{
    margin-top:3px;

    color:#ffe26f;

    font-size:clamp(42px,14vw,78px);
    font-weight:1000;

    text-shadow:
        0 4px 0 #63430a,
        0 0 20px #ffd957,
        0 0 60px rgba(255,200,40,.6);
}

.jackpot-prize{
    margin-top:5px;

    color:white;

    font-size:20px;
    font-weight:1000;
}

/* =========================================================
   PARTICLES
========================================================= */

.particle{
    position:fixed;

    z-index:450;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffe27a;

    box-shadow:
        0 0 10px #ffe27a;

    pointer-events:none;

    animation:
        particleFly 1.1s ease-out forwards;
}

@keyframes particleFly{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(720deg);

        opacity:0;
    }
}

/* =========================================================
   FOOTER INFO
========================================================= */

.info{
    position:relative;
    z-index:10;

    display:flex;
    justify-content:center;
    gap:18px;

    margin-top:8px;

    color:#65715c;

    font-size:8px;
    letter-spacing:1px;
}

.dot{
    display:inline-block;

    width:5px;
    height:5px;

    margin-right:4px;

    border-radius:50%;

    background:#5fc73d;

    box-shadow:0 0 8px #5fc73d;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .main{
        padding-top:10px;
    }

    .gorilla-wrap{
        height:250px;
        margin-top:-5px;
    }

    .reel{
        height:110px;
    }

    .machine{
        margin-top:-3px;
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-height:700px){

    .topbar{
        height:58px;
    }

    .main{
        inset:55px 0 0;
    }

    .game-title h1{
        font-size:25px;
    }

    .game-title p{
        font-size:8px;
    }

    .gorilla-wrap{
        height:175px;
        margin-top:-8px;
    }

    .gorilla{
        width:165px;
        height:175px;
    }

    .reel{
        height:72px;
    }

    .machine-top{
        height:25px;
    }

    .control-panel{
        margin-top:5px;
    }

    .result{
        min-height:23px;
    }

    .info{
        display:none;
    }
}
</style>
</head>

<body>

    <!-- JUNGLE BACKGROUND -->

        <div class="mountain"></div>

        <div class="vine left"></div>
        <div class="vine right"></div>

        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>
        <div class="leaf l5"></div>

    <header class="topbar">

            ‹

            <div class="logo-sub">

        </div>

        <div class="balance">

            <span class="balance-label">

                            <stop

                            <stop

                                stop-color="#8d5a0e"/>

                        </filter>

                    <!-- left arm -->

                    <path

                    <!-- right arm -->

                    <path

                        C195 232 178 227 174 210

                    <!-- eyes -->

                    <ellipse

                    <ellipse

                    <circle

                        r="2"

                    <circle
                        cx="141"

                    <!-- muzzle -->

                    <ellipse
                        cx="120"
                        cy="91"
                        rx="30"
                        ry="23"
                        fill="#704d36"/>


                    <!-- nose -->

                    <path
                        d="
                        M104 84
                        Q120 74 136 84
                        Q133 98 120 99
                        Q107 98 104 84
                        Z"
                        fill="#21150f"/>

                    <ellipse
                        cx="112"
                        cy="86"

                    <ellipse

                        rx="4"

                        fill="#a67d5b"/>


                    <!-- mouth -->

                    <path
                        d="
                        M99 99
                        Q120 112 141 99
                        Q136 120 120 121
                        Q104 120 99 99
                        Z"
                        fill="#180d0a"/>


                    <!-- teeth -->

                    <path

                    <!-- crown -->

                    <path

                        Z"

                    <circle

                </svg>

            </div>

        </div>


        <!-- SLOT MACHINE -->

        <section class="machine">

            <div class="machine-inner">

                <div class="machine-top">
                    ★ KING'S REELS ★
                </div>

                <div
                    class="reels"
                    id="reels">

                    <div class="payline"></div>

                    <div
                        class="reel"
                        id="r0">
                        <div class="symbol gold">
                            K
                        </div>
                    </div>

                    <div
                        class="reel"
                        id="r1">
                        <div class="symbol gold">
                            K
                        </div>
                    </div>

                    <div
                        class="reel"
                        id="r2">
                        <div class="symbol gold">
                            K
                        </div>
                    </div>

                    <div
                        class="reel"
                        id="r3">
                        <div class="symbol">
                            A
                        </div>
                    </div>

                    <div
                        class="reel"
                        id="r4">
                        <div class="symbol">
                            A
                        </div>
                    </div>

                </div>


                <div
                    class="result"
                    id="result">
                    SPIN THE KING'S REELS
                </div>


                <div class="control-panel">

                    <button
                        class="control"
                        onclick="changeBet(-5)">
                        BET -
                        <strong id="bet">
                            $10
                        </strong>
                    </button>


                    <button
                        class="spin"
                        id="spinButton"
                        onclick="spin()">
                        SPIN
                    </button>


                    <button
                        class="control"
                        onclick="changeBet(5)">
                        BET +
                        <strong>
                            MAX $50
                        </strong>
                    </button>

                </div>

            </div>

        </section>


        <div class="info">

            <span>
                <i class="dot"></i>
                DEMO MODE
            </span>

            <span>
                5 REELS
            </span>

            <span>
                3 LINES
            </span>

        </div>

    </main>


    <!-- JACKPOT -->

    <div
        class="jackpot"
        id="jackpot">

        <div class="jackpot-small">
            GORILA KING
        </div>

        <div class="jackpot-main">
            WIN!
        </div>

        <div
            class="jackpot-prize"
            id="jackpotPrize">
            +$100
        </div>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let balance = 100;
let bet = 10;
let spinning = false;

const symbols = [
    {
        id:"banana",
        label:"B",
        value:2
    },
    {
        id:"orange",
        label:"O",
        value:3
    },
    {
        id:"ruby",
        label:"R",
        value:5
    },
    {
        id:"diamond",
        label:"D",
        value:8
    },
    {
        id:"crown",
        label:"K",
        value:15
    }
];


/* =========================================================
   ELEMENTS
========================================================= */

const balanceEl =
    document.getElementById("balance");

const betEl =
    document.getElementById("bet");

const resultEl =
    document.getElementById("result");

const spinButton =
    document.getElementById("spinButton");

const gorilla =
    document.getElementById("gorilla");

const jackpot =
    document.getElementById("jackpot");

const jackpotPrize =
    document.getElementById("jackpotPrize");


/* =========================================================
   BALANCE
========================================================= */

function updateBalance(){

    balanceEl.textContent =
        "$"+Math.floor(balance);

    betEl.textContent =
        "$"+bet;

}


/* =========================================================
   BET
========================================================= */

function changeBet(amount){

    if(spinning) return;

    bet += amount;

    if(bet < 5){
        bet = 5;
    }

    if(bet > 50){
        bet = 50;
    }

    updateBalance();

}


/* =========================================================
   RANDOM SYMBOL
========================================================= */

function randomSymbol(){

    return symbols[
        Math.floor(
            Math.random()*symbols.length
        )
    ];

}


/* =========================================================
   SET REEL
========================================================= */

function setReel(
    index,
    symbol
){

    const reel =
        document.getElementById(
            "r"+index
        );

    const old =
        reel.querySelector(".symbol");

    if(old){
        old.remove();
    }

    const div =
        document.createElement("div");

    div.className =
        "symbol";

    if(
        symbol.id === "crown" ||
        symbol.id === "diamond"
    ){
        div.classList.add("gold");
    }

    div.textContent =
        symbol.label;

    reel.appendChild(div);

}


/* =========================================================
   SPIN
========================================================= */

function spin(){

    if(spinning) return;

    if(balance < bet){

        resultEl.textContent =
            "NOT ENOUGH BALANCE";

        return;

    }

    spinning = true;

    balance -= bet;

    updateBalance();

    spinButton.classList.add("disabled");

    resultEl.classList.remove("win");

    resultEl.textContent =
        "THE KING IS SPINNING...";

    gorilla.classList.remove("roar");

    void gorilla.offsetWidth;

    gorilla.classList.add("roar");


    const reels =
        document.querySelectorAll(".reel");

    reels.forEach(function(reel){

        reel.classList.remove("win");

        reel.classList.add("spinning");

    });


    /*
       Each reel stops separately.
    */

    const final = [];

    for(let i=0;i<5;i++){

        final.push(
            randomSymbol()
        );

    }


    for(let i=0;i<5;i++){

        setTimeout(
            function(){

                const reel =
                    document.getElementById(
                        "r"+i
                    );

                reel.classList.remove(
                    "spinning"
                );

                setReel(
                    i,
                    final[i]
                );

            },
            900 + i*300
        );

    }


    setTimeout(
        function(){

            finishSpin(final);

        },
        2450
    );

}


/* =========================================================
   FINISH
========================================================= */

function finishSpin(final){

    let win = 0;

    /*
       5 equal
    */

    if(
        final.every(
            s =>
                s.id === final[0].id
        )
    ){

        win =
            bet *
            final[0].value *
            5;

    }

    /*
       4 equal
    */

    else if(
        final
            .slice(0,4)
            .every(
                s =>
                    s.id === final[0].id
            )
    ){

        win =
            bet *
            final[0].value *
            3;

    }

    /*
       3 equal
    */

    else if(
        final
            .slice(0,3)
            .every(
                s =>
                    s.id === final[0].id
            )
    ){

        win =
            bet *
            final[0].value;

    }


    if(win > 0){

        balance += win;

        resultEl.textContent =
            "KING WIN  +$"+win;

        resultEl.classList.add("win");

        /*
          highlight matching reels
        */

        const first =
            final[0].id;

        for(
            let i=0;
            i<final.length;
            i++
        ){

            if(
                final[i].id === first
            ){

                document
                    .getElementById(
                        "r"+i
                    )
                    .classList.add(
                        "win"
                    );

            }

        }

        showWin(win);

    }else{

        resultEl.textContent =
            "NO WIN — TRY AGAIN";

    }


    updateBalance();

    spinning = false;

    spinButton.classList.remove(
        "disabled"
    );

}


/* =========================================================
   WIN EFFECT
========================================================= */

function showWin(amount){

    jackpotPrize.textContent =
        "+$"+amount;

    jackpot.classList.add("show");

    createParticles();

    setTimeout(
        function(){

            jackpot.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(){

    for(
        let i=0;
        i<45;
        i++
    ){

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "particle";

        p.style.left =
            (35+Math.random()*30)+"%";

        p.style.top =
            (30+Math.random()*20)+"%";

        p.style.setProperty(
            "--x",
            ((Math.random()-.5)*260)+"px"
        );

        p.style.setProperty(
            "--y",
            (120+Math.random()*400)+"px"
        );

        p.style.animationDelay =
            (Math.random()*.25)+"s";

        document.body.appendChild(p);

        setTimeout(
            function(){
                p.remove();
            },
            1400
        );

    }

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    /*
      Здесь позже можно подключить
      возврат в главное меню YesMoneY.
    */

    if(spinning) return;

    alert(
        "Здесь будет возврат в главное меню YesMoneY"
    );

}


/* =========================================================
   START
========================================================= */

updateBalance();

</script>

</body>
</html>
