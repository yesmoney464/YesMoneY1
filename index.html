let bet=5;
let spinning=false;


function changeBet(value){

bet+=value;

if(bet<5)
bet=5;

if(bet>Math.max(5,Math.floor(balance)))
bet=Math.max(5,Math.floor(balance));

const el =
document.getElementById("betValue");

if(el)
el.textContent=bet;

}


function spinSlots(){

if(spinning)
return;

if(balance<bet){

alert("Недостатньо YMY.");

return;

}

spinning=true;

balance-=bet;
updateBalance();


const reels=[
document.getElementById("reel1"),
document.getElementById("reel2"),
document.getElementById("reel3")
];

const symbols=[
"🍒","💎","7️⃣","⭐","🍋","🔔","🍀"
];

reels.forEach(r=>{
r.classList.add("spinning");
});


const spinButton =
document.getElementById("spinGame");

spinButton.disabled=true;
spinButton.textContent="ОБЕРТАННЯ...";


setTimeout(()=>{

const result=[
symbols[Math.floor(Math.random()*symbols.length)],
symbols[Math.floor(Math.random()*symbols.length)],
symbols[Math.floor(Math.random()*symbols.length)]
];


reels.forEach((r,i)=>{

r.classList.remove("spinning");
r.textContent=result[i];

});


let win=0;


if(
result[0]===result[1] &&
result[1]===result[2]
){

win=bet*10;

reels.forEach(r=>{
r.classList.add("win");
});

}
else if(
result[0]===result[1] ||
result[1]===result[2] ||
result[0]===result[2]
){

win=bet*2;

}


balance+=win;
updateBalance();


const resultBox =
document.getElementById("gameResult");


if(win>0){

resultBox.textContent=
"🎉 ВИГРАШ +" +
win +
" YMY!";

}
else{

resultBox.textContent=
"😔 Цього разу без виграшу";

}


spinButton.disabled=false;
spinButton.textContent="КРУТИТИ";

spinning=false;

},1800);

}

balance+=amount;

updateBalance();

alert(
"🎁 Бонус отримано!\n\n+"+
amount+
" YMY"
);

}
