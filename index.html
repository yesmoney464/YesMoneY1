<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>YesMoneY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070914;
    --panel:#11162a;
    --panel2:#171d35;
    --purple:#765cff;
    --purple2:#ad65ff;
    --text:#fff;
    --muted:rgba(255,255,255,.5);
    --line:rgba(255,255,255,.09);
}

html,body{
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 50% -10%,#303968 0%,#11152a 35%,#070914 75%);
    overflow-x:hidden;
}

button{
    font:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   WELCOME
========================= */

#welcomeScreen{
    min-height:100vh;
    padding:30px 20px 35px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 0 30px rgba(137,110,255,.35);
}

.logo span{
    opacity:.5;
}

.auth{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.auth button{
    padding:13px 20px;
    border-radius:14px;
    color:white;
    border:1px solid var(--line);
    background:rgba(255,255,255,.07);
}

.auth .primary{
    border:none;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.welcome-center{
    max-width:500px;
    margin:auto;
}

.welcome-icon{
    font-size:72px;
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-10px)}
}

.welcome-center h1{
    font-size:29px;
    margin-bottom:12px;
}

.welcome-center p{
    color:var(--muted);
    line-height:1.6;
}

.welcome-bottom{
    color:rgba(255,255,255,.3);
    font-size:13px;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    padding-bottom:85px;
}

.topbar{
    height:70px;
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.05);
    background:rgba(7,9,20,.45);
    backdrop-filter:blur(15px);
}

.top-logo{
    font-size:24px;
    font-weight:900;
}

.balance{
    padding:9px 13px;
    border-radius:13px;
    background:rgba(255,255,255,.08);
    border:1px solid var(--line);
    font-weight:900;
}

.balance small{
    color:var(--muted);
    font-weight:500;
}

.content{
    max-width:720px;
    margin:auto;
    padding:18px 15px 25px;
}

.page-title{
    font-size:29px;
    margin:8px 0;
}

.page-subtitle{
    color:var(--muted);
    margin-bottom:20px;
}

/* =========================
   GAME CARDS
========================= */

.games-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.game-card{
    min-height:160px;
    padding:17px;
    border-radius:21px;
    border:1px solid var(--line);
    background:
        linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.game-card:active{
    transform:scale(.96);
}

.game-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-45px;
    top:-45px;
    border-radius:50%;
    background:rgba(125,94,255,.18);
    filter:blur(10px);
}

.game-icon{
    font-size:44px;
    margin-bottom:20px;
}

.game-card h3{
    font-size:16px;
    margin-bottom:6px;
}

.game-card p{
    color:var(--muted);
    font-size:12px;
}

.game-status{
    display:inline-block;
    margin-top:12px;
    padding:5px 8px;
    border-radius:8px;
    background:rgba(118,92,255,.15);
    color:#bcaeff;
    font-size:10px;
    font-weight:700;
}

/* =========================
   NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(8,10,22,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
}

.nav-btn{
    border:none;
    background:none;
    color:rgba(255,255,255,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition:.2s;
}

.nav-icon{
    font-size:23px;
}

.nav-btn span:last-child{
    font-size:11px;
}

.nav-btn.active{
    color:white;
    transform:translateY(-2px);
}

/* =========================
   SUPPORT
========================= */

.support-btn{
    position:fixed;
    z-index:55;
    left:13px;
    bottom:88px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    color:white;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow:auto;
    padding:24px;
    border-radius:24px;
    background:#151a2d;
    border:1px solid var(--line);
    position:relative;
}

.close{
    position:absolute;
    right:14px;
    top:12px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:22px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    color:var(--muted);
    font-size:13px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:13px;
    outline:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.06);
    color:white;
}

.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    color:white;
    font-weight:900;
}

/* =========================
   SLOTS GAME
========================= */

.game-screen{
    animation:gameIn .35s ease;
}

@keyframes gameIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.game-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.back-btn{
    border:1px solid var(--line);
    background:rgba(255,255,255,.07);
    color:white;
    border-radius:12px;
    padding:9px 13px;
}

.game-name{
    font-size:20px;
    font-weight:900;
}

.game-balance{
    padding:9px 12px;
    border-radius:12px;
    background:rgba(118,92,255,.12);
    color:#c8beff;
    font-weight:800;
}

.slots-frame{
    padding:10px;
    border-radius:28px;
    background:
        linear-gradient(145deg,#262d52,#101426);
    border:2px solid rgba(166,135,255,.35);
    box-shadow:
        0 0 35px rgba(118,92,255,.16),
        inset 0 0 30px rgba(0,0,0,.35);
}

.slots-top{
    text-align:center;
    padding:10px 0 15px;
}

.slots-brand{
    font-size:26px;
    font-weight:1000;
    letter-spacing:3px;
    color:#d8d1ff;
    text-shadow:0 0 18px rgba(145,120,255,.8);
}

.slots-sub{
    color:rgba(255,255,255,.4);
    font-size:11px;
    margin-top:4px;
}

.reels-window{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:9px;
    border-radius:19px;
    background:#070914;
    border:2px solid rgba(255,255,255,.1);
    overflow:hidden;
}

.reels-window::before,
.reels-window::after{
    content:"";
    position:absolute;
    left:5px;
    right:5px;
    height:45px;
    z-index:3;
    pointer-events:none;
}

.reels-window::before{
    top:0;
    background:linear-gradient(to bottom,rgba(7,9,20,.85),transparent);
}

.reels-window::after{
    bottom:0;
    background:linear-gradient(to top,rgba(7,9,20,.85),transparent);
}

.reel{
    height:145px;
    border-radius:14px;
    background:
        linear-gradient(180deg,#1b2037,#0d1020);
    border:1px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    position:relative;
    overflow:hidden;
}

.reel::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.08),
        rgba(255,255,255,.02)
    );
    pointer-events:none;
}

.reel.spinning{
    animation:reelShake .09s linear infinite;
    filter:blur(1px);
}

@keyframes reelShake{
    0%{transform:translateY(-3px)}
    50%{transform:translateY(3px)}
    100%{transform:translateY(-3px)}
}

.reel.win{
    border-color:#a891ff;
    box-shadow:
        0 0 18px rgba(135,105,255,.8),
        inset 0 0 20px rgba(135,105,255,.2);
    animation:winPulse .5s ease-in-out infinite alternate;
}

@keyframes winPulse{
    from{transform:scale(1)}
    to{transform:scale(1.035)}
}

.payline{
    position:absolute;
    z-index:4;
    left:8px;
    right:8px;
    top:50%;
    height:3px;
    transform:translateY(-50%);
    background:#bba9ff;
    box-shadow:0 0 10px #8f70ff;
    opacity:.8;
    pointer-events:none;
}

.machine-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.machine-info div{
    padding:11px;
    border-radius:12px;
    text-align:center;
    background:rgba(255,255,255,.06);
}

.machine-info span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:4px;
}

.machine-info strong{
    font-size:15px;
}

.bet-area{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.bet-label{
    color:var(--muted);
    font-size:12px;
}

.bet-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.bet-controls button{
    width:34px;
    height:34px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:20px;
}

.bet-value{
    min-width:58px;
    text-align:center;
    font-weight:900;
}

.spin-main{
    width:100%;
    margin-top:14px;
    padding:17px;
    border:none;
    border-radius:16px;
    color:white;
    font-size:18px;
    font-weight:1000;
    letter-spacing:1px;
    background:linear-gradient(135deg,#7057ff,#b061ff);
    box-shadow:0 8px 25px rgba(112,87,255,.25);
}

.spin-main:disabled{
    opacity:.45;
}

.game-result{
    min-height:28px;
    text-align:center;
    margin-top:12px;
    font-weight:900;
}

.win-text{
    color:#c9bbff;
    text-shadow:0 0 15px rgba(143,112,255,.7);
}

.lose-text{
    color:rgba(255,255,255,.5);
}

.paytable{
    margin-top:15px;
    padding:15px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
}

.paytable h3{
    font-size:14px;
    margin-bottom:10px;
}

.pay-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    color:var(--muted);
    font-size:12px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.pay-row:last-child{
    border-bottom:0;
}

.pay-row strong{
    color:white;
}

/* =========================
   BONUS / PROFILE
========================= */

.card{
    padding:19px;
    border-radius:20px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.065);
    margin-bottom:12px;
}

.card p{
    color:var(--muted);
    line-height:1.5;
    font-size:14px;
    margin-top:8px;
}

.card-action{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    font-weight:800;
}

.profile-avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    font-size:28px;
    font-weight:900;
    margin-bottom:13px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.info-row:last-child{
    border-bottom:0;
}

.info-row span:first-child{
    color:var(--muted);
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
    .games-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<section id="welcomeScreen">

    <div>
        <div class="logo">Yes<span>MoneY</span></div>

        <div class="auth">
            <button id="loginButton">Увійти</button>
            <button class="primary" id="registerButton">Реєстрація</button>
        </div>
    </div>

    <div class="welcome-center">
        <div class="welcome-icon">✨</div>
        <h1>Вітаємо на YesMoneY</h1>
        <p>
            Нова ігрова платформа з власними
            іграми, бонусами та внутрішньою валютою YMY.
        </p>
    </div>

    <div class="welcome-bottom">
        YesMoneY • Нова платформа
    </div>

</section>


<section id="app" class="hidden">

    <header class="topbar">
        <div class="top-logo">YesMoneY</div>

        <div class="balance">
            💰 <span id="balanceValue">50</span>
            <small>YMY</small>
        </div>
    </header>

    <main class="content" id="mainContent"></main>

    <button class="support-btn" id="supportButton">🆘</button>

    <nav class="bottom-nav">

        <button class="nav-btn active" data-page="games">
            <span class="nav-icon">🎮</span>
            <span>Грати</span>
        </button>

        <button class="nav-btn" data-page="bonus">
            <span class="nav-icon">🎁</span>
            <span>Бонус</span>
        </button>

        <button class="nav-btn" id="wheelButton">
            <span class="nav-icon">🎰</span>
            <span>Барабан</span>
        </button>

        <button class="nav-btn" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>Профіль</span>
        </button>

    </nav>

</section>


<!-- LOGIN -->

<div class="modal" id="loginModal">
    <div class="modal-box">

        <button class="close" data-close="loginModal">×</button>

        <h2>Вхід</h2>
        <p style="color:var(--muted);margin:8px 0 20px">
            Ласкаво просимо назад
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input id="loginEmail" type="email" required placeholder="Ваш email">
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input id="loginPassword" type="password" required placeholder="Ваш пароль">
            </div>

            <button class="submit-btn">УВІЙТИ</button>

        </form>

    </div>
</div>


<!-- REGISTER -->

<div class="modal" id="registerModal">
    <div class="modal-box">

        <button class="close" data-close="registerModal">×</button>

        <h2>Реєстрація</h2>
        <p style="color:var(--muted);margin:8px 0 20px">
            Створіть акаунт YesMoneY
        </p>

        <form id="registerForm">

            <div class="input-group">
                <label>Ім'я</label>
                <input id="registerName" required minlength="3" placeholder="Ваше ім'я">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input id="registerEmail" type="email" required placeholder="Ваш email">
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input id="registerPassword" type="password" minlength="6" required placeholder="Мінімум 6 символів">
            </div>

            <div class="input-group">
                <label>Повторіть пароль</label>
                <input id="registerPassword2" type="password" minlength="6" required placeholder="Повторіть пароль">
            </div>

            <button class="submit-btn">СТВОРИТИ АКАУНТ</button>

        </form>

    </div>
</div>


<!-- WHEEL -->

<div class="modal" id="wheelModal">
    <div class="modal-box" style="text-align:center">

        <button class="close" data-close="wheelModal">×</button>

        <h2>🎰 Барабан</h2>

        <p style="color:var(--muted);margin:8px 0 20px">
            Внутрішній бонусний барабан
        </p>

        <div style="
            width:230px;
            height:230px;
            border-radius:50%;
            margin:20px auto;
            background:conic-gradient(
                #765cff 0 45deg,
                #242945 45deg 90deg,
                #a76cff 90deg 135deg,
                #242945 135deg 180deg,
                #765cff 180deg 225deg,
                #242945 225deg 270deg,
                #a76cff 270deg 315deg,
                #242945 315deg
            );
            border:8px solid rgba(255,255,255,.13);
            display:flex;
            align-items:center;
            justify-content:center;
            transition:transform 4s cubic-bezier(.12,.7,.18,1);
        " id="wheel">

            <div style="
                width:70px;
                height:70px;
                border-radius:50%;
                background:#151a2d;
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:900;
            ">
                YMY
            </div>

        </div>

        <button class="submit-btn" id="spinButton">
            КРУТИТИ
        </button>

        <p id="wheelResult" style="margin-top:15px;color:var(--muted)"></p>

    </div>
</div>


<script>

/* =====================================================
   ОСНОВНЫЕ ДАННЫЕ
===================================================== */

const welcomeScreen = document.getElementById("welcomeScreen");
const app = document.getElementById("app");
const mainContent = document.getElementById("mainContent");
const balanceValue = document.getElementById("balanceValue");

let balance = Number(localStorage.getItem("ymyBalance")) || 50;
let userName = localStorage.getItem("ymyName");
let userId = localStorage.getItem("ymyId");

function saveData(){

    localStorage.setItem("ymyBalance", balance);

    if(userName){
        localStorage.setItem("ymyName", userName);
    }

    if(userId){
        localStorage.setItem("ymyId", userId);
    }

}

function updateBalance(){

    balanceValue.textContent = Math.floor(balance);

    const gameBalance =
        document.getElementById("gameBalance");

    if(gameBalance){
        gameBalance.textContent =
            Math.floor(balance) + " YMY";
    }

    localStorage.setItem(
        "ymyBalance",
        balance
    );

}


/* =====================================================
   ИГРЫ
===================================================== */

const games = [

    {
        icon:"🎰",
        name:"Neon Slots",
        description:"Класичні 3 барабани",
        ready:true
    },

    {
        icon:"💎",

        description:"Алмазна гра",
        ready:false
    },

    {

        ready:false
    },

    {
        icon:"🍀",

        description:"Випробуйте удачу",
        ready:false
    },

    {
        icon:"👑",
        name:"Royal Game",
        description:"Королівська гра",
        ready:false
    },

    {
        icon:"🚀",
        name:"Rocket",
        description:"Піднімайтесь вище",
        ready:false
    },

    {
        icon:"🎯",
        name:"Lucky Target",
        description:"Влуч у ціль",
        ready:false
    },

    {
        icon:"⚡",

    },

    {

    {

        description:"Нічний режим",
        ready:false
    }

];


function gamesPage(){

    mainContent.innerHTML = `

        <div class="page">

            <h1 class="page-title">
                🎮 Грати

function changeBet(amount){

    if(spinning) return;

    bet += amount;

    if(bet < 5){
        bet = 5;
    }

    if(bet > 100){
        bet = 100;
    }

    document.getElementById("betValue").textContent =
        bet + " YMY";

    document.getElementById("machineBet").textContent =
        bet + " YMY";

}


function randomSymbol(){

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];

}


function spinSlots(){

    if(spinning) return;

    if(balance < bet){

        showResult(
            "Недостатньо YMY для цієї ставки.",
            false
        );

        return;

    }

    spinning = true;

    balance -= bet;

    updateBalance();

    const button =
        document.getElementById("spinMain");

    button.disabled = true;

    button.textContent =
        "⏳ ОБЕРТАЄТЬСЯ...";


    const reels = [
        document.getElementById("reel0"),
        document.getElementById("reel1"),
        document.getElementById("reel2")
    ];


    reels.forEach(reel=>{

        reel.classList.remove("win");
        reel.classList.add("spinning");

    });


    let ticks = 0;

    const animation =
        setInterval(()=>{

            reels.forEach(reel=>{
                reel.textContent =
                    randomSymbol();
            });

            ticks++;

            if(ticks >= 25){

                clearInterval(animation);

                finishSpin(reels);

            }

        },90);

}


function finishSpin(reels){

    const result = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];


    reels.forEach((reel,index)=>{

        reel.classList.remove("spinning");

        reel.textContent =
            result[index];

    });


    let multiplier = 0;


    if(
        result[0] === result[1] &&
        result[1] === result[2]
    ){

        const symbol =
            result[0];

        if(symbol === "7️⃣"){
            multiplier = 10;
        }
        else if(symbol === "👑"){
            multiplier = 8;
        }
        else if(symbol === "💎"){
            multiplier = 6;
        }
        else if(symbol === "🔔"){
            multiplier = 4;
        }
        else if(symbol === "🍒"){
            multiplier = 3;
        }
        else{
            multiplier = 2;
        }

    }
    else if(
        result[0] === result[1] ||
        result[1] === result[2] ||
        result[0] === result[2]
    ){

        multiplier = 2;

    }


    if(multiplier > 0){

        const win =
            bet * multiplier;

        balance += win;

        reels.forEach(reel=>{
            reel.classList.add("win");
        });

        showResult(
            "🎉 ВИГРАШ +" +
            win +
            " YMY  •  x" +
            multiplier,
            true
        );

    }
    else{

        showResult(
            "Цього разу без виграшу. Спробуйте ще раз.",
            false
        );

    }


    updateBalance();

    document.getElementById("machineBalance").textContent =
        Math.floor(balance) + " YMY";

    document.getElementById("gameBalance").textContent =
        Math.floor(balance) + " YMY";


    spinning = false;

    const button =
        document.getElementById("spinMain");

    button.disabled = false;

    button.textContent =
        "🎰 КРУТИТИ";

}


function showResult(text,win){

    const result =
        document.getElementById("gameResult");

    if(!result) return;

    result.textContent = text;

    result.className =
        "game-result " +
        (win ? "win-text" : "lose-text");

}

        document.querySelector(
            `[data-page="${page}"]`

    .onclick=()=>{

        const extra =

                Math.random()*1440

        wheelRotation += extra;

        wheel.style.transform =
            `rotate(${wheelRotation}deg)`;


        setTimeout(()=>{

            const prizes=[
                5,
                10,
                15,
                25,
                50,
                75,
                100,
                0
            ];

            const prize =
                prizes[
                    Math.floor(
                        Math.random()*prizes.length
                    )
                ];


            balance += prize;

            updateBalance();
            saveData();


            document
                .getElementById("wheelResult")
                .textContent =
                prize
                ? "🎉 Ви виграли " + prize + " YMY!"

            wheelSpinning=false;

        },4000);

    };
