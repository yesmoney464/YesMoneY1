/* =========================================================
   РЕНДЕР ІГОР
========================================================= */

function renderYesMoneyGames(
    list = yesMoneyGames
) {

    const popular =
        document.getElementById(
            "popularGames"
        );

    const newest =
        document.getElementById(
            "newGames"
        );

    if (!popular || !newest)
        return;


    const createCards =
        games => {

            return games.map(
                (game,index) => `

                <div
                    class="casino-game"
                    onclick="openRealDemo(${index})">

                    <div
                        class="game-cover
                        ${game.cover}">

                        <div
                            class="game-cover-icon">

                            ${game.icon}

                        </div>

                    </div>


                    <span class="game-tag">
                        ${game.tag}
                    </span>


                    <button
                        class="game-fav"
                        onclick="event.stopPropagation();toggleFavorite(this)">
                        ♡
                    </button>


                    <div class="game-cover-name">

                        <strong>
                            ${game.name}
                        </strong>

                        <small>
                            ${game.desc}
                        </small>

                    </div>

                </div>
            `
            ).join("");
        };


    popular.innerHTML =
        createCards(
            list.slice(0,6)
        );


    newest.innerHTML =
        createCards(
            list.slice(4,10)
        );
}


/* =========================================================
   ПОШУК
========================================================= */

function searchCasinoGames(value) {

    const query =
        value.toLowerCase().trim();


    const filtered =
        yesMoneyGames.filter(game =>
            game.name
                .toLowerCase()
                .includes(query)
        );


    renderYesMoneyGames(
        query
        ? filtered
        : yesMoneyGames
    );
}


/* =========================================================
   ФІЛЬТРИ
========================================================= */

function casinoFilter(
    type,
    button
) {

    document
        .querySelectorAll(
            ".casino-category"
        )
        .forEach(
            el =>
            el.classList.remove(
                "active"
            )
        );


    button.classList.add(
        "active"
    );


    let list =
        yesMoneyGames;


    if (type === "popular") {

        list =
            yesMoneyGames.slice(0,6);
    }


    if (type === "new") {

        list =
            yesMoneyGames.filter(
                game =>
                    game.tag === "NEW"
            );
    }


    if (type === "slots") {

        list =
            yesMoneyGames;
    }


    if (type === "fast") {

        openCasinoDemo(
            "⚡",
            "Швидкі ігри"
        );

        return;
    }


    if (type === "favorites") {

        openCasinoDemo(
            "❤️",
            "Обрані ігри"
        );

        return;
    }


    renderYesMoneyGames(list);


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================

function toggleFavorite(button) {

    if (
        button.textContent === "♡"
    ) {

        button.textContent = "♥";

        button.style.color =
            "#ffd52e";

    } else {

        button.textContent = "♡";

        button.style.color =
            "white";
    }
}

/* =========================================================
   SPIN ДЕМО
========================================================= */

function demoSpin() {

    const cost = 5;


    if (balance < cost) {

        document
            .getElementById(
                "demoResult"
            )
            .textContent =
            "Недостатньо YMY.";

        return;
    }


    balance -= cost;

    updateBalance();


    const result =
        document.getElementById(
            "demoResult"
        );


    result.textContent =
        "🎰 Обертання...";


    setTimeout(() => {

        const win =
            Math.random() < .35;


        if (win) {

            const prize =
                Math.floor(
                    Math.random()*150
                ) + 10;


            balance += prize;

            updateBalance();


            document
                .getElementById(
                    "demoGameBalance"
                )
                .textContent =
                balance;


            result.innerHTML =
                `🎉 ВИГРАШ +${prize} YMY!`;

        } else {

            document
                .getElementById(
                    "demoGameBalance"
                )
                .textContent =
                balance;


            result.textContent =
                "Спробуйте ще раз 🍀";
        }

    },1000);
}
