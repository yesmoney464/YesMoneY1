/* =========================================
   YESMONEY CASINO

========================================= */

const content = document.getElementById("content");

let balance = Number(localStorage.getItem("ymy_demo_balance"));

let soundOn = true;
let audioCtx = null;

let currentGame = null;

/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!soundOn) return;

    if(!audioCtx){

        try{
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }catch(e){
            return;
        }
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

function tone(freq,duration,type="sine",volume=.035){

    if(!soundOn) return;

    initAudio();

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function spinSound(){

    tone(120,.08,"sawtooth",.025);

    setTimeout(()=>{
        tone(170,.08,"sawtooth",.02);
    },100);

    setTimeout(()=>{
        tone(220,.08,"sawtooth",.018);
    },200);
}

function winSound(){

    [523,659,784,1046].forEach((f,i)=>{
        setTimeout(()=>{
            tone(f,.22,"sine",.045);
        },i*90);
    });
}

}

/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(text,isWin=false){

    toast.textContent = text;

    toast.classList.toggle(
        "win-toast",
        isWin
    );

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        toast.classList.remove("show");

}

/* =========================================

========================================= */

                btn.dataset.page === page

        });

}

document.querySelectorAll(".nav")
.forEach(btn=>{

function gameCard(game){

    let title = "777";

    if(game.art==="candy"){
        title = "CANDY";
    }

    if(game.art==="diamond"){
        title = "DIAMOND";
    }

    return `

        <article
            class="game-card"
            onclick="openGame('${game.id}')">

            <div class="game-art art${capitalize(game.art)}">

                <div class="
                    art-title
                    ${game.art==="candy"?"candy":""}
                    ${game.art==="diamond"?"diamond":""}
                ">
                    ${title}
                </div>

            </div>

            <div class="game-info">

                <h3>
                    ${game.name}

                <p>
                    ${game.subtitle}
                </p>

            </div>

        </article>

    `;

function changeBet(amount){

    if(spinning) return;

    clickSound();

    bet += amount;

    if(bet < 5){
        bet = 5;
    }

    if(bet > 100){
        bet = 100;
    }

    const el =
        document.getElementById("betValue");

    if(el){
        el.textContent = bet;
    }

}

/* =========================================
   SPIN
========================================= */

function spin(){

    if(spinning) return;

    initAudio();

    if(balance < bet){

        showToast(
            "Недостатньо YMY для цієї ставки."
        );

        return;
    }

    spinning = true;

    balance -= bet;

    updateBalance();

    const button =
        document.getElementById("spinButton");

    button.disabled = true;
    button.textContent = "ОБЕРТАЄТЬСЯ...";

    document.querySelectorAll(".reel")
        .forEach(r=>{
            r.classList.add("spinning");
            r.classList.remove("win");
        });

    document.getElementById("winValue")
        .classList.remove("big-win");

    document.getElementById("winValue")
        .textContent = "…";

    spinSound();

    const g = currentGame;

    const results = [
        randomSymbol(g),
        randomSymbol(g),
        randomSymbol(g)
    ];

    animateReel(0,results[0],800);
    animateReel(1,results[1],1200);
    animateReel(2,results[2],1600);

    setTimeout(()=>{

        finishSpin(results);

    },1850);

}

function animateReel(index,finalSymbol,duration){

    const el =
        document.getElementById("r"+index);

    let timer =
        setInterval(()=>{

            const symbols =
                currentGame.symbols;

            el.textContent =
                symbols[
                    Math.floor(
                        Math.random()*symbols.length
                    )
                ];

        },70);

    setTimeout(()=>{

        clearInterval(timer);

        el.textContent =
            finalSymbol;

    },duration);

}

function randomSymbol(g){

    return g.symbols[
        Math.floor(
            Math.random()*g.symbols.length
        )
    ];

}

function finishSpin(results){

    const g = currentGame;

    document.querySelectorAll(".reel")
        .forEach(r=>{
            r.classList.remove("spinning");
        });

    let win = 0;

    if(
        results[0]===results[1] &&
        results[1]===results[2]
    ){

        const multiplier =
            g.payouts[results[0]] || 2;

        win =
            bet * multiplier;

    }else if(
        results[0]===results[1] ||
        results[1]===results[2] ||
        results[0]===results[2]
    ){

        const pair =
            results[0]===results[1]
                ? results[0]
                : results[1]===results[2]
                    ? results[1]
                    : results[0];

        const multiplier =
            Math.max(
                1,
                Math.floor(
                    (g.payouts[pair] || 2) / 3
                )
            );

        win =
            bet * multiplier;

    }

    if(win>0){

        balance += win;

        updateBalance();

        document.querySelectorAll(".reel")
            .forEach(r=>{
                r.classList.add("win");
            });

        const winEl =
            document.getElementById("winValue");

        winEl.textContent =
            "+" + win + " YMY";

        winEl.classList.add("big-win");

        winSound();

        showToast(
            "🎉 Виграш +" + win + " YMY!",
            true
        );

    }else{

        document.getElementById("winValue")
            .textContent = "0 YMY";

        showToast(
            "Раунд завершено. Цього разу без виграшу."
        );

    }

    const button =
        document.getElementById("spinButton");

    button.disabled = false;
    button.textContent = "КРУТИТИ";

    spinning = false;

}
