<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>YesMoneY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --gold:#f5c451;
    --gold2:#ffdf78;
    --bg:#070809;
    --panel:#111315;
    --panel2:#171a1d;
    --text:#fff;
    --muted:#8d9299;
    --line:rgba(255,210,80,.13);
}

html,body{
    min-height:100%;
    background:var(--bg);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   BACKGROUND
========================= */

body:before{
    content:"";
    position:fixed;
    inset:-40%;
    z-index:-2;
    background:
        radial-gradient(circle at 50% 0%,rgba(245,196,81,.14),transparent 28%),
        radial-gradient(circle at 10% 60%,rgba(255,180,40,.05),transparent 30%),
        radial-gradient(circle at 90% 70%,rgba(255,210,80,.04),transparent 30%);
    animation:bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

/* =========================
   WELCOME
========================= */

#welcomeScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:35px 20px 40px;
    background:
        radial-gradient(circle at 50% 25%,rgba(245,196,81,.13),transparent 32%),
        #070809;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:var(--gold);
    text-shadow:0 0 20px rgba(245,196,81,.45);
}

.auth-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.auth-btn{
    padding:13px 20px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#151719;
    color:white;
    font-weight:800;
}

.auth-btn.primary{
    color:#15110a;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    border:0;
    box-shadow:0 8px 30px rgba(245,196,81,.18);
}

.welcome-content{
    max-width:500px;
    margin:auto;
    text-align:center;
}

.welcome-icon{
    font-size:70px;
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-10px)}
}

.welcome-content h1{
    font-size:29px;
    margin-bottom:12px;
}

.welcome-content p{
    color:var(--muted);
    line-height:1.6;
}

.welcome-bottom{
    text-align:center;
    color:#555;
    font-size:12px;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    padding-bottom:90px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:30;
    padding:18px 16px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(7,8,9,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.04);
}

.top-logo{
    font-size:23px;
    font-weight:900;
}

.top-logo span{
    color:var(--gold);
}

.balance{
    padding:9px 13px;
    border-radius:13px;
    background:#141618;
    border:1px solid var(--line);
    font-weight:900;
    box-shadow:0 0 20px rgba(245,196,81,.05);
}

.balance small{
    color:#777;
}

.content{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:14px 14px 25px;
}

.page{
    animation:pageIn .3s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.page-title{
    font-size:29px;
    margin:10px 0 6px;
}

.page-subtitle{
    color:#777d84;
    margin-bottom:20px;
}

/* =========================
   CATEGORY BAR
========================= */

.category-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.06);
    background:#111315;
    color:#858a90;
    border-radius:12px;
    padding:9px 13px;
    font-size:12px;
    font-weight:800;
}

.category.active{
    color:#17120a;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
}

/* =========================
   GAME CARDS
========================= */

.games-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.game-card{
    position:relative;
    min-height:205px;
    overflow:hidden;
    border-radius:19px;
    background:#101214;
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.25s;
}

.game-card:active{
    transform:scale(.97);
}

.game-cover{
    height:145px;
    position:relative;
    overflow:hidden;
}

.game-cover svg{
    width:100%;
    height:100%;
    display:block;
}

.game-cover:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.75));
    pointer-events:none;
}

.game-info{
    position:absolute;
    left:12px;
    right:12px;
    bottom:10px;
    z-index:2;
}

.game-name{
    font-size:15px;
    font-weight:900;
}

.game-type{
    margin-top:4px;
    color:#999;
    font-size:11px;
}

.play-badge{
    position:absolute;
    right:9px;
    top:9px;
    z-index:4;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.15);
}

/* =========================
   GAME SCREEN
========================= */

.game-screen{
    animation:pageIn .3s ease;
}

.game-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.back-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:#141618;
    color:white;
    font-size:20px;
}

.game-header h2{
    font-size:21px;
}

.game-stage{
    position:relative;
    min-height:430px;
    border-radius:24px;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 25%,rgba(245,196,81,.12),transparent 30%),
        #0d0f11;
    border:1px solid var(--line);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

/* =========================
   777 GAME
========================= */

.slot-machine{
    padding:20px 15px;
}

.slot-title{
    text-align:center;
    font-size:35px;
    font-weight:1000;
    letter-spacing:5px;
    color:var(--gold);
    text-shadow:
        0 0 10px rgba(245,196,81,.6),
        0 0 30px rgba(245,196,81,.25);
}

.slot-reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:25px;
    padding:10px;
    border-radius:18px;
    background:#070809;
    border:2px solid rgba(245,196,81,.2);
}

.reel{
    height:115px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    background:linear-gradient(#202327,#0b0c0e);
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
}

.reel.spinning{
    animation:reelShake .09s linear infinite;
}

@keyframes reelShake{
    50%{transform:translateY(5px)}
}

.slot-result{
    min-height:34px;
    text-align:center;
    margin-top:16px;
    font-weight:900;
    color:var(--gold);
}

.big-spin{
    display:block;
    width:100%;
    margin-top:10px;
    padding:16px;
    border:0;
    border-radius:15px;
    color:#17120a;
    font-weight:1000;
    font-size:16px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    box-shadow:0 8px 30px rgba(245,196,81,.16);
}

.win-effect{
    animation:winFlash .65s ease 3;
}

@keyframes winFlash{
    0%,100%{box-shadow:0 0 0 rgba(245,196,81,0)}
    50%{box-shadow:0 0 60px rgba(245,196,81,.7)}
}

/* =========================
   LINE GAME
========================= */

.line-game{
    padding:20px;
}

.line-board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-top:22px;
}

.line-cell{
    aspect-ratio:1;
    border-radius:12px;
    background:linear-gradient(145deg,#20252a,#0d0f11);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    transition:.25s;
}

.line-cell.active{
    border-color:var(--gold);
    box-shadow:0 0 22px rgba(245,196,81,.55);
    transform:scale(1.06);
}

.line-svg{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.line-svg line{
    stroke:var(--gold);
    stroke-width:5;
    stroke-linecap:round;
    filter:drop-shadow(0 0 7px rgba(245,196,81,.8));
    stroke-dasharray:500;
    animation:drawLine .7s ease forwards;
}

@keyframes drawLine{
    from{stroke-dashoffset:500}
    to{stroke-dashoffset:0}
}

/* =========================
   BONUS
========================= */

.bonus-card{
    padding:20px;
    margin-bottom:12px;
    border-radius:20px;
    background:#111315;
    border:1px solid rgba(255,255,255,.07);
}

.bonus-icon{
    font-size:35px;
    margin-bottom:10px;
}

.bonus-card p{
    color:#777;
    line-height:1.5;
    font-size:14px;
    margin-top:6px;
}

.bonus-price{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
}

.gold-btn{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#17120a;
    font-weight:900;
}

/* =========================
   PROFILE
========================= */

.profile-card{
    padding:21px;
    border-radius:21px;
    background:#111315;
    border:1px solid rgba(255,255,255,.07);
    margin-bottom:13px;
}

.avatar{
    width:68px;
    height:68px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#9c7624,var(--gold));
    color:#17120a;
    font-size:27px;
    font-weight:1000;
    margin-bottom:14px;
}

.profile-name{
    font-size:21px;
    font-weight:900;
}

.profile-id{
    color:#666;
    font-size:12px;
    margin-top:5px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.info-row span:first-child{
    color:#777;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(9,10,11,.95);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(245,196,81,.1);
}

.nav-btn{
    border:0;
    background:none;
    color:#65696e;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
}

.nav-icon{
    font-size:22px;
}

.nav-btn span:last-child{
    font-size:10px;
    font-weight:700;
}

.nav-btn.active{
    color:var(--gold);
}

.nav-btn.active .nav-icon{
    filter:drop-shadow(0 0 8px rgba(245,196,81,.7));
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.76);
    backdrop-filter:blur(9px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    border-radius:23px;
    padding:24px;
    background:#151719;
    border:1px solid rgba(245,196,81,.15);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(18px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.close{
    float:right;
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#25282c;
    color:white;
    font-size:21px;
}

.modal-box h2{
    font-size:22px;
    margin-bottom:8px;
}

.modal-box p{
    color:#777;
    line-height:1.5;
}

.unavailable-icon{
    text-align:center;
    font-size:50px;
    margin:10px 0 15px;
}

/* =========================
   WHEEL
========================= */

.wheel{
    width:240px;
    height:240px;
    margin:25px auto;
    border-radius:50%;
    border:8px solid rgba(245,196,81,.25);
    background:
        conic-gradient(
            var(--gold) 0deg 45deg,
            #22262a 45deg 90deg,
            #d9a933 90deg 135deg,
            #22262a 135deg 180deg,
            var(--gold) 180deg 225deg,
            #22262a 225deg 270deg,
            #d9a933 270deg 315deg,
            #22262a 315deg 360deg
        );
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 4s cubic-bezier(.12,.7,.18,1);
    box-shadow:0 0 45px rgba(245,196,81,.15);
}

.wheel-center{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#111315;
    border:5px solid rgba(255,255,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:1000;
}

.cooldown{
    text-align:center;
    color:#777;
    font-size:13px;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
    .games-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:360px){
    .game-cover{
        height:130px;
    }

    .reel{
        height:95px;
        font-size:39px;
    }
}
</style>

</head>

<script>
"use strict";

/* =========================
   DATA
========================= */

const state = {
    balance:Number(localStorage.getItem("ymyBalance") || 50),
    name:localStorage.getItem("ymyName") || "",
    id:localStorage.getItem("ymyId") || "",
    registered:localStorage.getItem("ymyRegistered")==="1",
    wheelTime:Number(localStorage.getItem("ymyWheelTime") || 0),
    currentGame:null
};

const games=[
    {
        id:"777",
        name:"777 GOLD",
        type:"Класичний слот",
        symbols:["7️⃣","🍋","💎","⭐","🍒"]
    },
    {
        id:"sweet",
        name:"Sweet Candy",
        type:"Лінії",
        symbols:["🍬","🍭","🍓","🍇","🍒"]
    },
    {
        id:"diamond",
        name:"Diamond Lines",
        type:"Лінії",
        symbols:["💎","🔷","💠","👑","✨"]
    },
    {
        id:"fruit",
        name:"Fruit Lines",
        type:"Лінії",
        symbols:["🍊","🍋","🍉","🍒","🍇"]
    },
    {
        id:"royal",
        name:"Royal Gold",
        type:"Лінії",
        symbols:["👑","💰","💎","A","K"]
    },
    {
        id:"rocket",
        name:"Rocket Rise",
        type:"Ігровий режим",
        symbols:["🚀","⭐","💎","🔥","⚡"]
    }
];

/* =========================
   ELEMENTS
========================= */

const welcome=document.getElementById("welcomeScreen");
const app=document.getElementById("app");
const main=document.getElementById("mainContent");
const balanceEl=document.getElementById("balanceValue");

function save(){
    localStorage.setItem("ymyBalance",state.balance);
    localStorage.setItem("ymyName",state.name);
    localStorage.setItem("ymyId",state.id);
    localStorage.setItem("ymyRegistered",state.registered?"1":"0");
    localStorage.setItem("ymyWheelTime",state.wheelTime);
}

function updateBalance(){
    balanceEl.textContent=Math.floor(state.balance);
    save();
}

function openApp(){
    welcome.classList.add("hidden");
    app.classList.remove("hidden");
    updateBalance();
    showPage("games");
}

/* =========================
   SVG COVERS
========================= */

function cover(game,index){

    const backgrounds=[
        ["#251400","#9a6500"],
        ["#250016","#c52a82"],
        ["#001c28","#007eaa"],
        ["#211300","#b85a00"],
        ["#160d00","#b48720"],
        ["#001b19","#007c69"]
    ];

    const bg=backgrounds[index%backgrounds.length];

    return `
    <svg viewBox="0 0 500 280"
         preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">

        <defs>
            <linearGradient id="g${index}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="${bg[0]}"/>
                <stop offset="1" stop-color="${bg[1]}"/>
            </linearGradient>

            <radialGradient id="r${index}">
                <stop stop-color="#fff" stop-opacity=".3"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <rect width="500" height="280" fill="url(#g${index})"/>

        <circle cx="390" cy="45" r="130"
                fill="url(#r${index})"/>

/* =========================
   777
========================= */

function render777(game){

    state.currentGame="777";

    main.innerHTML=`
    <div class="game-screen">

        <div class="game-header">
            <button class="back-btn" onclick="gamesPage()">‹</button>
            <h2>777 GOLD</h2>
        </div>

        <div class="game-stage slot-machine" id="slotStage">

            <div class="slot-title">777</div>

            <div class="slot-reels">
                <div class="reel" id="r1">7️⃣</div>
                <div class="reel" id="r2">💎</div>
                <div class="reel" id="r3">7️⃣</div>
            </div>

            <div class="slot-result" id="slotResult"></div>

            <button class="big-spin"
                    id="slotSpin"
                    onclick="spin777()">
                КРУТИТИ
            </button>

        </div>

    </div>`;
}

function spin777(){

    const button=document.getElementById("slotSpin");

    if(!button)return;

    button.disabled=true;
    button.textContent="ОБЕРТАЄТЬСЯ...";

    const reels=[
        document.getElementById("r1"),
        document.getElementById("r2"),
        document.getElementById("r3")
    ];

    reels.forEach(r=>r.classList.add("spinning"));

    const symbols=["7️⃣","💎","🍒","🍋","⭐"];

    let ticks=0;

    const interval=setInterval(()=>{

        reels.forEach(r=>{
            r.textContent=
                symbols[Math.floor(Math.random()*symbols.length)];
        });

        ticks++;

        if(ticks>28){

            clearInterval(interval);

            reels.forEach(r=>r.classList.remove("spinning"));

            const result=[
                symbols[Math.floor(Math.random()*symbols.length)],
                symbols[Math.floor(Math.random()*symbols.length)],
                symbols[Math.floor(Math.random()*symbols.length)]
            ];

            reels.forEach((r,i)=>r.textContent=result[i]);

            const win=
                result[0]===result[1] &&
                result[1]===result[2];

            const stage=document.getElementById("slotStage");
            const text=document.getElementById("slotResult");

            if(win){

                const prize=
                    result[0]==="7️⃣"?100:25;

                state.balance+=prize;

                text.textContent=
                    `🎉 Виграш +${prize} YMY`;

                stage.classList.add("win-effect");

                setTimeout(()=>{
                    stage.classList.remove("win-effect");
                },2200);

                updateBalance();

            }else{

                text.textContent=
                    "Спробуйте ще раз ✨";
            }

            button.disabled=false;
            button.textContent="КРУТИТИ";

        }

    },100);
}

   LINE GAME
========================= */

function renderLineGame(game){

    state.currentGame=game.id;

    const cells=Array.from(
        {length:25},
        (_,i)=>`
            <div class="line-cell" id="cell${i}">
                ${game.symbols[Math.floor(Math.random()*game.symbols.length)]}

    ).join("");

    main.innerHTML=`
    <div class="game-screen">

        <div class="game-header">
            <button class="back-btn" onclick="gamesPage()">‹</button>
            <h2>${game.name}</h2>
        </div>

        <div class="game-stage line-game">

            <p style="color:#777">
                Лінійний демо-режим
            </p>

            <div class="line-board">
                ${cells}
            </div>

            <svg class="line-svg"
                 id="lineSvg"
                 viewBox="0 0 100 100"
                 preserveAspectRatio="none"></svg>

            <div id="lineResult"
                 style="text-align:center;min-height:30px;margin-top:15px;color:#f5c451;font-weight:900">
            </div>

            <button class="big-spin"
                    onclick="playLineGame()">
                ЗАПУСТИТИ
            </button>

        </div>

    </div>`;
}

function playLineGame(){

    const cells=
        [...document.querySelectorAll(".line-cell")];

    const result=
        document.getElementById("lineResult");

    cells.forEach(c=>c.classList.remove("active"));

    const row=
        Math.floor(Math.random()*5);

    const selected=[
        row*5,
        row*5+1,
        row*5+2,
        row*5+3,
        row*5+4
    ];

    selected.forEach((index,i)=>{

        setTimeout(()=>{
            cells[index].classList.add("active");
        },i*90);

    });

    setTimeout(()=>{

        const win=
            Math.random()<.42;

        if(win){

            const prize=
                10+Math.floor(Math.random()*41);

            state.balance+=prize;

            result.textContent=
                `✨ Лінія виграшу! +${prize} YMY`;

            updateBalance();

        }else{

            result.textContent=
                "Лінії не склалися. Спробуйте ще раз.";

        }

    },600);
}

/* =========================
   WHEEL
========================= */

let wheelSpinning=false;

function wheelPage(){

    const now=Date.now();
    const remaining=
        Math.max(0,
        86400000-(now-state.wheelTime));

    const hours=
        Math.floor(remaining/3600000);

    const minutes=
        Math.floor((remaining%3600000)/60000);

    main.innerHTML=`
    <div class="game-screen">

        <div class="game-header">
            <button class="back-btn" onclick="gamesPage()">‹</button>
            <h2>🎰 Барабан</h2>
        </div>

        <div class="game-stage"
             style="padding:20px">

            <p style="text-align:center;color:#777">
                Безкоштовне обертання раз на 24 години
            </p>

            <div class="wheel" id="wheel">
                <div class="wheel-center">YMY</div>
            </div>

            <div class="cooldown">
                ${remaining>0
                    ?`Наступне обертання через ${hours} год ${minutes} хв`
                    :"Обертання доступне"}
            </div>

            <button
                class="big-spin"
                id="wheelSpin"
                ${remaining>0?"disabled":""}
                onclick="spinWheel()">
                ${remaining>0?"НЕДОСТУПНО":"КРУТИТИ"}
            </button>

            <div id="wheelResult"
                 style="text-align:center;color:#f5c451;font-weight:900;margin-top:15px">
            </div>

        </div>

    </div>`;
}

function spinWheel(){

    if(wheelSpinning)return;

    wheelSpinning=true;

    const wheel=
        document.getElementById("wheel");

    const button=
        document.getElementById("wheelSpin");

    const result=
        document.getElementById("wheelResult");

    button.disabled=true;

    const rotation=
        1440+Math.floor(Math.random()*1440);

    wheel.style.transform=
        `rotate(${rotation}deg)`;

    setTimeout(()=>{

        const prizes=[5,10,15,25,50,75,100];

        const prize=
            prizes[Math.floor(Math.random()*prizes.length)];

        state.balance+=prize;
        state.wheelTime=Date.now();

        updateBalance();

        result.textContent=
            `🎉 Ви отримали ${prize} YMY!`;

        wheelSpinning=false;

        setTimeout(wheelPage,1800);

    },4000);
}

/* =========================
   AUTH
========================= */

const authModal=
    document.getElementById("authModal");

let loginMode=false;

function openAuth(login){

    loginMode=login;

    document.getElementById("authTitle").textContent=
        login?"Вхід":"Реєстрація";

    document.getElementById("authSubtitle").textContent=
        login
        ?"Ласкаво просимо назад"
        :"Створіть свій акаунт YesMoneY";

    document.getElementById("authName").style.display=
        login?"none":"block";

    document.getElementById("authSubmit").textContent=
        login?"УВІЙТИ":"СТВОРИТИ АКАУНТ";

    document.getElementById("authSwitch").textContent=
        login
        ?"Немає акаунта? Зареєструватися"
        :"Вже маєте акаунт? Увійти";

    authModal.classList.add("active");
}

document.getElementById("loginButton")
    .onclick=()=>openAuth(true);

document.getElementById("registerButton")
    .onclick=()=>openAuth(false);

document.getElementById("closeAuth")
    .onclick=()=>authModal.classList.remove("active");

document.getElementById("authSwitch")
    .onclick=()=>openAuth(!loginMode);

document.getElementById("authSubmit")
    .onclick=()=>{

        const email=
            document.getElementById("authEmail").value.trim();

        if(!email){
            document.getElementById("authEmail").focus();
            return;
        }

        if(loginMode){

            state.name=
                email.split("@")[0];

        }else{

            const name=
                document.getElementById("authName").value.trim();

            state.name=
                name||email.split("@")[0];

            state.registered=true;

            if(!state.id){
                state.id=
                    "YMY-"+
                    Math.random()
                    .toString(36)
                    .substring(2,9)
                    .toUpperCase();
            }

            state.balance=50;
        }

        if(!state.id){
            state.id=
                "YMY-"+
                Math.random()
                .toString(36)
                .substring(2,9)
                .toUpperCase();
        }

        save();

        authModal.classList.remove("active");

        openApp();
    };
