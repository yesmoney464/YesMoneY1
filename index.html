<body>

<div id="app" class="app">

<header class="topbar">
 <div class="logo">Yes<span>MoneY</span></div>
 <div class="balance">
   <span id="balance">1000</span>
   <small>YMY</small>
 </div>
</header>

<main id="content" class="content"></main>

<nav class="bottom">
 <button class="nav active" data-page="home">
   <span class="ico">⌂</span>Головна
 </button>
 <button class="nav" data-page="games">
   <span class="ico">◈</span>Ігри
 </button>
 <button class="nav" data-page="bonus">
   <span class="ico">✦</span>Бонуси
 </button>
 <button class="nav" data-page="support">
   <span class="ico">?</span>Підтримка
 </button>
 <button class="nav" data-page="profile">
   <span class="ico">○</span>Профіль
 </button>
</nav>

</div>

<div id="gameScreen" class="game-screen hidden"></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================
   YesMoneY DEMO CASINO 3.0
   УСІ КОШТИ В ЦІЙ ВЕРСІЇ Є ВІРТУАЛЬНИМИ YMY
===================================================== */

const state={
 balance:Number(localStorage.getItem("ymy_balance"))||1000,
 name:localStorage.getItem("ymy_name")||"DemoPlayer",
 history:JSON.parse(localStorage.getItem("ymy_history")||"[]"),
 sound:true,
 daily:false
};

const games=[
 {
  id:"777",
  name:"777 GOLD",
  category:"slots",
  desc:"Класичний преміальний слот",
  symbol:"777",
  c1:"#c18b26",c2:"#111"
 },
 {
  id:"sweet",
  name:"SWEET FRUITS",
  category:"slots",
  desc:"Каскадні комбінації",
  symbol:"✦",
  c1:"#b22f62",c2:"#26132d"
 },
 {
  id:"diamond",
  name:"DIAMOND RUSH",
  category:"slots",
  desc:"Коштовні камені",
  symbol:"◆",
  c1:"#146b75",c2:"#08191d"
 },
 {
  id:"aviator",
  name:"AVIATOR",
  category:"crash",
  desc:"Зупиніть раунд до падіння",
  symbol:"✈",
  c1:"#263746",c2:"#080b0e"
 },
 {
  id:"cards",
  name:"ДУРАК",
  category:"cards",
  desc:"Гра проти бота",
  symbol:"♠",
  c1:"#145737",c2:"#071c12"
 },
 {
  id:"roulette",
  name:"ROULETTE",
  category:"table",
  desc:"Демо-рулетка",
  symbol:"R",
  c1:"#761d26",c2:"#100809"
 }
];

const content=document.getElementById("content");
const balanceEl=document.getElementById("balance");
const gameScreen=document.getElementById("gameScreen");

function save(){
 localStorage.setItem("ymy_balance",state.balance);
 localStorage.setItem("ymy_name",state.name);
 localStorage.setItem("ymy_history",JSON.stringify(state.history));
}

function updateBalance(){
 balanceEl.textContent=Math.floor(state.balance);
 save();
}

function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2200);
}

function addHistory(game,result,amount){
 state.history.unshift({
  game,
  result,
  amount,
  time:new Date().toLocaleString("uk-UA")
 });
 state.history=state.history.slice(0,30);
 save();
}

function pageNav(page){
 document.querySelectorAll(".nav").forEach(n=>{
  n.classList.toggle("active",n.dataset.page===page);
 });
}

function renderHome(){
 pageNav("home");
 content.innerHTML=`
 <section class="hero">
   <div class="hero-label">YesMoneY Demo</div>
   <h1>Преміальний світ демо-ігор</h1>
   <p>Грайте за віртуальні YMY, тестуйте ігри та знайомтеся з платформою.</p>
   <button class="gold-btn" onclick="openGame('777')">Грати зараз</button>
 </section>

 <div class="section-head">
   <h2>Популярні ігри</h2>
   <span>DEMO</span>
 </div>

 <div class="games">
   ${games.slice(0,4).map(gameCard).join("")}
 </div>

 <div class="section-head">
   <h2>Щоденний бонус</h2>
 </div>

 <div class="support">
   <strong>Отримайте 100 YMY</strong>
   <p style="color:#777;margin-top:7px">Віртуальний бонус доступний один раз на добу.</p>
   <button class="gold-btn" style="margin-top:14px" onclick="dailyBonus()">Отримати бонус</button>
 </div>
 `;
}

function gameCard(g){
 return `
 <div class="game" onclick="openGame('${g.id}')">
   <div class="game-art" style="--c1:${g.c1};--c2:${g.c2}" data-symbol="${g.symbol}">
     <span class="game-badge">DEMO</span>
   </div>
   <div class="game-info">
     <strong>${g.name}</strong>
     <small>${g.desc}</small>
   </div>
 </div>`;
}

function renderGames(filter="all"){
 pageNav("games");
 const list=filter==="all"?games:games.filter(g=>g.category===filter);
 content.innerHTML=`
 <h1 class="page-title">Ігри</h1>
 <p class="subtitle">Оберіть демо-гру</p>

 <div class="categories">
  <button class="category ${filter==="all"?"active":""}" onclick="renderGames('all')">Усі</button>
  <button class="category ${filter==="slots"?"active":""}" onclick="renderGames('slots')">Слоти</button>
  <button class="category ${filter==="crash"?"active":""}" onclick="renderGames('crash')">Crash</button>
  <button class="category ${filter==="cards"?"active":""}" onclick="renderGames('cards')">Карти</button>
  <button class="category ${filter==="table"?"active":""}" onclick="renderGames('table')">Інше</button>
 </div>

 <div class="games" style="margin-top:15px">
 ${list.map(gameCard).join("")}
 </div>
 `;
}

function renderBonus(){
 pageNav("bonus");
 content.innerHTML=`
 <h1 class="page-title">Бонуси</h1>
 <p class="subtitle">Тільки віртуальні YMY</p>

 <div class="support">
  <strong>Щоденний бонус</strong>
  <p style="color:#777;margin-top:7px">100 YMY один раз на 24 години.</p>
  <button class="gold-btn" style="margin-top:15px" onclick="dailyBonus()">Забрати</button>
 </div>

 <div class="support" style="margin-top:12px">
  <strong>Стартовий баланс</strong>
  <p style="color:#777;margin-top:7px">Віртуальний баланс використовується лише всередині демо-платформи.</p>
 </div>

 <div class="notice">
  У цій версії немає поповнення, виведення або ставок реальних коштів.
 </div>
 `;
}

function dailyBonus(){
 const last=Number(localStorage.getItem("ymy_daily")||0);
 if(Date.now()-last<86400000){
  toast("Бонус уже отримано. Спробуйте пізніше.");
  return;
 }
 state.balance+=100;
 localStorage.setItem("ymy_daily",Date.now());
 updateBalance();
 toast("+100 YMY отримано!");
}

function renderProfile(){
 pageNav("profile");
 const initial=(state.name[0]||"D").toUpperCase();
 content.innerHTML=`
 <h1 class="page-title">Профіль</h1>
 <p class="subtitle">Ваш демо-кабінет</p>

 <div class="profile">
  <div class="profile-card">
   <div class="avatar">${initial}</div>
   <h2>${state.name}</h2>
   <p style="color:#777;margin-top:5px">DEMO ACCOUNT</p>

   <div style="margin-top:18px">
    <div class="stat"><span>Баланс</span><strong>${Math.floor(state.balance)} YMY</strong></div>
    <div class="stat"><span>Ігор зіграно</span><strong>${state.history.length}</strong></div>
    <div class="stat"><span>Статус</span><strong style="color:var(--gold2)">DEMO</strong></div>
   </div>
  </div>

  <div class="profile-card">
   <h3>Історія</h3>
   <div style="margin-top:10px">
    ${
     state.history.length
     ? state.history.slice(0,8).map(x=>`
       <div class="stat">
        <span>${x.game}</span>
        <strong style="color:${x.amount>=0?"var(--green)":"var(--red)"}">
         ${x.amount>=0?"+":""}${x.amount} YMY
        </strong>
       </div>`).join("")
     : `<p style="color:#777;margin-top:12px">Історія поки порожня.</p>`
    }
   </div>
  </div>
 </div>
 `;
}

function renderSupport(){
 pageNav("support");
 content.innerHTML=`
 <h1 class="page-title">Підтримка</h1>
 <p class="subtitle">Ми допоможемо розібратися з платформою</p>

 <div class="support">
  <h2>Служба підтримки</h2>
  <p style="color:#777;line-height:1.5;margin-top:8px">
   Якщо у вас виникли питання щодо демо-платформи,
   зверніться до адміністратора або менеджера.
  </p>

  <button class="support-option" onclick="contactManager('telegram')">
   <strong>Telegram</strong>
   <small>Зв'язатися з менеджером</small>
  </button>

  <button class="support-option" onclick="contactManager('email')">
   <strong>Email</strong>
   <small>Надіслати звернення</small>
  </button>

  <button class="support-option" onclick="showSupportForm()">
   <strong>Повідомлення на сайті</strong>
   <small>Форма звернення до підтримки</small>
  </button>

function spin777(){
 if(slotBusy)return;
 const bet=10;
 if(state.balance<bet){toast("Недостатньо YMY.");return}
 slotBusy=true;
 state.balance-=bet;
 updateBalance();

 const reels=[
  document.getElementById("r1"),
  document.getElementById("r2"),
  document.getElementById("r3")
 ];
 reels.forEach(r=>r.classList.add("spin"));

 const symbols=["7","★","♦","BAR","$","7"];
 const values=[];

 let ticks=0;
 const interval=setInterval(()=>{
  reels.forEach(r=>r.textContent=symbols[Math.floor(Math.random()*symbols.length)]);
  ticks++;
  if(ticks>25){
   clearInterval(interval);
   reels.forEach(r=>r.classList.remove("spin"));

   values.push(...reels.map(r=>r.textContent));
   let win=0;

   if(values[0]===values[1]&&values[1]===values[2]){
    win=values[0]==="7"?100:50;
   }else if(values[0]===values[1]||values[1]===values[2]){
    win=20;
   }

   if(win){
    state.balance+=win;
    const w=document.getElementById("slotWin");
    w.textContent="ВИГРАШ +"+win+" YMY";
    w.classList.add("big");
    addHistory("777 GOLD","WIN",win-bet);
    setTimeout(()=>w.classList.remove("big"),1800);
   }else{
    document.getElementById("slotWin").textContent="Цього разу без виграшу";
    addHistory("777 GOLD","LOSS",-bet);
   }

   updateBalance();
   slotBusy=false;
  }
 },90);
}

/* CARDS */

let deck=[];
let playerHand=[];
let botHand=[];
let trump="♠";
let playerTurn=true;

function createDeck(){
 const suits=["♠","♥","♦","♣"];
 const ranks=["6","7","8","9","10","J","Q","K","A"];
 return suits.flatMap(s=>ranks.map(r=>({s,r})));
}

function renderCards(){
 deck=createDeck().sort(()=>Math.random()-.5);
 playerHand=deck.splice(0,6);
 botHand=deck.splice(0,6);
 trump=deck[deck.length-1].s;

 gameScreen.innerHTML=gameHeader("ДУРАК • DEMO")+`
 <div class="game-container">
  <div class="cards-table">
   <div class="trump">КОЗИР: <strong>${trump}</strong></div>
   <div class="card-area" id="botCards">
    ${botHand.map(()=>`<div class="card back">Y</div>`).join("")}
   </div>
   <div class="table-status" id="cardStatus">Ваш хід. Оберіть карту.</div>
   <div class="card-area" id="played"></div>
   <div class="hand" id="playerCards">
    ${playerHand.map((c,i)=>cardHTML(c,i)).join("")}
   </div>
  </div>
 </div>`;
}

function cardHTML(c,i){
 return `<div class="card ${["♥","♦"].includes(c.s)?"red":""}" onclick="playCard(${i})">${c.r}${c.s}</div>`;
}

function playCard(i){
 if(!playerTurn)return;
 if(!playerHand[i])return;

 const card=playerHand.splice(i,1)[0];
 const played=document.getElementById("played");
 played.innerHTML=cardHTML(card,0);
 document.getElementById("cardStatus").textContent="Бот думає...";

 playerTurn=false;

 setTimeout(()=>{
  if(botHand.length){
   const bi=Math.floor(Math.random()*botHand.length);
   const bc=botHand.splice(bi,1)[0];
   played.innerHTML+=cardHTML(bc,0);
  }

  playerTurn=true;

  if(playerHand.length===0){
   toast("Раунд завершено. Ви перемогли!");
   state.balance+=50;
   addHistory("ДУРАК","WIN",50);
   updateBalance();
   setTimeout(renderCards,1800);
   return;
  }

  if(botHand.length===0){
   toast("Бот переміг.");
   addHistory("ДУРАК","LOSS",0);
   setTimeout(renderCards,1800);
   return;
  }

  document.getElementById("playerCards").innerHTML=
   playerHand.map((c,j)=>cardHTML(c,j)).join("");

  document.getElementById("cardStatus").textContent=
   "Ваш хід. Оберіть карту.";
 },900);
}

let audioCtx=null;

function sound(){
 if(!state.sound)return;
 try{
  audioCtx=audioCtx||new AudioContext();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=520;
  g.gain.value=.035;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+.08);
 }catch(e){}
}

document.addEventListener("click",e=>{
 if(e.target.closest("button"))sound();
});
